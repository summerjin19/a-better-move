    this.buildCoords();
  }

  /** 좌표(a~h, 1~8)를 칸 귀퉁이에 그린다 */
  buildCoords() {
    const px = Math.round(this.size * this.dpr);
    this.coordLayer = document.createElement('canvas');
    this.coordLayer.width = px; this.coordLayer.height = px;
    if (!this.coords) return;
    const c = this.coordLayer.getContext('2d');
    c.scale(this.dpr, this.dpr);
    const sq = this.sq;
    const fs = Math.max(8, Math.round(sq * 0.2));
    c.font = '700 ' + fs + 'px Galmuri11, ui-monospace, monospace';
    for (let i = 0; i < 8; i++) {
      const fileIdx = this.flipped ? 7 - i : i;
      const rankIdx = this.flipped ? i : 7 - i;
      const lightBottom = (7 + i) % 2 === 0;
      c.fillStyle = lightBottom ? '#97918A' : '#FFFFFF';
      c.textAlign = 'right'; c.textBaseline = 'bottom';
      c.fillText('abcdefgh'[fileIdx], (i + 1) * sq - sq * 0.06, this.size - sq * 0.03);
      const lightLeft = i % 2 === 0;
      c.fillStyle = lightLeft ? '#97918A' : '#FFFFFF';
      c.textAlign = 'left'; c.textBaseline = 'top';
      c.fillText(String(rankIdx + 1), sq * 0.06, i * sq + sq * 0.05);
    }
  }

  /** 표시 옵션(좌표·힌트·글자)을 바꾼다 */
  setOptions(o) {
    let rebuild = false;
    if (o.coords !== undefined && o.coords !== this.coords) { this.coords = o.coords; rebuild = true; }
    if (o.hints !== undefined) this.hints = o.hints;
    if (o.letters !== undefined) this.letters = o.letters;
    if (o.flipped !== undefined && o.flipped !== this.flipped) { this.flipped = o.flipped; rebuild = true; }
    if (rebuild && this.size) this.buildCoords();
    this.draw();
  }

  /** 엔진 국면에서 기물 배치를 읽어 온다 */
  setFromPosition(pos) {
    for (let i = 0; i < 64; i++) this.pieces[i] = pos.board[to88(i)];
    this.draw();
  }

  /** 칸의 화면 위치(왼쪽 위, CSS px) */
  screenXY(sq) {
    const r = sq >> 3, f = sq & 7;
    const col = this.flipped ? 7 - f : f;
    const row = this.flipped ? r : 7 - r;
    return { x: col * this.sq, y: row * this.sq };
  }

  /** 칸 가운데의 화면 좌표 */
  squareCenter(sq) {
    const p = this.screenXY(sq);
    return { x: p.x + this.sq / 2, y: p.y + this.sq / 2 };
  }

  /** 터치한 칸을 찾아 콜백으로 넘긴다 */
  handlePointer(e) {
    if (this.fight) { e.preventDefault(); this.fight.skip(); return; }
    if (!this.onTap) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    const rect = this.canvas.getBoundingClientRect();
    const x = (e.clientX - rect.left) / rect.width * 8;
    const y = (e.clientY - rect.top) / rect.height * 8;
    if (x < 0 || y < 0 || x >= 8 || y >= 8) return;
    e.preventDefault();
    const col = Math.floor(x), row = Math.floor(y);
    const sq = this.flipped ? row * 8 + (7 - col) : (7 - row) * 8 + col;
    this.onTap(sq);
  }

  /** 선택한 칸과 갈 수 있는 칸을 표시한다 */
  setSelection(sq, targets) {
    this.selected = sq;
    this.selT = performance.now();
    this.targets = new Map();
    if (targets) for (const t of targets) this.targets.set(t.sq, t);
    this.draw();
  }

  /** 대국 종료 의식을 켜거나 끈다: winner 0/1이면 그 진영이 뛰며 만세, 상대는 무릎 꿇음 · -1이면 무승부(둘 다 무기 내려놓음) · null이면 끔 */
  setCeremony(winner) {
    this.ceremony = winner === null || winner === undefined ? null : { winner, t0: performance.now() };
    this.draw();
  }

  /** 체크된 킹 칸을 표시한다 (-1이면 해제) */
  setCheck(sq) {
    if (sq !== this.checkSq) this.checkT = performance.now();
    this.checkSq = sq;
    this.draw();
  }

  /**
   * 기물들을 옮긴다 (moves: [{piece, from, to}]). 종류별로 걷기·달리기·바퀴 굴리기 자세를 재생하며,
   * 가로로 움직이면 그쪽을 보고, 먼 거리는 조금 더 오래 걸린다. 움직임 줄이기 설정이면 짧게 미끄러진다
   */
  animate(moves, duration) {
    return new Promise((resolve) => {
      const t0 = performance.now();
      const group = { resolve, left: moves.length };
      for (const m of moves) {
        const type = m.piece & 7;
        const spec = MOVE_SPEC[type] || MOVE_SPEC[1];
        const p0 = this.screenXY(m.from), p1 = this.screenXY(m.to);
        const dist = Math.max(Math.abs(p1.x - p0.x), Math.abs(p1.y - p0.y)) / this.sq;
        const dur = this.reduce ? Math.min(duration, 90) : Math.round(spec.dur * Math.min(1.5, 1 + 0.08 * (dist - 1)));
        const facing = p1.x > p0.x + 1 ? 1 : p1.x < p0.x - 1 ? -1 : ((m.piece >> 3) === 0 ? 1 : -1);
        this.anims.push({ piece: m.piece, from: m.from, to: m.to, t0, dur, dist, hop: this.reduce ? 0 : spec.hop, facing, walk: !this.reduce, group, land: m.land !== false });
      }
      if (!moves.length) resolve();
      this.draw();
    });
  }

  /** 칸 위에 짧은 효과를 띄운다 (poof·sparkle·land) */
  effect(kind, sq) {
    this.effects.push({ kind, sq, t0: performance.now(), dur: kind === 'sparkle' ? 800 : kind === 'poof' ? 520 : 260, seed: Math.random() * 1000 });
    this.draw();
  }

  /** 다음 프레임에 다시 그린다 */
  draw() {
    if (this.raf) return;
    this.raf = requestAnimationFrame((t) => { this.raf = 0; this.render(t); });
  }

  /** 한 프레임을 그린다 */
  render(now) {
    if (!this.size || !this.field) return;
    now = now || performance.now();
    const ctx = this.ctx, sq = this.sq;
    let busy = false;
    const sh = this.fight ? this.fight.shake(now) : { x: 0, y: 0 };
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
    ctx.setTransform(1, 0, 0, 1, Math.round(sh.x * this.dpr), Math.round(sh.y * this.dpr));
    ctx.drawImage(this.field, 0, 0);
    ctx.setTransform(this.dpr, 0, 0, this.dpr, sh.x * this.dpr, sh.y * this.dpr);

    if (this.lastMove) {
      ctx.fillStyle = 'rgba(243, 180, 143, 0.8)';
      for (const s of [this.lastMove.from, this.lastMove.to]) { const p = this.screenXY(s); ctx.fillRect(p.x, p.y, sq, sq); }
    }
    for (const [s, color] of this.marks) { const p = this.screenXY(s); ctx.fillStyle = color; ctx.fillRect(p.x, p.y, sq, sq); }
    if (this.checkSq >= 0) {
      const c = this.squareCenter(this.checkSq);
      const age = now - this.checkT;
      const pulse = age < 1400 && !this.reduce ? 0.75 + 0.25 * Math.sin(age / 90) : 1;
      if (age < 1400) busy = true;
      const g = ctx.createRadialGradient(c.x, c.y, sq * 0.05, c.x, c.y, sq * 0.62);
      g.addColorStop(0, 'rgba(217, 102, 41, ' + (0.95 * pulse) + ')');
      g.addColorStop(0.55, 'rgba(217, 102, 41, ' + (0.6 * pulse) + ')');
      g.addColorStop(1, 'rgba(217, 102, 41, 0)');
      ctx.fillStyle = g;
      const p = this.screenXY(this.checkSq);
      ctx.fillRect(p.x, p.y, sq, sq);
    }
    if (this.selected >= 0) {
      const p = this.screenXY(this.selected);
      ctx.fillStyle = 'rgba(143, 208, 216, 0.92)';
      ctx.fillRect(p.x, p.y, sq, sq);
      ctx.lineWidth = Math.max(2, sq * 0.06);
      ctx.strokeStyle = '#0093A5';
      const w = ctx.lineWidth;
      ctx.strokeRect(p.x + w / 2, p.y + w / 2, sq - w, sq - w);
    }
    ctx.drawImage(this.coordLayer, 0, 0, this.size, this.size);
    if (this.hints && this.targets.size) {
      for (const [s, t] of this.targets) {
        const c = this.squareCenter(s);
        if (t.capture) {
          ctx.lineWidth = sq * 0.085;
          ctx.strokeStyle = '#0093A5';
          ctx.beginPath(); ctx.arc(c.x, c.y, sq * 0.43, 0, Math.PI * 2); ctx.stroke();
          ctx.lineWidth = Math.max(1, sq * 0.025);
          ctx.strokeStyle = 'rgba(255,255,255,0.9)';
          ctx.beginPath(); ctx.arc(c.x, c.y, sq * 0.47, 0, Math.PI * 2); ctx.stroke();
        } else {
          ctx.fillStyle = '#0093A5';
          ctx.beginPath(); ctx.arc(c.x, c.y, sq * 0.14, 0, Math.PI * 2); ctx.fill();
          ctx.lineWidth = Math.max(1, sq * 0.03); ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.stroke();
        }
      }
    }

    const animTo = new Set();
    for (const a of this.anims) animTo.add(a.to);
    for (let i = 0; i < 64; i++) {
      const row = i >> 3, col = i & 7;
      const s = this.flipped ? row * 8 + (7 - col) : (7 - row) * 8 + col;
      const pc = this.pieces[s];
      if (!pc || this.hidden.has(s) || animTo.has(s)) continue;
      const p = this.screenXY(s);
      let dy = 0;
      if (s === this.selected && !this.reduce) {
        const t = (now - this.selT) / 1000;
        dy = -Math.abs(Math.sin(t * 5.5)) * sq * 0.07;
        busy = true;
      }
      if (this.ceremony) {
        const cer = this.ceremony;
        const role = cer.winner === -1 ? 'draw' : (pc >> 3) === cer.winner ? 'win' : 'lose';
        const c = Art.ceremonyPose(pc & 7, pc >> 3, role, now - cer.t0, ((s * 7919 + 13) % 97) / 97, this.reduce);
        ctx.save();
        ctx.translate(p.x, p.y);
        Art.drawPieceInSquare(ctx, pc & 7, pc >> 3, sq, { letter: this.letters, pose: c.pose, view: c.view, facing: c.facing, expr: c.expr, weapon: c.weapon, jump: c.jump, ground: c.ground, dpr: this.dpr });
        ctx.restore();
        if (!this.reduce && this.canvas.offsetParent !== null) busy = true;
        continue;
      }
      ctx.drawImage(Art.pieceSprite(pc & 7, pc >> 3, sq, this.dpr, { letter: this.letters }), p.x, p.y + dy, sq, sq);
    }

    if (this.ghosts) {
      for (const [s, pc] of this.ghosts) {
        const p = this.screenXY(s);
        ctx.drawImage(Art.pieceSprite(pc & 7, pc >> 3, sq, this.dpr, { letter: this.letters }), p.x, p.y, sq, sq);
      }
    }
    if (this.fight) { this.fight.draw(ctx, now); busy = true; }
    const done = [];
    for (const a of this.anims) {
      let t = (now - a.t0) / a.dur;
      if (t >= 1) { t = 1; done.push(a); } else busy = true;
      const e = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
      const p0 = this.screenXY(a.from), p1 = this.screenXY(a.to);
      const x = p0.x + (p1.x - p0.x) * e, y = p0.y + (p1.y - p0.y) * e - Math.sin(Math.PI * t) * sq * a.hop;
      if (a.walk && t < 1) {
        ctx.save();
        ctx.translate(x, y);
        Art.drawPieceInSquare(ctx, a.piece & 7, a.piece >> 3, sq, { letter: this.letters, pose: Art.movePose(a.piece & 7, e * a.dist, now - a.t0), facing: a.facing, dpr: this.dpr });
        ctx.restore();
      } else {
        ctx.drawImage(Art.pieceSprite(a.piece & 7, a.piece >> 3, sq, this.dpr, { letter: this.letters }), x, y, sq, sq);
      }
    }
    if (done.length) {
      this.anims = this.anims.filter(a => !done.includes(a));
      for (const a of done) {
        if (a.land) this.effect('land', a.to);
        a.group.left--;
        if (a.group.left <= 0) a.group.resolve();
      }
      busy = true;
    }

    this.effects = this.effects.filter(fx => now - fx.t0 < fx.dur);
    for (const fx of this.effects) { this.renderEffect(ctx, fx, now); busy = true; }
    if (busy) this.draw();
  }

  /** 효과(착지 먼지·작은 펑·진급 반짝임)를 그린다 */
  renderEffect(ctx, fx, now) {
    const sq = this.sq, c = this.squareCenter(fx.sq);
    const t = (now - fx.t0) / fx.dur;
    ctx.save();
    if (fx.kind === 'land') {
      ctx.globalAlpha = 1 - t;
      ctx.fillStyle = '#FFFFFF';
      ctx.strokeStyle = 'rgba(43,36,32,0.4)'; ctx.lineWidth = 1;
      for (let i = 0; i < 4; i++) {
        const dir = i < 2 ? -1 : 1;
        const x = c.x + dir * sq * (0.16 + t * 0.2 + (i % 2) * 0.08), y = c.y + sq * (0.36 - (i % 2) * 0.05 - t * 0.05);
        ctx.beginPath(); ctx.arc(x, y, sq * (0.035 + t * 0.03), 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      }
    } else if (fx.kind === 'poof') {
      ctx.globalAlpha = Math.min(1, (1 - t) * 1.6);
      for (let i = 0; i < 7; i++) {
        const a = i / 7 * Math.PI * 2 + fx.seed;
        const r = sq * (0.12 + t * 0.32);
        ctx.fillStyle = '#FFFFFF';
        ctx.strokeStyle = 'rgba(43,36,32,0.55)'; ctx.lineWidth = Math.max(1, sq * 0.03);
        ctx.beginPath(); ctx.arc(c.x + Math.cos(a) * r, c.y + Math.sin(a) * r, sq * (0.11 - t * 0.05), 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      }
      const fs = Math.round(sq * 0.42 * (0.7 + 0.3 * Math.min(1, t * 4)));
      ctx.font = '700 ' + fs + 'px Galmuri11, monospace';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineJoin = 'round'; ctx.lineWidth = fs * 0.25; ctx.strokeStyle = '#2B2420';
      ctx.strokeText('펑!', c.x, c.y - sq * (0.3 + t * 0.15));
      ctx.fillStyle = '#FFFFFF'; ctx.fillText('펑!', c.x, c.y - sq * (0.3 + t * 0.15));
    } else if (fx.kind === 'sparkle') {
      ctx.globalAlpha = 1 - t * t;
      for (let i = 0; i < 8; i++) {
        const a = i / 8 * Math.PI * 2 + t * 2;
        const r = sq * (0.15 + t * 0.45);
        Art.drawStar(ctx, c.x + Math.cos(a) * r, c.y + Math.sin(a) * r * 0.85 - t * sq * 0.1, sq * 0.09, sq * 0.04);
        ctx.fillStyle = i % 2 ? '#FFFFFF' : '#0093A5'; ctx.fill();
        ctx.lineWidth = Math.max(1, sq * 0.02); ctx.strokeStyle = '#2B2420'; ctx.stroke();
      }
      if (t < 0.8) {
        const fs = Math.round(sq * 0.34);
        ctx.font = '700 ' + fs + 'px Galmuri11, monospace';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.lineJoin = 'round'; ctx.lineWidth = fs * 0.25; ctx.strokeStyle = '#2B2420';
        const y = c.y - sq * (0.55 + t * 0.2);
        ctx.strokeText('진급!', c.x, y);
        ctx.fillStyle = '#FFFFFF'; ctx.fillText('진급!', c.x, y);
      }
    }
    ctx.restore();
  }
}

const Core = createChessCore();
const INITIAL_MS = 15 * 60 * 1000;
const TYPE_NAMES = ['', '폰', '나이트', '비숍', '룩', '퀸', '킹'];
const SIDE_NAMES = ['백', '흑'];

/** 한 판의 대국 상태 (국면·기보·시계·결과) — 나중에 온라인 대국도 같은 모델을 쓴다 */
class GameSession {
  /** 새 대국을 만들거나 저장본에서 되살린다 */
  constructor(o) {
    this.level = o.level;
    this.humanColor = o.humanColor;
    this.aiColor = o.humanColor ^ 1;
    this.startFen = o.startFen || Core.START_FEN;
    this.pos = Core.Position.fromFEN(this.startFen);
    this.records = [];
    this.clock = [INITIAL_MS, INITIAL_MS];
    this.running = -1;
    this.runStart = 0;
    this.result = null;
    this.undoCount = o.undoCount || 0;
    this.lastDrawOfferPly = o.lastDrawOfferPly != null ? o.lastDrawOfferPly : -99;
    this.rep = new Map();
    this.bumpRep(this.pos.repetitionKey(), 1);
    this.id = o.id || (Date.now().toString(36) + Math.random().toString(36).slice(2, 6));
    this.createdAt = o.createdAt || Date.now();
    if (o.moves && o.moves.length) {
      for (const uci of o.moves) {
        const m = this.pos.moveFromUci(uci);
        if (!m) break;
        this.applyMove(m);
      }
    }
    if (o.clockHist && o.clockHist.length === this.records.length) {
      this.records.forEach((r, i) => { const c = o.clockHist[i]; if (Array.isArray(c) && c.length === 2) r.clockAfter = [c[0], c[1]]; });
    }
    if (o.clock) this.clock = [Math.max(0, o.clock[0]), Math.max(0, o.clock[1])];
    if (o.result) this.result = o.result;
  }

  /** 같은 국면 횟수를 더하거나 뺀다 */
  bumpRep(key, d) {
    const n = (this.rep.get(key) || 0) + d;
    if (n <= 0) this.rep.delete(key); else this.rep.set(key, n);
    return n;
  }

  /** 지금 차례인 진영 */
  get turn() { return this.pos.side; }

  /** 진영의 남은 시간(ms) — 흐르는 시계까지 반영 */
  timeLeft(color, now) {
    let t = this.clock[color];
    if (this.running === color) t -= (now || performance.now()) - this.runStart;
    return Math.max(0, t);
  }

  /** 한 진영의 시계를 시작한다 */
  startClock(color) {
    this.stopClock();
    this.running = color;
    this.runStart = performance.now();
  }

  /** 흐르던 시계를 멈추고 쓴 시간을 깎는다 */
  stopClock() {
    if (this.running >= 0) {
      this.clock[this.running] = this.timeLeft(this.running);
      this.running = -1;
    }
  }

  /** 특정 칸(0~63)에서 출발하는 합법 수 */
  movesFrom(sq64) {
    const from88 = to88(sq64);
    return this.pos.legalMoves().filter(m => Core.moveFrom(m) === from88);
  }

  /** 수를 두고 기록을 남긴다 (합법 수만 넘긴다) */
  applyMove(m) {
    const pos = this.pos;
    const legal = pos.legalMoves();
    const from = Core.moveFrom(m), to = Core.moveTo(m), flags = Core.moveFlags(m), promo = Core.movePromo(m);
    const piece = pos.board[from];
    const capSq88 = (flags & Core.FLAG_EP) ? (pos.side === Core.WHITE ? to - 16 : to + 16) : to;
    const captured = (flags & Core.FLAG_CAPTURE) ? pos.board[capSq88] : 0;
    const san = pos.san(m, legal);
    const rec = {
      uci: Core.moveToUci(m), san, color: pos.side, piece, captured,
      from: to64(from), to: to64(to), capSq: to64(capSq88), promo, flags,
      clockAfter: [this.timeLeft(0), this.timeLeft(1)]
    };
    pos.make(m);
    rec.key = pos.repetitionKey();
    rec.repeat = this.bumpRep(rec.key, 1);
    rec.check = pos.inCheck();
    this.records.push(rec);
    return rec;
  }

  /** 마지막 한 수를 되돌린다 (시계는 그 국면이 처음 나왔을 때로) */
  undoLast() {
    const rec = this.records.pop();
    if (!rec) return null;
    this.bumpRep(rec.key, -1);
    this.pos.unmake();
    const prev = this.records[this.records.length - 1];
    this.clock = prev ? prev.clockAfter.slice() : [INITIAL_MS, INITIAL_MS];
    this.running = -1;
    return rec;
  }

  /** 대국이 끝났는지 판정한다 (끝났으면 결과 객체) */
  evaluateEnd() {
    if (this.result) return this.result;
    const pos = this.pos;
    if (!pos.hasLegalMove()) {
      if (pos.inCheck()) return this.finish(pos.side ^ 1, 'checkmate');
      return this.finish(-1, 'stalemate');
    }
    if (pos.insufficientMaterial()) return this.finish(-1, 'insufficient');
    const last = this.records[this.records.length - 1];
    if (last && last.repeat >= 3) return this.finish(-1, 'threefold');
    if (pos.halfmove >= 100) return this.finish(-1, 'fifty');
    return null;
  }

  /** 시간이 다 된 쪽을 처리한다 (상대가 메이트할 수 없으면 무승부) */
  flag(color) {
    if (this.result) return this.result;
    this.clock[color] = 0;
    this.running = -1;
    if (this.pos.cannotMate(color ^ 1)) return this.finish(-1, 'timeout-draw');
    return this.finish(color ^ 1, 'timeout');
  }

  /** 결과를 확정한다 (winner: 0 백, 1 흑, -1 무승부) */
  finish(winner, reason) {
    this.stopClock();
    this.result = { winner, reason, plies: this.records.length, at: Date.now() };
    return this.result;
  }

  /** 잡힌 기물 목록 (진영별로 잡은 상대 기물) */
  capturedBy(color) {
    const list = [];
    for (const r of this.records) if (r.color === color && r.captured) list.push(r.captured);
    return list.sort((a, b) => (b & 7) - (a & 7));
  }

  /** 기물 가치 합 (폰1·나이트3·비숍3·룩5·퀸9) */
  material(color) {
    const v = [0, 1, 3, 3, 5, 9, 0];
    let s = 0;
    for (let i = 0; i < 64; i++) { const p = this.pos.board[to88(i)]; if (p && (p >> 3) === color) s += v[p & 7]; }
    return s;
  }

  /** 지금 국면의 체크된 킹 칸(0~63) 또는 -1 */
  checkSquare() {
    return this.pos.inCheck() ? to64(this.pos.kingSq[this.pos.side]) : -1;
  }

  /** 저장용 JSON */
  toJSON() {
    return {
      v: 1, id: this.id, level: this.level, humanColor: this.humanColor, startFen: this.startFen,
      moves: this.records.map(r => r.uci), clock: [Math.round(this.timeLeft(0)), Math.round(this.timeLeft(1))],
      clockHist: this.records.map(r => [Math.round(r.clockAfter[0]), Math.round(r.clockAfter[1])]),
      undoCount: this.undoCount, lastDrawOfferPly: this.lastDrawOfferPly,
      createdAt: this.createdAt, savedAt: Date.now()
    };
  }
}

/** 워커 안에서 돌아가는 AI 응답기 (createChessCore와 함께 문자열로 묶여 실행된다) */
function aiWorkerMain(CoreW, scope) {
  const searcher = new CoreW.Searcher(19);
  /** 시작 국면과 수순으로 국면을 다시 만든다 */
  function rebuild(d) {
    const pos = CoreW.Position.fromFEN(d.startFen);
    for (const u of d.moves) { const m = pos.moveFromUci(u); if (!m) break; pos.make(m); }
    return pos;
  }
  scope.onmessage = (e) => {
    const d = e.data;
    try {
      if (d.type === 'newgame') { searcher.clear(); return; }
      const pos = rebuild(d);
      if (d.type === 'move') {
        const t0 = Date.now();
        const r = CoreW.chooseAiMove(searcher, pos, d.moves, d.level, d.clockMs);
        scope.postMessage({ type: 'move', id: d.id, uci: r ? CoreW.moveToUci(r.move) : null, kind: r && r.kind, score: r && r.score, depth: r && r.depth, ms: Date.now() - t0 });
      } else if (d.type === 'draw') {
        scope.postMessage({ type: 'draw', id: d.id, accept: CoreW.shouldAcceptDraw(searcher, pos, d.aiColor) });
      }
    } catch (err) {
      scope.postMessage({ type: 'error', id: d.id, message: String(err && err.message || err) });
    }
  };
}

/** AI 계산을 워커(없으면 메인 스레드)에 맡기는 창구 */
const AI = {
  worker: null,
  seq: 0,
  pending: new Map(),
  local: null,

  /** 워커를 만든다 (실패하면 메인 스레드로 대신 계산) */
  init() {
    try {
      const src = 'const CoreW = (' + createChessCore.toString() + ')();\n(' + aiWorkerMain.toString() + ')(CoreW, self);';
      const url = URL.createObjectURL(new Blob([src], { type: 'text/javascript' }));
      this.worker = new Worker(url);
      this.worker.onmessage = (e) => this.receive(e.data);
      this.worker.onerror = () => { this.fallback(); };
    } catch (e) {
      this.fallback();
    }
  },

  /** 메인 스레드 계산으로 바꾼다 */
  fallback() {
    if (this.worker) { try { this.worker.terminate(); } catch (e) { this.worker = null; } }
    this.worker = null;
    if (!this.local) {
      const scope = { postMessage: (msg) => setTimeout(() => this.receive(msg), 0) };
      aiWorkerMain(Core, scope);
      this.local = scope;
    }
    const waiting = [...this.pending.values()];
    this.pending.clear();
    for (const w of waiting) this.send(w.msg, w);
  },

  /** 요청을 보낸다 */
  send(msg, entry) {
    this.pending.set(msg.id, entry);
    if (this.worker) this.worker.postMessage(msg);
    else if (this.local) setTimeout(() => this.local.onmessage({ data: msg }), 30);
  },

  /** 응답을 받아 해당 요청을 끝낸다 */
  receive(d) {
    const entry = this.pending.get(d.id);
    if (!entry) return;
    this.pending.delete(d.id);
    if (d.type === 'error') entry.reject(new Error(d.message));
    else entry.resolve(d);
  },

  /** AI에게 수를 묻는다 */
  requestMove(session) {
    const id = ++this.seq;
    const msg = {
      type: 'move', id, startFen: session.startFen, moves: session.records.map(r => r.uci),
      level: session.level, clockMs: session.timeLeft(session.aiColor)
    };
    const p = new Promise((resolve, reject) => this.send(msg, { msg, resolve, reject }));
    return { id, promise: p };
  },

  /** 무승부 제안을 AI가 받아들이는지 묻는다 */
  askDraw(session) {
    const id = ++this.seq;
    const msg = { type: 'draw', id, startFen: session.startFen, moves: session.records.map(r => r.uci), aiColor: session.aiColor };
    return new Promise((resolve, reject) => this.send(msg, { msg, resolve, reject }));
  },

  /** 기다리던 요청을 버린다 (결과가 와도 무시) */
  cancel(id) { this.pending.delete(id); },

  /** 새 대국 시작을 알린다 */
  newGame() {
    if (this.worker) this.worker.postMessage({ type: 'newgame' });
    else if (this.local) this.local.onmessage({ data: { type: 'newgame' } });
  }
};

/** 설정·진행·저장된 대국을 브라우저와 (가능하면) 계정 저장소에 보관한다 */
const Store = {
  KEY: 'cutechess.v1',
  data: null,
  cloud: { ref: null, writing: false, dirty: false, timer: 0, unsub: null, ready: false },

  /** 기본값 */
  defaults() {
    return {
      v: 1,
      settings: {
        sound: true, volume: 0.8, battle: 'normal', hints: true, coords: true, letters: false,
        undo: true, vibrate: true, unlockAll: false, updatedAt: 0
      },
      progress: { levels: {} },
      stats: { wins: 0, losses: 0, draws: 0 },
      game: null,
      gameUpdatedAt: 0,
      updatedAt: 0
    };
  },

  /** 브라우저 저장소에서 읽는다 */
  load() {
    this.data = this.defaults();
    try {
      const raw = localStorage.getItem(this.KEY);
      if (raw) this.merge(JSON.parse(raw), true);
    } catch (e) { this.data = this.defaults(); }
    return this.data;
  },

  /** 다른 저장본을 합친다 (진행은 합집합, 설정·대국은 최신 우선) */
  merge(other, trustAll) {
    if (!other || typeof other !== 'object') return false;
    const d = this.data;
    const before = JSON.stringify(d);
    if (other.resetAt && other.resetAt > (d.resetAt || 0)) {
      d.progress = { levels: {} };
      d.stats = { wins: 0, losses: 0, draws: 0 };
      d.resetAt = other.resetAt;
    }
    if (other.settings && (trustAll || (other.settings.updatedAt || 0) > (d.settings.updatedAt || 0))) {
      d.settings = Object.assign({}, d.settings, other.settings);
    }
    const ol = other.progress && other.progress.levels;
    if (ol && typeof ol === 'object') {
      for (const k of Object.keys(ol)) {
        const a = d.progress.levels[k] || {}, b = ol[k] || {};
        d.progress.levels[k] = {
          cleared: !!(a.cleared || b.cleared), perfect: !!(a.perfect || b.perfect),
          w: Math.max(a.w || 0, b.w || 0), l: Math.max(a.l || 0, b.l || 0), d: Math.max(a.d || 0, b.d || 0)
        };
      }
    }
    if (other.stats) {
      d.stats.wins = Math.max(d.stats.wins, other.stats.wins || 0);
      d.stats.losses = Math.max(d.stats.losses, other.stats.losses || 0);
      d.stats.draws = Math.max(d.stats.draws, other.stats.draws || 0);
    }
    if (trustAll || (other.gameUpdatedAt || 0) > (d.gameUpdatedAt || 0)) {
      if ('game' in other) { d.game = other.game || null; d.gameUpdatedAt = other.gameUpdatedAt || 0; }
    }
    d.updatedAt = Math.max(d.updatedAt || 0, other.updatedAt || 0);
    return JSON.stringify(d) !== before;
  },

  /** 바뀐 내용을 저장한다 (브라우저는 즉시, 계정은 잠시 모아서) */
  save() {
    this.data.updatedAt = Date.now();
    try { localStorage.setItem(this.KEY, JSON.stringify(this.data)); } catch (e) { this.data.localFailed = true; }
    this.scheduleCloud();
  },

  /** 설정을 바꾸고 저장한다 */
  setSetting(key, value) {
    this.data.settings[key] = value;
    this.data.settings.updatedAt = Date.now();
    this.save();
  },

  /** 진행 중인 대국을 저장하거나 지운다 */
  setGame(json) {
    this.data.game = json || null;
    this.data.gameUpdatedAt = Date.now();
    this.save();
  },

  /** 단계 기록 */
  level(n) { return this.data.progress.levels[n] || { cleared: false, perfect: false, w: 0, l: 0, d: 0 }; },

  /** 대국 결과를 진행 기록에 반영한다 */
  recordResult(level, outcome, perfect) {
    const cur = Object.assign({ cleared: false, perfect: false, w: 0, l: 0, d: 0 }, this.data.progress.levels[level]);
    if (outcome === 'win') { cur.w++; cur.cleared = true; if (perfect) cur.perfect = true; this.data.stats.wins++; }
    else if (outcome === 'lose') { cur.l++; this.data.stats.losses++; }
    else { cur.d++; this.data.stats.draws++; }
    this.data.progress.levels[level] = cur;
    this.save();
  },

  /** 깬 단계 수 */
  clearedCount() {
    let n = 0;
    for (let i = 1; i <= 50; i++) if (this.level(i).cleared) n++;
    return n;
  },

  /** 깬 단계 중 가장 높은 단계 (없으면 0) */
  topCleared() {
    let n = 0;
    for (let i = 1; i <= 50; i++) if (this.level(i).cleared) n = i;
    return n;
  },

  /** 내 계급 (지금 도전 중인 단계의 계급; 50단계까지 깨면 임페라토르) */
  playerRank() { return Core.rankOf(Math.min(50, this.topCleared() + 1)); },

  /** 내 추정 레이팅 (가장 높이 깬 단계 기준, 아직 없으면 신병 시작값) */
  playerRating() { const top = this.topCleared(); return top ? Core.ratingOf(top) : 400; },

  /** 아직 깨지 않은 첫 단계 (다음 도전 단계) */
  nextLevel() {
    let n = 1;
    while (n < 50 && this.level(n).cleared) n++;
    return n;
  },

  /** 단계가 열려 있는지 */
  isUnlocked(n) { return this.data.settings.unlockAll || n === 1 || this.level(n - 1).cleared; },

  /** 진행 초기화 (설정은 그대로) */
  resetProgress() {
    this.data.progress = { levels: {} };
    this.data.stats = { wins: 0, losses: 0, draws: 0 };
    this.data.game = null;
    this.data.gameUpdatedAt = Date.now();
    this.data.resetAt = Date.now();
    this.save();
    if (this.cloud.ref) this.writeCloud(true);
  },

  /** 계정 저장소(있을 때만)를 연결해 기기 간에 진행을 맞춘다 */
  async initCloud(onChange) {
    try {
      if (!window.claude || typeof window.claude.use !== 'function') return;
      const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      if (!db || !user) return;
      const uid = await user.id();
      if (!uid) return;
      const ref = db.doc('data/users/' + uid + '/save');
      this.cloud.ref = ref;
      const snap = await ref.get();
      if (snap.exists) {
        if (this.merge(snap.data(), false) && onChange) onChange();
        try { localStorage.setItem(this.KEY, JSON.stringify(this.data)); } catch (e) { this.data.localFailed = true; }
      }
      this.cloud.ready = true;
      this.writeCloud(false);
      this.cloud.unsub = ref.onSnapshot((s) => {
        if (!s.exists || s.metadata.hasPendingWrites) return;
        if (this.merge(s.data(), false)) {
          try { localStorage.setItem(this.KEY, JSON.stringify(this.data)); } catch (e) { this.data.localFailed = true; }
          if (onChange) onChange();
        }
      }, () => { this.cloud.unsub = null; });
    } catch (e) {
      this.cloud.ref = null;
    }
  },

  /** 계정 저장을 잠시 미뤘다가 한 번에 쓴다 */
  scheduleCloud() {
    if (!this.cloud.ref) return;
    clearTimeout(this.cloud.timer);
    this.cloud.timer = setTimeout(() => this.writeCloud(true), 1500);
  },

  /** 계정 저장소에 쓴다 (한 번에 하나씩) */
  async writeCloud(force) {
    const c = this.cloud;
    if (!c.ref || !c.ready) return;
    if (c.writing) { c.dirty = true; return; }
    c.writing = true;
    try {
      const body = JSON.parse(JSON.stringify(this.data));
      delete body.localFailed;
      await c.ref.set(body);
    } catch (e) {
      if (e && (e.code === 'revoked' || e.code === 'invalid_argument' || e.code === 'not_granted')) c.ref = null;
    }
    c.writing = false;
    if (c.dirty) { c.dirty = false; this.writeCloud(true); }
  }
};

/** 공개 주소로 들어온 방문을 바깥 계수 서비스(Abacus)에 세고 그 숫자를 읽어 온다 (숫자만 올리며 개인 정보는 보내지 않는다) */
const Visits = {
  API: 'https://abacus.jasoncameron.dev',
  SPACE: 'summerjin19-a-better-move',
  KEY: 'cutechess.visit',
  DAYS: 14,
  memo: {},

  /** Claude 아티팩트 안에서 열렸는지 (그 안에서는 바깥 서비스에 닿지 않는다) */
  inClaude() {
    const origins = [location.hostname].concat(Array.from(location.ancestorOrigins || []));
    return !!window.claude || origins.some((o) => /claude/i.test(o));
  },

  /** 이 접속을 셀지 정한다 (내 컴퓨터에서 연 파일·개발용 주소·Claude 아티팩트·자동 프로그램은 세지 않는다) */
  counts() {
    const host = location.hostname;
    if (this.inClaude() || !/^https?:$/.test(location.protocol)) return false;
    if (!host.includes('.') || /^(127|10|192\.168|172\.(1[6-9]|2\d|3[01]))\./.test(host)) return false;
    return !navigator.webdriver && !/bot|crawl|spider|slurp|headless|lighthouse/i.test(navigator.userAgent);
  },

  /** 한국 시간 기준 날짜 열쇠 (예: '20261005'); back은 며칠 전인지 */
  dayKey(back) {
    return new Date(Date.now() + 9 * 3600000 - (back || 0) * 86400000).toISOString().slice(0, 10).replace(/-/g, '');
  },

  /** 계수기 주소를 만든다 */
  url(action, key) { return this.API + '/' + action + '/' + this.SPACE + '/' + key; },

  /** 계수기 하나를 1 올린다 */
  async hit(key) {
    const res = await fetch(this.url('hit', key), { cache: 'no-store' });
    if (!res.ok) throw new Error('hit ' + res.status);
  },

  /** 계수기 값을 읽는다 (아직 없으면 0; 1분 안에 다시 물으면 읽어 둔 값을 쓴다) */
  read(key) {
    const kept = this.memo[key];
    if (kept && Date.now() - kept.at < 60000) return kept.value;
    const value = fetch(this.url('get', key), { cache: 'no-store' }).then((res) => {
      if (res.status === 404) return 0;
      if (!res.ok) throw new Error('get ' + res.status);
      return res.json().then((body) => Number(body.value) || 0);
    });
    this.memo[key] = { at: Date.now(), value };
    value.catch(() => { if (this.memo[key] && this.memo[key].value === value) delete this.memo[key]; });
    return value;
  },

  /** 이 브라우저에 남긴 방문 표시를 읽는다 (저장소를 쓸 수 없으면 null — 그때는 사람 수를 세지 않는다) */
  loadSeen() {
    try {
      let seen = null;
      try { seen = JSON.parse(localStorage.getItem(this.KEY)); } catch (e) { seen = null; }
      if (!seen || typeof seen !== 'object') seen = {};
      localStorage.setItem(this.KEY, JSON.stringify(seen));
      return seen;
    } catch (e) { return null; }
  },

  /** 방문 표시를 남긴다 */
  saveSeen(seen) {
    try { localStorage.setItem(this.KEY, JSON.stringify(seen)); } catch (e) { return; }
  },

  /** 이번에 연 창에서 이미 방문을 셌는지 (mark가 참이면 셌다고 적는다) */
  session(mark) {
    try {
      if (mark) sessionStorage.setItem(this.KEY, '1');
      return sessionStorage.getItem(this.KEY) === '1';
    } catch (e) { return false; }
  },

  /** 아직 세지 않은 것만 센다: 이 브라우저의 첫 방문, 오늘의 첫 방문, 이번에 연 창 (실패하면 표시를 남기지 않아 다음에 다시 센다) */
  async track() {
    const seen = this.loadSeen();
    const today = this.dayKey(0);
    const jobs = [];
    if (seen && !seen.first) jobs.push(this.hit('visitors').then(() => { seen.first = today; this.saveSeen(seen); }));
    if (seen && seen.day !== today) jobs.push(this.hit('day-' + today).then(() => { seen.day = today; this.saveSeen(seen); }));
    if (!this.session(false)) jobs.push(this.hit('visits').then(() => { this.session(true); }));
    if (!jobs.length) return;
    await Promise.allSettled(jobs);
    this.memo = {};
  },

  /** 화면이 실제로 보일 때 한 번 센다 */
  start() {
    if (!this.counts()) return;
    const run = () => {
      if (document.visibilityState !== 'visible') return;
      document.removeEventListener('visibilitychange', run);
      this.track().catch(() => null);
    };
    document.addEventListener('visibilitychange', run);
    run();
  },

  /** 오늘과 전체 방문자 수를 읽는다 */
  async summary() {
    const [today, total] = await Promise.all([this.read('day-' + this.dayKey(0)), this.read('visitors')]);
    return { today, total };
  },

  /** 지난 14일의 날짜별 방문자 수(오늘부터 거꾸로)와 전체 방문 횟수를 읽는다 */
  async history() {
    const keys = [];
    for (let i = 0; i < this.DAYS; i++) keys.push(this.dayKey(i));
    const [visits, ...counts] = await Promise.all([this.read('visits')].concat(keys.map((k) => this.read('day-' + k))));
    return { visits, days: keys.map((key, i) => ({ key, count: counts[i] })) };
  }
};

/** 받침에 맞는 조사를 붙인다 (예: josa('상병', '과', '와') → '상병과') */
function josa(word, withBatchim, without) {
  const code = word.charCodeAt(word.length - 1) - 0xAC00;
  const has = code >= 0 && code <= 11171 && code % 28 !== 0;
  if (withBatchim === '으로' && has && code % 28 === 8) return word + without;
  return word + (has ? withBatchim : without);
}

/** DOM 요소를 id로 찾는다 */
function $(id) { return document.getElementById(id); }

/** 태그·속성·자식으로 요소를 만든다 */
function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  if (attrs) {
    for (const k in attrs) {
      const v = attrs[k];
      if (v == null || v === false) continue;
      if (k === 'class') e.className = v;
      else if (k === 'text') e.textContent = v;
      else if (k === 'html') e.innerHTML = v;
      else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v === true ? '' : v);
    }
  }
  for (const k of kids.flat()) if (k != null && k !== false) e.append(k.nodeType ? k : document.createTextNode(String(k)));
  return e;
}

const ICON_COLORS = { '#': 'currentColor', y: 'currentColor' };

/** 픽셀 아이콘 SVG를 만든다 */
function pixelIcon(name, cls) {
  const rows = PIXEL_ICONS[name] || PIXEL_ICONS.flag;
  const w = rows[0].length, h = rows.length;
  let rects = '';
  for (let y = 0; y < h; y++) {
    let x = 0;
    while (x < w) {
      const ch = rows[y][x];
      if (ch === '.' || !ICON_COLORS[ch]) { x++; continue; }
      let run = 1;
      while (x + run < w && rows[y][x + run] === ch) run++;
      rects += '<rect x="' + x + '" y="' + y + '" width="' + run + '" height="1" fill="' + ICON_COLORS[ch] + '"/>';
      x += run;
    }
  }
  const wrap = document.createElement('span');
  wrap.innerHTML = '<svg class="' + (cls || '') + '" viewBox="0 0 ' + w + ' ' + h + '" aria-hidden="true" focusable="false">' + rects + '</svg>';
  return wrap.firstChild;
}

/** 아이콘이 붙은 버튼을 만든다 */
function iconButton(icon, label, cls, onClick, attrs) {
  return el('button', Object.assign({ class: 'btn ' + (cls || ''), type: 'button', onclick: onClick }, attrs || {}), pixelIcon(icon), el('span', { text: label }));
}

/** 마지막 입력이 키보드였는지 기억한다 (대화상자 포커스 표시용) */
const Input = { keyboard: false };
document.addEventListener('keydown', (e) => { if (e.key === 'Tab' || e.key === 'Enter' || e.key === ' ' || e.key.startsWith('Arrow')) Input.keyboard = true; }, true);

/** 화면 위쪽에 잠깐 뜨는 알림 */
const Toast = {
  timer: 0,
  /** 메시지를 보여 준다 */
  show(msg) {
    const old = $('toast');
    if (old) old.remove();
    const t = el('div', { id: 'toast', class: 'toast', role: 'status', text: msg });
    $('app').appendChild(t);

    this.timer = setTimeout(() => t.remove(), 2300);
  }
};

/** 아래에서 올라오는 시트(대화상자) */
const Sheet = {
  stack: [],
  /** 시트를 연다 (content: 요소 배열, opts.dismiss: 바깥 탭으로 닫기 허용, opts.onClose) */
  open(content, opts) {
    opts = opts || {};
    const layer = el('div', { class: 'layer', role: 'presentation' });
    const sheet = el('div', { class: 'sheet', role: 'dialog', 'aria-modal': 'true', 'aria-label': opts.label || '알림', tabindex: '-1' }, content);
    layer.appendChild(sheet);
    layer.addEventListener('pointerdown', (e) => {
      if (e.target === layer && opts.dismiss !== false) { e.preventDefault(); this.close(entry, 'dismiss'); }
    });
    const entry = { layer, opts, prevFocus: document.activeElement };
    this.stack.push(entry);
    $('app').appendChild(layer);
    const first = Input.keyboard ? sheet.querySelector('button:not([disabled])') : sheet;
    if (first) setTimeout(() => first.focus({ preventScroll: true }), 30);
    return entry;
  },
  /** 시트를 닫는다 */
  close(entry, reason) {
    entry = entry || this.stack[this.stack.length - 1];
    if (!entry) return;
    const i = this.stack.indexOf(entry);
    if (i < 0) return;
    this.stack.splice(i, 1);
    entry.layer.remove();
    if (entry.opts.onClose) entry.opts.onClose(reason || 'close');
    if (entry.prevFocus && entry.prevFocus.focus && document.contains(entry.prevFocus)) entry.prevFocus.focus({ preventScroll: true });
  },
  /** 모든 시트를 닫는다 */
  closeAll() { while (this.stack.length) this.close(this.stack[this.stack.length - 1], 'all'); },
  /** 열린 시트가 있는지 */
  get isOpen() { return this.stack.length > 0; },
  /** 확인/취소 시트 */
  confirm(title, message, okLabel, okClass) {
    return new Promise((resolve) => {
      let done = false;
      const finish = (v) => { if (done) return; done = true; Sheet.close(entry); resolve(v); };
      const entry = this.open([
        el('h3', { text: title }),
        el('p', { class: 'muted', text: message }),
        el('div', { class: 'actions two' },
          el('button', { class: 'btn', type: 'button', text: '취소', onclick: () => finish(false) }),
          el('button', { class: 'btn ' + (okClass || 'dark'), type: 'button', text: okLabel || '확인', onclick: () => finish(true) }))
      ], { label: title, onClose: () => { if (!done) { done = true; resolve(false); } } });
    });
  }
};

/** 진급할 기물을 고르는 시트 (고른 종류 또는 null) */
function pickPromotion(color) {
  return new Promise((resolve) => {
    let done = false;
    const finish = (v) => { if (done) return; done = true; Sheet.close(entry); resolve(v); };
    const grid = el('div', { class: 'promo-grid' });
    for (const [type, name] of [[Core.QUEEN, '퀸'], [Core.ROOK, '룩'], [Core.BISHOP, '비숍'], [Core.KNIGHT, '나이트']]) {
      grid.appendChild(el('button', { type: 'button', 'aria-label': josa(name, '으로', '로') + ' 진급', onclick: () => { Sfx.select(); finish(type); } },
        pieceCanvas(type, color, 56), el('span', { text: name })));
    }
    const entry = Sheet.open([
      el('h3', { text: '진급! 어떤 병정이 될까요?' }),
      el('p', { class: 'muted', text: '끝 줄에 닿은 폰은 다른 병정으로 바뀌어요. 보통은 가장 강한 퀸을 골라요.' }),
      grid
    ], { label: '진급 선택', onClose: () => { if (!done) { done = true; resolve(null); } } });
  });
}

/** 작은 캔버스에 기물(정면)을 그린 요소를 만든다 */
function pieceCanvas(type, color, cssSize, cls) {
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const c = el('canvas', { class: cls || '', 'aria-hidden': 'true' });
  c.width = Math.round(cssSize * dpr); c.height = Math.round(cssSize * dpr);
  c.style.width = cssSize + 'px'; c.style.height = cssSize + 'px';
  Art.drawPieceInSquare(c.getContext('2d'), type, color, c.width);
  return c;
}

/** 화면 전환 */
const Screens = {

  show(name) {

/** 단계 번호의 소속 부대 */
function tierOf(level) { return TIERS.find(t => level >= t.from && level <= t.to) || TIERS[0]; }
/** 'Lv.12 백인대장' 같은 이름 */
function levelLabel(level) { return 'Lv.' + level + ' ' + Core.rankName(level); }

/** 메인 메뉴 */
const Menu = {
  heroRaf: 0, heroOn: false, heroT0: 0,
  /** 메뉴 버튼을 연결한다 */
  init() {
    $('btn-new').addEventListener('click', () => { Sfx.button(); Screens.show('stages'); });
    $('btn-continue').addEventListener('click', () => { Sfx.button(); Play.continueFromMenu(); });
    $('btn-learn').addEventListener('click', () => { Sfx.button(); Learn.open(); });
    $('btn-settings').addEventListener('click', () => { Sfx.button(); Settings.open(); });
    for (const [id, icon] of [['btn-new', 'flag'], ['btn-continue', 'play'], ['btn-learn', 'book'], ['btn-settings', 'gear']]) {
      $(id).querySelector('.mb-icon').appendChild(pixelIcon(icon));
    }
  },
  /** 이어하기 문구와 진행 현황을 새로 고친다 */
  refresh() {
    const g = Store.data.game;
    const sub = $('continue-sub');
    const btn = $('btn-continue');
    if (g && g.moves) {
      const ply = g.moves.length;
      sub.textContent = levelLabel(g.level) + ' · ' + (ply ? Math.ceil(ply / 2) + '수째 대국 중' : '막 시작한 대국');
      btn.disabled = false;
    } else if (Store.clearedCount() > 0) {
      const next = Math.min(50, Store.nextLevel());
      sub.textContent = '다음 도전: ' + levelLabel(next);
      btn.disabled = false;
    } else {
      sub.textContent = '저장된 대국이 없어요';
      btn.disabled = true;
    }
    const n = Store.clearedCount();
    $('progress-chip').textContent = '클리어 ' + n + ' / 50';
    const st = Store.data.stats;
    $('record-chip').textContent = Store.playerRank().name + ' · ' + (st.wins + st.losses + st.draws) + '전 ' + st.wins + '승 ' + st.losses + '패 ' + st.draws + '무';
  },
  /** 메뉴 그림(마주 선 두 병정)을 켜고 끈다 */
  setHeroRunning(on) {
    this.heroOn = on;
    if (on && !this.heroRaf) { this.heroT0 = performance.now(); this.heroRaf = requestAnimationFrame((t) => this.drawHero(t)); }
  },
  /** 메뉴 그림을 그린다 (가볍게 숨 쉬는 정도만 움직임) */
  drawHero(now) {
    this.heroRaf = 0;
    const cv = $('menu-hero');
    if (!cv || !this.heroOn) return;
    const w = cv.clientWidth, h = cv.clientHeight;
    if (!w || !h) { this.heroRaf = requestAnimationFrame((t) => this.drawHero(t)); return; }
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, w, h);
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const t = reduce ? 0 : (now - this.heroT0) / 1000;
    const gy = h * 0.8;
    c.fillStyle = '#E6E3DD';
    c.beginPath(); c.ellipse(w / 2, gy + h * 0.04, Math.min(w * 0.46, h * 1.5), h * 0.11, 0, 0, Math.PI * 2); c.fill();
    c.strokeStyle = '#2B2420'; c.lineWidth = 3; c.stroke();
    const H = h * 0.46;
    const sep = Math.min(w * 0.2, H * 0.95);
    const knight = Object.assign(Art.standPose(2), { bob: Math.abs(Math.sin(t * 2.2)) * 0.03, aF: 2.0 + Math.sin(t * 2.2) * 0.12, wAng: 1.25 });
    const rook = Object.assign(Art.standPose(4), { bob: Math.abs(Math.sin(t * 2.2 + 1.3)) * 0.02, gallop: (t * 0.4) % 1, aF: 1.4 + Math.sin(t * 2.2 + 1.3) * 0.1 });
    Art.drawFigure(c, w / 2 - sep, gy, H, 2, 0, { view: 'side', facing: 1, pose: knight, expr: 'fight' });
    Art.drawFigure(c, w / 2 + sep, gy, H, 4, 1, { view: 'side', facing: -1, pose: rook, expr: 'fight' });
    const sparkle = 0.5 + 0.5 * Math.sin(t * 3);
    c.save();
    c.globalAlpha = 0.6 + 0.4 * sparkle;
    Art.drawStar(c, w / 2, gy - H * 1.25, h * 0.055, h * 0.024);
    c.fillStyle = '#0093A5'; c.fill(); c.lineWidth = 2.5; c.strokeStyle = '#2B2420'; c.stroke();
    c.restore();
    if (!reduce) setTimeout(() => { if (this.heroOn && !this.heroRaf) this.heroRaf = requestAnimationFrame((tt) => this.drawHero(tt)); }, 50);
  }
};

/** 단계 선택 화면 */
const Stages = {
  /** 뒤로 가기 버튼을 연결한다 */
  init() {
    $('stages-back').prepend(pixelIcon('back'));
    $('stages-back').addEventListener('click', () => { Sfx.button(); Screens.show('menu'); });
    window.addEventListener('resize', () => { if (!$('screen-stages').hidden) this.drawScenes(); });
  },
  /** 부대별 단계 칸을 그린다 */
  render() {
    const box = $('stages-list');
    box.textContent = '';
    const next = Store.nextLevel();
    $('stages-progress').textContent = '클리어 ' + Store.clearedCount() + ' / 50';
    let nextEl = null;
    for (const tier of TIERS) {
      const grid = el('div', { class: 'stage-grid' });
      for (let n = tier.from; n <= tier.to; n++) {
        const rec = Store.level(n);
        const unlocked = Store.isUnlocked(n);
        let cls = 'stage';
        if (!unlocked) cls += ' locked';
        else if (rec.perfect) cls += ' perfect';
        else if (rec.cleared) cls += ' cleared';
        else if (n === next) cls += ' next';
        const label = levelLabel(n) + (unlocked ? (rec.perfect ? ', 무르기 없이 클리어' : rec.cleared ? ', 클리어' : ', 도전 가능') : ', 잠김');
        const b = el('button', { class: cls, type: 'button', 'aria-label': label, disabled: !unlocked, onclick: () => { Sfx.button(); this.openSheet(n); } },
          el('span', { class: 'num', text: n }),
          el('span', { class: 'rk', text: Core.rankName(n) }));
        if (!unlocked) b.appendChild(el('span', { class: 'badge' }, pixelIcon('lock')));
        else if (rec.perfect) b.appendChild(el('span', { class: 'badge' }, pixelIcon('star')));
        else if (rec.cleared) b.appendChild(el('span', { class: 'badge' }, pixelIcon('check')));
        if (n === next) nextEl = b;
        grid.appendChild(b);
      }
      box.appendChild(el('section', { class: 'tier' },
        el('div', { class: 'tier-head' },
          el('canvas', { class: 'tier-bg', 'data-scene': tier.scene, 'aria-hidden': 'true' }),
          el('div', { class: 'tier-title' }, el('h3', { text: tier.name }), el('span', { class: 'range', text: 'Lv.' + tier.from + '–' + tier.to + ' · 약 ' + Core.ratingOf(tier.from) + '–' + Core.ratingOf(tier.to) }))),
        el('p', { text: tier.desc }),
        grid));
    }
    requestAnimationFrame(() => this.drawScenes());
    if (nextEl) requestAnimationFrame(() => {
      const body = $('stages-body');
      const r = nextEl.getBoundingClientRect(), br = body.getBoundingClientRect();
      body.scrollTop += (r.top - br.top) - (br.height / 2 - r.height / 2);
    });
  },
  /** 부대 머리띠의 도트 배경을 현재 너비에 맞춰 그린다 */
  drawScenes() {
    for (const cv of document.querySelectorAll('#stages-list .tier-bg')) {
      const w = cv.parentElement.clientWidth;
      if (w > 0 && cv.dataset.w !== String(w)) { cv.dataset.w = String(w); Scenes.draw(cv, cv.dataset.scene, w); }
    }
  },

  /** 단계 시작 시트 (진영 고르기) */
  openSheet(level) {
    const rec = Store.level(level);
    let color = Store.data.settings.lastColor || 'w';
    const seg = el('div', { class: 'seg', role: 'group', 'aria-label': '내 진영' });
    const opts = [['w', '백 (먼저)'], ['b', '흑 (나중)'], ['r', '무작위']];
    const btns = opts.map(([v, label]) => {
      const b = el('button', { type: 'button', 'aria-pressed': String(v === color), text: label, onclick: () => {
        color = v; Sfx.select();
        for (const x of btns) x.setAttribute('aria-pressed', String(x === b));
        drawAvatar();
      } });
      return b;
    });
    btns.forEach(b => seg.appendChild(b));
    const avatar = pieceCanvas(6, 1, 64);
    const drawAvatar = () => {
      const aiColor = color === 'b' ? 0 : 1;
      const ctx = avatar.getContext('2d');
      ctx.clearRect(0, 0, avatar.width, avatar.height);
      Art.drawPieceInSquare(ctx, 6, aiColor, avatar.width);
    };
    drawAvatar();
    const saved = Store.data.game;
    const kids = [
      el('div', { class: 'stage-intro' }, avatar,
        el('div', {},
          el('h3', { text: levelLabel(level) }),
          el('p', { class: 'muted', text: tierOf(level).name + ' · ' + tierOf(level).desc }),
          el('p', { class: 'muted', text: Core.rankOf(level).latin + ' · 추정 레이팅 약 ' + Core.ratingOf(level) }))),
      el('p', { class: 'record-line', text: '이 상대와 전적: ' + rec.w + '승 ' + rec.l + '패 ' + rec.d + '무' + (rec.perfect ? ' · 별 훈장' : rec.cleared ? ' · 클리어' : '') }),
      el('div', {}, el('p', { class: 'muted', text: '내 진영을 고르세요. 백이 먼저 둬요. 시계는 각자 15분이에요.' })),
      seg
    ];
    if (saved && saved.moves) kids.push(el('p', { class: 'warn', text: '진행 중인 ' + levelLabel(saved.level) + ' 대국은 새 대국을 시작하면 사라져요.' }));
    const startBtn = el('button', { class: 'btn accent', type: 'button', onclick: () => {
      Sfx.button();
      Store.setSetting('lastColor', color);
      const human = color === 'r' ? (Math.random() < 0.5 ? 0 : 1) : (color === 'w' ? 0 : 1);
      Sheet.close(entry);
      Play.startNew(level, human);
    } }, pixelIcon('flag'), el('span', { text: '전투 시작!' }));
    kids.push(el('div', { class: 'actions two' },
      el('button', { class: 'btn', type: 'button', text: '닫기', onclick: () => Sheet.close(entry) }),
      startBtn));
    const entry = Sheet.open(kids, { label: levelLabel(level) + ' 시작' });
  }
};

        row('갈 수 있는 칸 표시', '말을 고르면 이동할 수 있는 칸에 점이 찍혀요', sw('set-hints', 'hints'), 'set-hints'),
        row('무르기 허용', '쓰지 않고 이기면 그 단계에서 별 훈장을 받아요', sw('set-undo', 'undo'), 'set-undo')),
      el('section', { class: 'set-group' }, el('h3', { text: '화면' }),
        row('좌표 표시', '판 가장자리에 a~h, 1~8을 보여 줘요', sw('set-coords', 'coords'), 'set-coords'),
        row('말 글자 표시', '병정 옆에 K·Q·R·B·N·P를 작게 붙여요', sw('set-letters', 'letters'), 'set-letters')),
      el('section', { class: 'set-group' }, el('h3', { text: '진행' }),

      Visits.inClaude() ? null : this.visitGroup(row),
