  --font-body: 'Gowun Dodum', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', system-ui, sans-serif;
  --gutter: 16px;
  --radius: 8px;
  color-scheme: light;
}

html, body { height: 100%; }
body {
  margin: 0;
  background-color: var(--base);
  background-image: conic-gradient(var(--base-2) 25%, transparent 0 50%, var(--base-2) 0 75%, transparent 0);
  background-size: 8px 8px;
  color: var(--text);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.55;
  -webkit-tap-highlight-color: transparent;
  word-break: keep-all;
  overflow-wrap: anywhere;
  overflow: hidden;
  overscroll-behavior: none;
}
p, li { text-wrap: pretty; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px dashed var(--point); outline-offset: 3px; }

.app { position: relative; height: 100%; width: 100%; max-width: 100vw; overflow: hidden; }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; overflow: hidden; }
.pixel { font-family: var(--font-pixel); }

/* 버튼: 기본은 바탕색, primary는 받치는 주황, accent는 포인트 청록(화면에서 가장 중요한 한 곳) */
.btn {
  --fill: var(--surface);
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 8px 16px;
  font-family: var(--font-pixel); font-weight: 700; font-size: 15px; letter-spacing: 0.02em;
  color: var(--ink); background: var(--fill);
  border: 3px solid var(--line); border-radius: var(--radius);
  box-shadow: 0 4px 0 var(--shadow);
  cursor: pointer; user-select: none; -webkit-user-select: none;
  transition: transform 60ms ease, box-shadow 60ms ease, filter 120ms;
  touch-action: manipulation;
}
.btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--shadow); }
.btn:disabled { filter: grayscale(1); opacity: 0.5; cursor: default; }
.btn.small { min-height: 36px; padding: 4px 12px; font-size: 13px; box-shadow: 0 3px 0 var(--shadow); }
.btn.icon { padding: 6px; min-width: 44px; }
.btn.ghost { --fill: var(--base-2); }
.btn.primary { --fill: var(--support); color: var(--on-color); }
.btn.accent { --fill: var(--point); color: var(--on-color); }
.btn.dark { --fill: var(--ink); color: var(--on-color); }
.btn svg { width: 20px; height: 20px; flex: none; shape-rendering: crispEdges; }

/* 상단 바: 화면을 받치는 주황 띠 */
.topbar {
  display: flex; align-items: center; gap: 12px; flex: none;
  padding: 10px max(var(--gutter), calc((100% - 800px) / 2 + var(--gutter)));
  margin-bottom: 14px;
  color: var(--on-color); background: var(--support);
  border-bottom: 3px solid var(--line);
}
.topbar h2 { margin: 0; font-family: var(--font-pixel); font-size: 20px; font-weight: 700; flex: 1; min-width: 0; text-wrap: balance; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 10px; font-family: var(--font-pixel); font-size: 12px; font-weight: 700;
  color: var(--ink); background: var(--surface);
  border: 2px solid var(--line); border-radius: 999px;
  white-space: nowrap;
}

/* 메인 메뉴 */
.menu { align-items: center; justify-content: center; gap: 14px; padding: 12px var(--gutter); overflow-y: auto; }
.menu-inner { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 14px; margin: auto 0; }
.logo { margin: 0; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.logo-main {
  font-family: var(--font-pixel); font-weight: 700; font-size: clamp(34px, 11vw, 52px); line-height: 1.1;
  color: var(--point); letter-spacing: 0.02em;
  text-shadow: 3px 0 0 var(--line), -3px 0 0 var(--line), 0 3px 0 var(--line), 0 -3px 0 var(--line),
    3px 3px 0 var(--line), -3px -3px 0 var(--line), 3px -3px 0 var(--line), -3px 3px 0 var(--line), 6px 7px 0 var(--support);
}
.logo-sub {
  display: inline-block; font-family: var(--font-pixel); font-weight: 700; font-size: 13px; letter-spacing: 0.12em;
  padding: 3px 12px; color: var(--on-color); background: var(--support); border: 2px solid var(--line); border-radius: 4px;
  box-shadow: 0 3px 0 var(--shadow);
}
.menu-hero { display: block; width: 100%; height: clamp(110px, 24vh, 170px); }
.menu-list { display: flex; flex-direction: column; gap: 12px; }
.menu-btn {
  display: grid; grid-template-columns: 44px 1fr; grid-template-rows: auto auto; column-gap: 12px; align-items: center;
  width: 100%; padding: 9px 14px; text-align: left;
  color: var(--on-color); background: var(--support);
  border: 3px solid var(--line); border-radius: 10px; box-shadow: 0 5px 0 var(--shadow);
  cursor: pointer; touch-action: manipulation;
  transition: transform 60ms ease, box-shadow 60ms ease;
}
.menu-btn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 1px 0 var(--shadow); }
.menu-btn:disabled { cursor: default; background: var(--gray); }
.menu-btn:disabled .mb-icon { color: var(--gray-deep); }
.menu-btn .mb-icon { grid-row: 1 / span 2; width: 44px; height: 44px; display: grid; place-items: center; color: var(--point); background: var(--on-color); border: 2px solid var(--line); border-radius: 8px; }
.menu-btn .mb-icon svg { width: 28px; height: 28px; shape-rendering: crispEdges; }
.menu-btn .mb-title { font-family: var(--font-pixel); font-size: 19px; font-weight: 700; line-height: 1.25; }
.menu-btn .mb-sub { font-family: var(--font-pixel); font-size: 12px; line-height: 1.35; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.menu-foot { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }

/* 단계 선택 */
.stages-body { flex: 1; overflow-y: auto; padding: 0 var(--gutter) 28px; -webkit-overflow-scrolling: touch; }
.stages-inner { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
.tier { background: var(--surface); border: 3px solid var(--line); border-radius: 12px; box-shadow: 0 5px 0 var(--shadow); overflow: hidden; }
.tier-head { position: relative; height: 66px; overflow: hidden; color: var(--on-color); background: var(--base-2); border-bottom: 3px solid var(--line); }
.tier-bg { position: absolute; left: 0; top: 0; display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
.tier-title {
  position: absolute; z-index: 1; left: 10px; top: 50%; transform: translateY(-50%);
  display: flex; flex-direction: column; gap: 1px; padding: 4px 10px 5px;
  background: var(--support); border: 2px solid var(--line); border-radius: 6px; box-shadow: 0 3px 0 var(--shadow);
}
.tier-head h3 { margin: 0; font-family: var(--font-pixel); font-size: 16px; line-height: 1.15; }
.tier-head .range { font-family: var(--font-pixel); font-size: 11px; font-weight: 700; white-space: nowrap; }
.tier p { margin: 10px 12px; font-size: 13px; color: var(--text-dim); }
.stage-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; padding: 0 12px 14px; }
@media (min-width: 620px) { .stage-grid { grid-template-columns: repeat(10, minmax(0, 1fr)); } }
.stage {
  position: relative; aspect-ratio: 1 / 1; max-width: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0;
  font-family: var(--font-pixel); color: var(--ink);
  background: var(--on-color); border: 2px solid var(--line); border-radius: 8px; box-shadow: 0 3px 0 var(--shadow);
  cursor: pointer; padding: 0; touch-action: manipulation;
}
.stage:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--shadow); }
.stage .num { font-size: clamp(15px, 4.6vw, 20px); font-weight: 700; line-height: 1; }
.stage .rk { font-size: 10px; line-height: 1.2; margin-top: 3px; }
.stage.cleared, .stage.perfect { background: var(--support); color: var(--on-color); }
.stage.next { background: var(--point); color: var(--on-color); animation: nudge 1.6s ease-in-out infinite; }
.stage.locked { background: var(--gray-soft); color: var(--gray-deep); cursor: default; box-shadow: none; border-color: var(--gray-deep); border-style: dashed; }
.stage .badge { position: absolute; top: -8px; right: -7px; width: 22px; height: 22px; display: grid; place-items: center; color: var(--support); background: var(--on-color); border: 2px solid var(--line); border-radius: 50%; }
.stage.perfect .badge { color: var(--point); }
.stage.locked .badge { background: var(--gray-soft); color: var(--gray-deep); border-color: var(--gray-deep); }
.stage .badge svg { width: 13px; height: 13px; shape-rendering: crispEdges; }
@keyframes nudge { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }

/* 대국 화면 */
.game { padding: 8px var(--gutter) 10px; }
.game-layout {
  flex: 1; min-height: 0; width: 100%;
  display: grid; row-gap: 8px;
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: minmax(0, 1fr) auto auto auto auto minmax(0, 1fr) auto;
  grid-template-areas: "." "opp" "board" "me" "moves" "." "actions";
  justify-items: center;
}
.game-layout.wide {
  grid-template-columns: auto minmax(220px, 340px);
  grid-template-rows: auto minmax(0, 1fr) auto auto;
  grid-template-areas: "board opp" "board moves" "board me" "board actions";
  justify-content: center; align-content: center; justify-items: stretch; column-gap: 16px;
}
.player-bar {
  width: 100%; max-width: calc(var(--board, 100%) + 22px);
  display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; align-items: center; gap: 10px;
  padding: 6px 8px; color: var(--on-color); background: var(--support);
  border: 3px solid var(--line); border-radius: 10px; box-shadow: 0 4px 0 var(--shadow);
}
.game-layout.wide .player-bar { max-width: none; }
.player-bar.opp { grid-area: opp; }
.player-bar.me { grid-area: me; }
.pb-avatar { width: 40px; height: 40px; border: 2px solid var(--line); border-radius: 8px; background: var(--on-color); overflow: hidden; }
.pb-avatar canvas { display: block; width: 100%; height: 100%; }
.pb-info { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.pb-name { font-family: var(--font-pixel); font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pb-sub { display: flex; align-items: center; gap: 6px; min-height: 20px; min-width: 0; }
.captured { display: flex; align-items: center; flex-wrap: nowrap; min-width: 0; overflow: hidden; }
.captured canvas { width: 20px; height: 20px; margin-right: -6px; flex: none; }
.adv { font-family: var(--font-pixel); font-size: 11px; font-weight: 700; margin-left: 8px; flex: none; }
.pb-meta { font-family: var(--font-pixel); font-size: 11px; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0.95; }
.thinking { font-family: var(--font-pixel); font-size: 11px; white-space: nowrap; }
.thinking::after { content: '...'; display: inline-block; width: 1.4em; overflow: hidden; vertical-align: bottom; animation: dots 1s steps(4) infinite; }
@keyframes dots { from { width: 0; } to { width: 1.4em; } }
.me-status { font-family: var(--font-pixel); font-size: 11px; font-weight: 700; color: var(--on-color); background: var(--point); border: 2px solid var(--line); border-radius: 4px; padding: 0 5px; vertical-align: 1px; }
.me-status:empty { display: none; }
.clock {
  font-family: var(--font-pixel); font-weight: 700; font-size: 22px; font-variant-numeric: tabular-nums; letter-spacing: 0.02em;
  min-width: 92px; text-align: center; padding: 4px 8px;
  color: var(--ink); background: var(--surface); border: 3px solid var(--line); border-radius: 8px;
  transition: background 150ms;
}
.clock.active { color: var(--on-color); background: var(--point); }
.clock.low { color: var(--on-color); background: var(--ink); }
.clock.low.active { animation: blink 1s steps(2) infinite; }
.clock.paused { opacity: 0.7; }
@keyframes blink { 50% { background: var(--point); } }

.board-wrap {
  grid-area: board; position: relative; width: fit-content;
  padding: 8px; background: var(--support);
  border: 3px solid var(--line); border-radius: 10px; box-shadow: 0 6px 0 var(--shadow);
  touch-action: none; user-select: none; -webkit-user-select: none;
}
.board-inner {
  position: relative; width: var(--board, 320px); height: var(--board, 320px);
  overflow: hidden; background: var(--on-color); outline: 2px solid var(--line); border-radius: 1px;
}
.board-inner canvas.board { display: block; }
.battle-canvas { position: absolute; left: 0; top: 0; z-index: 3; touch-action: none; }
.board-banner {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 4;
  font-family: var(--font-pixel); font-weight: 700; font-size: clamp(22px, 8vw, 38px); white-space: nowrap;
  color: var(--on-color); padding: 8px 18px; background: var(--support); border: 3px solid var(--line); border-radius: 8px;
  box-shadow: 0 5px 0 var(--shadow);
  pointer-events: none; animation: drop 1.1s ease forwards;
}
.board-banner.check { background: var(--point); animation: pop 0.9s ease forwards; font-size: clamp(18px, 6vw, 28px); }
@keyframes drop { 0% { opacity: 0; transform: translate(-50%, -130%); } 20% { opacity: 1; transform: translate(-50%, -50%); } 80% { opacity: 1; transform: translate(-50%, -50%); } 100% { opacity: 0; transform: translate(-50%, -40%); } }
@keyframes pop { 0% { opacity: 0; transform: translate(-50%, -50%) scale(0.6); } 25% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); } 75% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -50%) scale(1); } }

.moves {
  grid-area: moves; width: 100%; max-width: calc(var(--board, 100%) + 22px); min-height: 34px;
  display: flex; align-items: center; gap: 4px; overflow-x: auto; overflow-y: hidden; scrollbar-width: none;
  font-family: var(--font-pixel); font-size: 13px;
  padding: 4px 2px;
}
.moves::-webkit-scrollbar { display: none; }
.moves .mv-num { color: var(--text-dim); margin-left: 6px; flex: none; }
.moves .mv { flex: none; padding: 2px 6px; border-radius: 4px; cursor: default; white-space: nowrap; }
.moves .mv.cur { background: var(--point-soft); color: var(--ink); outline: 2px solid var(--line); }
.moves .empty { color: var(--text-dim); font-family: var(--font-body); font-size: 13px; }
.game-layout.wide .moves {
  max-width: none; display: grid; grid-template-columns: 34px 1fr 1fr; align-content: start; align-items: center; gap: 2px 4px;
  overflow-y: auto; overflow-x: hidden; background: var(--surface); border: 3px solid var(--line); border-radius: 10px; padding: 8px;
}
.game-layout.wide .moves .mv-num { margin: 0; }
.game-actions, .review-actions {
  grid-area: actions; width: 100%; max-width: calc(var(--board, 100%) + 22px);
  display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;
}
.review-actions { grid-template-columns: repeat(4, minmax(0, 1fr)) minmax(0, 1.4fr); }
.game-layout.wide .game-actions, .game-layout.wide .review-actions { max-width: none; }
.game-actions .btn, .review-actions .btn { padding: 6px 4px; font-size: 14px; min-width: 0; }

/* 시트(대화상자) */
.layer { position: absolute; inset: 0; z-index: 20; display: flex; align-items: flex-end; justify-content: center; background: var(--scrim); padding: 16px; }
@media (min-width: 640px) and (min-height: 520px) { .layer { align-items: center; } }
.sheet:focus { outline: none; }
.sheet {
  width: 100%; max-width: 440px; max-height: calc(100% - 8px); overflow-y: auto;
  background: var(--surface); color: var(--text);
  border: 3px solid var(--line); border-radius: 14px; box-shadow: 0 6px 0 var(--shadow);
  padding: 18px 16px 16px; display: flex; flex-direction: column; gap: 12px;
  animation: rise 180ms ease-out;
}
@keyframes rise { from { transform: translateY(24px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.sheet h3 { margin: 0; font-family: var(--font-pixel); font-size: 21px; line-height: 1.3; text-wrap: balance; }
.sheet p { margin: 0; }
.sheet .muted { color: var(--text-dim); font-size: 14px; }
.sheet .actions { display: grid; gap: 10px; margin-top: 4px; }
.sheet .actions.two { grid-template-columns: 1fr 1fr; }
.sheet .warn { background: var(--base-2); border: 2px dashed var(--support); border-radius: 8px; padding: 8px 10px; font-size: 14px; }
.seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.seg button {
  min-height: 44px; font-family: var(--font-pixel); font-weight: 700; font-size: 14px; color: var(--ink);
  background: var(--base-2); border: 2px solid var(--line); border-radius: 8px; cursor: pointer; padding: 4px 6px;
  touch-action: manipulation;
}
.seg button[aria-pressed="true"] { color: var(--on-color); background: var(--support); box-shadow: inset 0 -3px 0 var(--support-deep); }
.result-title { font-family: var(--font-pixel); font-weight: 700; font-size: 40px; line-height: 1.1; text-align: center; margin: 4px 0 0;
  text-shadow: 2px 2px 0 var(--line), -2px -2px 0 var(--line), 2px -2px 0 var(--line), -2px 2px 0 var(--line), 0 5px 0 var(--line); }
.result-title.win { color: var(--point); }
.result-title.lose { color: var(--gray); }
.result-title.draw { color: var(--on-color); }
.result-reason { text-align: center; font-family: var(--font-pixel); font-size: 15px; }
.result-promo { margin: 2px 0 6px; text-align: center; font-family: var(--font-pixel); font-weight: 700; font-size: 15px; color: var(--on-color); background: var(--point); border: 2px solid var(--line); border-radius: 6px; padding: 6px 10px; box-shadow: 0 3px 0 var(--shadow); }
.result-note { text-align: center; font-size: 14px; color: var(--text-dim); }
.promo-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.promo-grid button {
  display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px 8px;
  font-family: var(--font-pixel); font-size: 13px; font-weight: 700; color: var(--ink);
  background: var(--base-2); border: 3px solid var(--line); border-radius: 10px; box-shadow: 0 4px 0 var(--shadow); cursor: pointer;
}
.promo-grid button:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--shadow); }
.promo-grid canvas { width: 56px; height: 56px; }
.stage-intro { display: grid; grid-template-columns: 64px 1fr; gap: 12px; align-items: center; }
.stage-intro canvas { width: 64px; height: 64px; background: var(--gray-soft); border: 2px solid var(--line); border-radius: 10px; }
.record-line { font-family: var(--font-pixel); font-size: 12px; color: var(--text-dim); }

/* 토스트 */
.toast {
  position: absolute; left: 50%; top: 14px; transform: translateX(-50%); z-index: 40;
  max-width: calc(100% - 32px); padding: 8px 14px; font-family: var(--font-pixel); font-size: 14px; font-weight: 700;
  color: var(--on-color); background: var(--ink); border: 3px solid var(--line); border-radius: 8px; box-shadow: 0 4px 0 var(--point);
  pointer-events: none; text-align: center; animation: toast 2.2s ease forwards;
}
@keyframes toast { 0% { opacity: 0; transform: translate(-50%, -10px); } 10% { opacity: 1; transform: translate(-50%, 0); } 85% { opacity: 1; } 100% { opacity: 0; } }

/* 배우기 */
.learn-body { flex: 1; overflow-y: auto; padding: 0 var(--gutter) 28px; -webkit-overflow-scrolling: touch; }
.learn-inner { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
.chapter-list { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
@media (min-width: 620px) { .chapter-list { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.chapter-card {
  display: grid; grid-template-columns: 52px 1fr; gap: 0; align-items: stretch; text-align: left;
  padding: 0; background: var(--surface); color: var(--text); overflow: hidden;
  border: 3px solid var(--line); border-radius: 10px; box-shadow: 0 4px 0 var(--shadow); cursor: pointer;
}
.chapter-card:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--shadow); }
.chapter-card .no { font-family: var(--font-pixel); font-weight: 700; font-size: 17px; display: grid; place-items: center; color: var(--on-color); background: var(--support); border-right: 3px solid var(--line); }
.chapter-card .body { padding: 9px 12px; min-width: 0; }
.chapter-card .t { font-family: var(--font-pixel); font-weight: 700; font-size: 15px; }
.chapter-card .d { font-size: 13px; color: var(--text-dim); line-height: 1.35; }
.chapter { background: var(--surface); border: 3px solid var(--line); border-radius: 12px; box-shadow: 0 5px 0 var(--shadow); padding: 0 14px 14px; display: flex; flex-direction: column; gap: 10px; overflow: hidden; }
.chapter h3 { margin: 0 -14px 4px; padding: 8px 14px; font-family: var(--font-pixel); font-size: 19px; text-wrap: balance; color: var(--on-color); background: var(--support); border-bottom: 3px solid var(--line); }
.chapter p { margin: 0; max-width: 62ch; }
.chapter ul { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 4px; }
.chapter li { max-width: 60ch; }
.chapter li::marker { color: var(--support); }
.demo { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.demo .board-wrap { box-shadow: 0 4px 0 var(--shadow); }
.demo-hint { font-family: var(--font-pixel); font-size: 13px; text-align: center; min-height: 1.5em; color: var(--text); }
.demo-hint.ok { color: var(--point-deep); font-weight: 700; }
.demo-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.chapter-nav { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.notation-table { width: 100%; border-collapse: collapse; font-size: 14px; }
.notation-table td { padding: 4px 6px; border-bottom: 2px dotted var(--gray); vertical-align: top; }

.switch .track { position: absolute; inset: 0; background: var(--gray-soft); border: 3px solid var(--line); border-radius: 999px; transition: background 120ms; }
.switch .knob { position: absolute; top: 5px; left: 6px; width: 22px; height: 22px; background: var(--on-color); border: 3px solid var(--line); border-radius: 50%; transition: transform 140ms ease; }
.switch input:checked ~ .track { background: var(--point); }

.switch input:focus-visible ~ .track { outline: 3px dashed var(--point); outline-offset: 3px; }
input[type="range"] { width: min(200px, 100%); accent-color: var(--point); }

<script>/** 체스 규칙 엔진과 AI 탐색기를 만든다 (워커에서도 그대로 쓰이므로 바깥 변수를 참조하지 않는다) */

  /** 기물 코드를 만든다 */
  function makePiece(color, type) { return type | (color << 3); }
  /** 수를 하나의 정수로 묶는다 */
  function encodeMove(from, to, promo, flags) { return from | (to << 7) | (promo << 14) | (flags << 17); }
  /** 수의 출발 칸 */
  function moveFrom(m) { return m & 127; }
  /** 수의 도착 칸 */
  function moveTo(m) { return (m >> 7) & 127; }
  /** 수의 승진 기물 종류 */
  function movePromo(m) { return (m >> 14) & 7; }
  /** 수의 특수 플래그 */
  function moveFlags(m) { return (m >> 17) & 15; }

  function parseSquare(name) {

      this.ply = 0;
      this.uMove = new Int32Array(MAX_HIST);
      this.uCap = new Int8Array(MAX_HIST);
      this.uCastle = new Int8Array(MAX_HIST);
      this.uEp = new Int16Array(MAX_HIST);
      this.uHalf = new Int16Array(MAX_HIST);
      this.uHashLo = new Int32Array(MAX_HIST);
      this.uHashHi = new Int32Array(MAX_HIST);
      this.histLo = new Int32Array(MAX_HIST + 1);
      this.histHi = new Int32Array(MAX_HIST + 1);
    }

    /** FEN 문자열로 국면을 만든다 (잘못된 FEN이면 예외, relaxed면 킹 없는 연습판 허용) */
    static fromFEN(fen, opts) {
      const relaxed = !!(opts && opts.relaxed);
      const pos = new Position();
      pos.relaxed = relaxed;
      const parts = String(fen).trim().split(/\s+/);
      if (parts.length < 4) throw new Error('FEN: fields');
      const rows = parts[0].split('/');
      if (rows.length !== 8) throw new Error('FEN: ranks');
      for (let i = 0; i < 8; i++) {
        const r = 7 - i;
        let f = 0;
        for (const ch of rows[i]) {
          if (ch >= '1' && ch <= '8') { f += ch.charCodeAt(0) - 48; continue; }
          const code = PIECE_CHARS.indexOf(ch);
          if (code <= 0 || ch === ' ') throw new Error('FEN: piece');
          if (f > 7) throw new Error('FEN: file overflow');
          pos.board[(r << 4) | f] = code;
          f++;
        }
        if (f !== 8) throw new Error('FEN: rank width');
      }
      if (parts[1] !== 'w' && parts[1] !== 'b') throw new Error('FEN: side');
      pos.side = parts[1] === 'w' ? WHITE : BLACK;
      let c = 0;
      if (parts[2] !== '-') {
        for (const ch of parts[2]) {
          if (ch === 'K') c |= CASTLE_WK; else if (ch === 'Q') c |= CASTLE_WQ;
          else if (ch === 'k') c |= CASTLE_BK; else if (ch === 'q') c |= CASTLE_BQ;
          else throw new Error('FEN: castling');
        }
      }
      const b = pos.board;
      if (b[0x04] !== 6) c &= ~(CASTLE_WK | CASTLE_WQ);
      if (b[0x07] !== 4) c &= ~CASTLE_WK;
      if (b[0x00] !== 4) c &= ~CASTLE_WQ;
      if (b[0x74] !== 14) c &= ~(CASTLE_BK | CASTLE_BQ);
      if (b[0x77] !== 12) c &= ~CASTLE_BK;
      if (b[0x70] !== 12) c &= ~CASTLE_BQ;
      pos.castling = c;
      pos.ep = -1;
      if (parts[3] !== '-') {
        const epSq = parseSquare(parts[3]);
        if (epSq < 0) throw new Error('FEN: ep');
        const us = pos.side, them = us ^ 1;
        const pawnSq = us === WHITE ? epSq - 16 : epSq + 16;
        const myPawn = PAWN | (us << 3);
        const okRank = (epSq >> 4) === (us === WHITE ? 5 : 2);
        if (okRank && b[pawnSq] === (PAWN | (them << 3)) && !b[epSq] &&
          ((!((pawnSq - 1) & 0x88) && b[pawnSq - 1] === myPawn) || (!((pawnSq + 1) & 0x88) && b[pawnSq + 1] === myPawn))) {
          pos.ep = epSq;
        }
      }
      pos.halfmove = parts.length > 4 ? Math.max(0, parseInt(parts[4], 10) || 0) : 0;
      pos.fullmove = parts.length > 5 ? Math.max(1, parseInt(parts[5], 10) || 1) : 1;
      pos.recompute();
      if (relaxed) return pos;
      if (pos.counts[6] !== 1 || pos.counts[14] !== 1) throw new Error('FEN: kings');
      for (let f = 0; f < 8; f++) {
        if ((b[0x70 | f] & 7) === PAWN || (b[f] & 7) === PAWN) throw new Error('FEN: pawn on back rank');
      }
      if (isSquareAttacked(b, pos.kingSq[pos.side ^ 1], pos.side)) throw new Error('FEN: side not to move in check');
      return pos;
    }

    /** 보드 배열로부터 해시·평가·개수를 다시 계산한다 */
    recompute() {
      const b = this.board;
      this.counts.fill(0);
      this.mg[0] = this.mg[1] = this.eg[0] = this.eg[1] = 0;
      this.phase = 0;
      let lo = 0, hi = 0;
      for (const sq of SQUARES) {
        const p = b[sq];
        if (!p) continue;
        const color = p >> 3, type = p & 7;
        this.counts[p]++;
        this.mg[color] += MG_PST[p][sq];
        this.eg[color] += EG_PST[p][sq];
        this.phase += PHASE_INC[type];
        lo ^= Z_PIECE_LO[p * 128 + sq]; hi ^= Z_PIECE_HI[p * 128 + sq];
        if (type === KING) this.kingSq[color] = sq;
      }
      lo ^= Z_CASTLE_LO[this.castling]; hi ^= Z_CASTLE_HI[this.castling];
      if (this.ep >= 0) { lo ^= Z_EP_LO[this.ep & 7]; hi ^= Z_EP_HI[this.ep & 7]; }
      if (this.side === BLACK) { lo ^= Z_SIDE_LO; hi ^= Z_SIDE_HI; }
      this.hashLo = lo; this.hashHi = hi;
      this.ply = 0;
      this.histLo[0] = lo; this.histHi[0] = hi;
    }

    /** 현재 국면을 FEN 문자열로 만든다 */
    toFEN() {
      let s = '';
      for (let r = 7; r >= 0; r--) {
        let empty = 0;
        for (let f = 0; f < 8; f++) {
          const p = this.board[(r << 4) | f];
          if (!p) { empty++; continue; }
          if (empty) { s += empty; empty = 0; }
          s += PIECE_CHARS[p];
        }
        if (empty) s += empty;
        if (r) s += '/';
      }
      let c = '';
      if (this.castling & CASTLE_WK) c += 'K';
      if (this.castling & CASTLE_WQ) c += 'Q';
      if (this.castling & CASTLE_BK) c += 'k';
      if (this.castling & CASTLE_BQ) c += 'q';
      return s + ' ' + (this.side === WHITE ? 'w' : 'b') + ' ' + (c || '-') + ' ' +
        (this.ep >= 0 ? sqName(this.ep) : '-') + ' ' + this.halfmove + ' ' + this.fullmove;
    }

    /** 국면을 깊은 복사한다 */
    clone() { return Position.fromFEN(this.toFEN(), { relaxed: this.relaxed }); }

    /** 0x88 칸의 기물 코드 */
    pieceAt(sq) { return this.board[sq]; }

    /** 현재 차례가 체크 상태인지 */
    inCheck() {
      const k = this.kingSq[this.side];
      return k >= 0 && isSquareAttacked(this.board, k, this.side ^ 1);
    }

    /** 수를 두고, 자기 킹이 공격받는 불법 수면 되돌린 뒤 false를 돌려준다 */
    make(m) {
      const from = m & 127, to = (m >> 7) & 127, promo = (m >> 14) & 7, flags = (m >> 17) & 15;
      const b = this.board, us = this.side, them = us ^ 1;
      const piece = b[from];
      const capSq = (flags & FLAG_EP) ? (us === WHITE ? to - 16 : to + 16) : to;
      const captured = b[capSq];
      const u = this.ply;
      this.uMove[u] = m; this.uCap[u] = captured; this.uCastle[u] = this.castling;
      this.uEp[u] = this.ep; this.uHalf[u] = this.halfmove;
      this.uHashLo[u] = this.hashLo; this.uHashHi[u] = this.hashHi;

      let lo = this.hashLo, hi = this.hashHi;
      if (this.ep >= 0) { lo ^= Z_EP_LO[this.ep & 7]; hi ^= Z_EP_HI[this.ep & 7]; }
      lo ^= Z_PIECE_LO[piece * 128 + from]; hi ^= Z_PIECE_HI[piece * 128 + from];
      this.mg[us] -= MG_PST[piece][from]; this.eg[us] -= EG_PST[piece][from];
      b[from] = 0;
      if (captured) {
        lo ^= Z_PIECE_LO[captured * 128 + capSq]; hi ^= Z_PIECE_HI[captured * 128 + capSq];
        this.mg[them] -= MG_PST[captured][capSq]; this.eg[them] -= EG_PST[captured][capSq];
        this.phase -= PHASE_INC[captured & 7];
        this.counts[captured]--;
        b[capSq] = 0;
      }
      let placed = piece;
      if (promo) {
        placed = promo | (us << 3);
        this.counts[piece]--; this.counts[placed]++;
        this.phase += PHASE_INC[promo];
      }
      b[to] = placed;
      lo ^= Z_PIECE_LO[placed * 128 + to]; hi ^= Z_PIECE_HI[placed * 128 + to];
      this.mg[us] += MG_PST[placed][to]; this.eg[us] += EG_PST[placed][to];
      if ((piece & 7) === KING) this.kingSq[us] = to;
      if (flags & FLAG_CASTLE) {
        let rf, rt;
        if (to > from) { rf = from + 3; rt = from + 1; } else { rf = from - 4; rt = from - 1; }
        const rook = b[rf];
        b[rf] = 0; b[rt] = rook;
        lo ^= Z_PIECE_LO[rook * 128 + rf] ^ Z_PIECE_LO[rook * 128 + rt];
        hi ^= Z_PIECE_HI[rook * 128 + rf] ^ Z_PIECE_HI[rook * 128 + rt];
        this.mg[us] += MG_PST[rook][rt] - MG_PST[rook][rf];
        this.eg[us] += EG_PST[rook][rt] - EG_PST[rook][rf];
      }
      const oldC = this.castling;
      const newC = oldC & CASTLE_MASK[from] & CASTLE_MASK[to];
      if (newC !== oldC) {
        lo ^= Z_CASTLE_LO[oldC] ^ Z_CASTLE_LO[newC];
        hi ^= Z_CASTLE_HI[oldC] ^ Z_CASTLE_HI[newC];
        this.castling = newC;
      }
      this.ep = -1;
      if (flags & FLAG_DOUBLE) {
        const enemyPawn = PAWN | (them << 3);
        if ((!((to + 1) & 0x88) && b[to + 1] === enemyPawn) || (!((to - 1) & 0x88) && b[to - 1] === enemyPawn)) {
          this.ep = us === WHITE ? from + 16 : from - 16;
          lo ^= Z_EP_LO[this.ep & 7]; hi ^= Z_EP_HI[this.ep & 7];
        }
      }
      this.halfmove = ((piece & 7) === PAWN || captured) ? 0 : this.halfmove + 1;
      if (us === BLACK) this.fullmove++;
      this.side = them;
      lo ^= Z_SIDE_LO; hi ^= Z_SIDE_HI;
      this.hashLo = lo; this.hashHi = hi;
      this.ply = u + 1;
      this.histLo[this.ply] = lo; this.histHi[this.ply] = hi;
      const k = this.kingSq[us];
      if (k >= 0 && isSquareAttacked(b, k, them)) { this.unmake(); return false; }
      return true;
    }

    /** 마지막 수를 되돌린다 */
    unmake() {
      const u = --this.ply;
      const m = this.uMove[u];
      const from = m & 127, to = (m >> 7) & 127, promo = (m >> 14) & 7, flags = (m >> 17) & 15;
      const b = this.board;
      const us = this.side ^ 1, them = this.side;
      this.side = us;
      if (us === BLACK) this.fullmove--;
      const placed = b[to];
      const piece = promo ? (PAWN | (us << 3)) : placed;
      this.mg[us] += MG_PST[piece][from] - MG_PST[placed][to];
      this.eg[us] += EG_PST[piece][from] - EG_PST[placed][to];
      if (promo) { this.counts[placed]--; this.counts[piece]++; this.phase -= PHASE_INC[promo]; }
      b[from] = piece; b[to] = 0;
      if ((piece & 7) === KING) this.kingSq[us] = from;
      const captured = this.uCap[u];
      if (captured) {
        const capSq = (flags & FLAG_EP) ? (us === WHITE ? to - 16 : to + 16) : to;
        b[capSq] = captured;
        this.mg[them] += MG_PST[captured][capSq]; this.eg[them] += EG_PST[captured][capSq];
        this.phase += PHASE_INC[captured & 7];
        this.counts[captured]++;
      }
      if (flags & FLAG_CASTLE) {
        let rf, rt;
        if (to > from) { rf = from + 3; rt = from + 1; } else { rf = from - 4; rt = from - 1; }
        const rook = b[rt];
        b[rt] = 0; b[rf] = rook;
        this.mg[us] += MG_PST[rook][rf] - MG_PST[rook][rt];
        this.eg[us] += EG_PST[rook][rf] - EG_PST[rook][rt];
      }
      this.castling = this.uCastle[u]; this.ep = this.uEp[u]; this.halfmove = this.uHalf[u];
      this.hashLo = this.uHashLo[u]; this.hashHi = this.uHashHi[u];
    }

    /** 탐색용 널무브(차례만 넘김)를 둔다 */
    makeNull() {
      const u = this.ply;
      this.uMove[u] = 0; this.uCap[u] = 0; this.uCastle[u] = this.castling;
      this.uEp[u] = this.ep; this.uHalf[u] = this.halfmove;
      this.uHashLo[u] = this.hashLo; this.uHashHi[u] = this.hashHi;
      let lo = this.hashLo, hi = this.hashHi;
      if (this.ep >= 0) { lo ^= Z_EP_LO[this.ep & 7]; hi ^= Z_EP_HI[this.ep & 7]; this.ep = -1; }
      lo ^= Z_SIDE_LO; hi ^= Z_SIDE_HI;
      this.side ^= 1;
      this.halfmove = 0;
      this.hashLo = lo; this.hashHi = hi;
      this.ply = u + 1;
      this.histLo[this.ply] = lo; this.histHi[this.ply] = hi;
    }

    /** 널무브를 되돌린다 */
    unmakeNull() {
      const u = --this.ply;
      this.side ^= 1;
      this.ep = this.uEp[u]; this.halfmove = this.uHalf[u];
      this.hashLo = this.uHashLo[u]; this.hashHi = this.uHashHi[u];
    }

    /** 의사합법 수를 out[n..]에 채우고 끝 인덱스를 돌려준다 (all=false면 잡기·퀸 승진만) */
    genMoves(out, n, all) {
      const b = this.board, us = this.side, them = us ^ 1;
      const dir = us === WHITE ? 16 : -16;
      const promoRank = us === WHITE ? 7 : 0;
      const startRank = us === WHITE ? 1 : 6;
      for (let i = 0; i < 64; i++) {
        const sq = SQUARES[i];
        const p = b[sq];
        if (!p || (p >> 3) !== us) continue;
        const t = p & 7;
        if (t === PAWN) {
          const to = sq + dir;
          const promoting = (to >> 4) === promoRank;
          if (!b[to]) {
            if (promoting) {
              out[n++] = encodeMove(sq, to, QUEEN, 0);
              if (all) {
                out[n++] = encodeMove(sq, to, KNIGHT, 0);
                out[n++] = encodeMove(sq, to, ROOK, 0);
                out[n++] = encodeMove(sq, to, BISHOP, 0);
              }
            } else if (all) {
              out[n++] = encodeMove(sq, to, 0, 0);
              if ((sq >> 4) === startRank && !b[to + dir]) out[n++] = encodeMove(sq, to + dir, 0, FLAG_DOUBLE);
            }
          }
          for (let k = -1; k <= 1; k += 2) {
            const c = to + k;
            if (c & 0x88) continue;
            const q = b[c];
            if (q && (q >> 3) === them) {
              if (promoting) {
                out[n++] = encodeMove(sq, c, QUEEN, FLAG_CAPTURE);
                if (all) {
                  out[n++] = encodeMove(sq, c, KNIGHT, FLAG_CAPTURE);
                  out[n++] = encodeMove(sq, c, ROOK, FLAG_CAPTURE);
                  out[n++] = encodeMove(sq, c, BISHOP, FLAG_CAPTURE);
                }
              } else out[n++] = encodeMove(sq, c, 0, FLAG_CAPTURE);
            } else if (c === this.ep) {
              out[n++] = encodeMove(sq, c, 0, FLAG_CAPTURE | FLAG_EP);
            }
          }
        } else if (t === KNIGHT || t === KING) {
          const offs = t === KNIGHT ? KNIGHT_OFFSETS : KING_OFFSETS;
          for (let k = 0; k < 8; k++) {
            const to = sq + offs[k];
            if (to & 0x88) continue;
            const q = b[to];
            if (!q) { if (all) out[n++] = encodeMove(sq, to, 0, 0); }
            else if ((q >> 3) === them) out[n++] = encodeMove(sq, to, 0, FLAG_CAPTURE);
          }
          if (t === KING && all) n = this.genCastling(out, n, sq);
        } else {
          const dirs = t === BISHOP ? DIAG : t === ROOK ? ORTHO : KING_OFFSETS;
          for (let k = 0; k < dirs.length; k++) {
            const d = dirs[k];
            let to = sq + d;
            while (!(to & 0x88)) {
              const q = b[to];
              if (!q) { if (all) out[n++] = encodeMove(sq, to, 0, 0); }
              else { if ((q >> 3) === them) out[n++] = encodeMove(sq, to, 0, FLAG_CAPTURE); break; }
              to += d;
            }
          }
        }
      }
      return n;
    }

    /** 캐슬링 수를 추가한다 (지나가는 칸 공격 여부까지 확인) */
    genCastling(out, n, sq) {
      const b = this.board, us = this.side, them = us ^ 1, c = this.castling;
      if (us === WHITE) {
        if (sq !== 0x04) return n;
        if ((c & CASTLE_WK) && !b[0x05] && !b[0x06] && b[0x07] === 4 &&
          !isSquareAttacked(b, 0x04, them) && !isSquareAttacked(b, 0x05, them) && !isSquareAttacked(b, 0x06, them)) {
          out[n++] = encodeMove(0x04, 0x06, 0, FLAG_CASTLE);
        }
        if ((c & CASTLE_WQ) && !b[0x03] && !b[0x02] && !b[0x01] && b[0x00] === 4 &&
          !isSquareAttacked(b, 0x04, them) && !isSquareAttacked(b, 0x03, them) && !isSquareAttacked(b, 0x02, them)) {
          out[n++] = encodeMove(0x04, 0x02, 0, FLAG_CASTLE);
        }
      } else {
        if (sq !== 0x74) return n;
        if ((c & CASTLE_BK) && !b[0x75] && !b[0x76] && b[0x77] === 12 &&
          !isSquareAttacked(b, 0x74, them) && !isSquareAttacked(b, 0x75, them) && !isSquareAttacked(b, 0x76, them)) {
          out[n++] = encodeMove(0x74, 0x76, 0, FLAG_CASTLE);
        }
        if ((c & CASTLE_BQ) && !b[0x73] && !b[0x72] && !b[0x71] && b[0x70] === 12 &&
          !isSquareAttacked(b, 0x74, them) && !isSquareAttacked(b, 0x73, them) && !isSquareAttacked(b, 0x72, them)) {
          out[n++] = encodeMove(0x74, 0x72, 0, FLAG_CASTLE);
        }
      }
      return n;
    }

    /** 합법 수 목록을 배열로 돌려준다 */
    legalMoves() {
      const buf = new Int32Array(256);
      const n = this.genMoves(buf, 0, true);
      const res = [];
      for (let i = 0; i < n; i++) {
        if (this.make(buf[i])) { this.unmake(); res.push(buf[i]); }
      }
      return res;
    }

    /** 특정 칸에서 출발하는 합법 수 목록 */
    legalMovesFrom(sq) {
      return this.legalMoves().filter(m => moveFrom(m) === sq);
    }

    /** 합법 수가 하나라도 있는지 */
    hasLegalMove() {
      const buf = new Int32Array(256);
      const n = this.genMoves(buf, 0, true);
      for (let i = 0; i < n; i++) if (this.make(buf[i])) { this.unmake(); return true; }
      return false;
    }

    /** UCI 문자열에 해당하는 합법 수를 찾는다 (없으면 0) */
    moveFromUci(uci) {
      if (typeof uci !== 'string' || uci.length < 4) return 0;
      const from = parseSquare(uci.slice(0, 2)), to = parseSquare(uci.slice(2, 4));
      const promo = uci.length > 4 ? ' pnbrqk'.indexOf(uci[4].toLowerCase()) : 0;
      for (const m of this.legalMoves()) {
        if (moveFrom(m) === from && moveTo(m) === to && movePromo(m) === (promo > 0 ? promo : 0)) return m;
      }
      return 0;
    }

    /** 수를 표준 대수 기보(SAN)로 만든다 (수를 두기 전에 호출) */
    san(m, legal) {
      const from = moveFrom(m), to = moveTo(m), promo = movePromo(m), flags = moveFlags(m);
      const b = this.board;
      const piece = b[from], t = piece & 7;
      let s;
      if (flags & FLAG_CASTLE) s = to > from ? 'O-O' : 'O-O-O';
      else if (t === PAWN) {
        s = (flags & FLAG_CAPTURE) ? 'abcdefgh'[from & 7] + 'x' + sqName(to) : sqName(to);
        if (promo) s += '=' + ' PNBRQK'[promo];
      } else {
        s = ' PNBRQK'[t];
        const list = legal || this.legalMoves();
        let ambiguous = false, sameFile = false, sameRank = false;
        for (const o of list) {
          if (o === m || moveTo(o) !== to) continue;
          const of = moveFrom(o);
          if (b[of] !== piece) continue;
          ambiguous = true;
          if ((of & 7) === (from & 7)) sameFile = true;
          if ((of >> 4) === (from >> 4)) sameRank = true;
        }
        if (ambiguous) {
          if (!sameFile) s += 'abcdefgh'[from & 7];
          else if (!sameRank) s += (from >> 4) + 1;
          else s += sqName(from);
        }
        if (flags & FLAG_CAPTURE) s += 'x';
        s += sqName(to);
      }
      if (this.make(m)) {
        if (this.inCheck()) s += this.legalMoves().length ? '+' : '#';
        this.unmake();
      }
      return s;
    }

    /** 같은 국면 판정용 키 (앙파상은 실제로 잡을 수 있을 때만 반영) */
    repetitionKey() {
      let lo = this.hashLo, hi = this.hashHi;
      if (this.ep >= 0) {
        let canEp = false;
        for (const m of this.legalMoves()) if (moveFlags(m) & FLAG_EP) { canEp = true; break; }
        if (!canEp) { lo ^= Z_EP_LO[this.ep & 7]; hi ^= Z_EP_HI[this.ep & 7]; }
      }
      return (hi >>> 0).toString(16) + ':' + (lo >>> 0).toString(16);
    }

    /** 탐색 경로·대국 기록에서 같은 국면이 반복됐는지 */
    isRepetition() {
      const lo = this.hashLo, hi = this.hashHi;
      const stop = Math.max(0, this.ply - this.halfmove);
      for (let i = this.ply - 2; i >= stop; i -= 2) {
        if (this.histLo[i] === lo && this.histHi[i] === hi) return true;
      }
      return false;
    }

    /** 양쪽 모두 체크메이트가 불가능한 기물 부족인지 */
    insufficientMaterial() {
      const c = this.counts;
      if (c[1] || c[9] || c[4] || c[12] || c[5] || c[13]) return false;
      const knights = c[2] + c[10], bishops = c[3] + c[11];
      if (knights + bishops <= 1) return true;
      if (knights === 0) {
        let light = 0, dark = 0;
        for (const sq of SQUARES) {
          if ((this.board[sq] & 7) === BISHOP) { if (((sq >> 4) + (sq & 7)) & 1) light++; else dark++; }
        }
        return light === 0 || dark === 0;
      }
      return false;
    }

    /** 한쪽 진영이 어떤 수순으로도 체크메이트를 만들 수 없는지 (시간 초과 판정용) */
    cannotMate(color) {
      const c = this.counts, o = color << 3, e = (color ^ 1) << 3;
      if (c[o + PAWN] || c[o + ROOK] || c[o + QUEEN]) return false;
      const n = c[o + KNIGHT], bsh = c[o + BISHOP];
      if (n + bsh === 0) return true;
      if (n >= 1 && bsh >= 1) return false;
      if (n >= 2) return false;
      if (n === 1) {
        return !c[e + PAWN] && !c[e + KNIGHT] && !c[e + BISHOP] && !c[e + ROOK];
      }
      let light = false, dark = false;
      for (const sq of SQUARES) {
        if (this.board[sq] === (BISHOP | o)) { if (((sq >> 4) + (sq & 7)) & 1) light = true; else dark = true; }
      }
      if (light && dark) return false;
      if (c[e + PAWN] || c[e + KNIGHT]) return false;
      for (const sq of SQUARES) {
        if (this.board[sq] === (BISHOP | e)) {
          const isLight = !!(((sq >> 4) + (sq & 7)) & 1);
          if (isLight !== light) return false;
        }
      }
      return true;
    }

    /** 폰을 제외한 기물이 있는지 (널무브 허용 조건) */
    hasNonPawnMaterial(color) {
      const o = color << 3;
      return (this.counts[o + KNIGHT] + this.counts[o + BISHOP] + this.counts[o + ROOK] + this.counts[o + QUEEN]) > 0;
    }

    /** 현재 차례 입장의 정적 평가 점수(센티폰) */
    evaluate() {
      const b = this.board;
      let mg = this.mg[WHITE] - this.mg[BLACK];
      let eg = this.eg[WHITE] - this.eg[BLACK];
      let phase = this.phase > 24 ? 24 : this.phase;

      const wPawnCnt = [0, 0, 0, 0, 0, 0, 0, 0], bPawnCnt = [0, 0, 0, 0, 0, 0, 0, 0];
      const wMin = [8, 8, 8, 8, 8, 8, 8, 8], bMax = [-1, -1, -1, -1, -1, -1, -1, -1];
      for (let i = 0; i < 64; i++) {
        const sq = SQUARES[i];
        const p = b[sq];
        if (p === 1) { const f = sq & 7, r = sq >> 4; wPawnCnt[f]++; if (r < wMin[f]) wMin[f] = r; }
        else if (p === 9) { const f = sq & 7, r = sq >> 4; bPawnCnt[f]++; if (r > bMax[f]) bMax[f] = r; }
      }
      for (let i = 0; i < 64; i++) {
        const sq = SQUARES[i];
        const p = b[sq];
        if (!p) continue;
        const f = sq & 7, r = sq >> 4;
        if (p === 1) {
          let passed = true;
          for (let ff = f - 1; ff <= f + 1; ff++) { if (ff >= 0 && ff < 8 && bMax[ff] > r) { passed = false; break; } }
          if (passed) { mg += PASSED_MG[r]; eg += PASSED_EG[r]; }
          if ((f === 0 || !wPawnCnt[f - 1]) && (f === 7 || !wPawnCnt[f + 1])) { mg -= 10; eg -= 12; }
        } else if (p === 9) {
          let passed = true;
          for (let ff = f - 1; ff <= f + 1; ff++) { if (ff >= 0 && ff < 8 && wMin[ff] < r) { passed = false; break; } }
          if (passed) { mg -= PASSED_MG[7 - r]; eg -= PASSED_EG[7 - r]; }
          if ((f === 0 || !bPawnCnt[f - 1]) && (f === 7 || !bPawnCnt[f + 1])) { mg += 10; eg += 12; }
        } else if (p === 4) {
          if (!wPawnCnt[f]) { if (!bPawnCnt[f]) { mg += 20; eg += 8; } else { mg += 10; eg += 4; } }
        } else if (p === 12) {
          if (!bPawnCnt[f]) { if (!wPawnCnt[f]) { mg -= 20; eg -= 8; } else { mg -= 10; eg -= 4; } }
        }
      }
      for (let f = 0; f < 8; f++) {
        if (wPawnCnt[f] > 1) { mg -= 10 * (wPawnCnt[f] - 1); eg -= 20 * (wPawnCnt[f] - 1); }
        if (bPawnCnt[f] > 1) { mg += 10 * (bPawnCnt[f] - 1); eg += 20 * (bPawnCnt[f] - 1); }
      }
      if (this.counts[3] >= 2) { mg += 25; eg += 45; }
      if (this.counts[11] >= 2) { mg -= 25; eg -= 45; }

      if (phase > 10) {
        mg += this.kingShield(WHITE, wPawnCnt) - this.kingShield(BLACK, bPawnCnt);
      }

      let score = ((mg * phase + eg * (24 - phase)) / 24) | 0;
      score = this.endgameAdjust(score);
      return (this.side === WHITE ? score : -score) + 10;
    }

    /** 킹 앞 폰 방패를 점수로 매긴다 (중반 전용) */
    kingShield(color, pawnCnt) {
      const k = this.kingSq[color];
      const kf = k & 7, kr = k >> 4;
      const home = color === WHITE ? 0 : 7;
      if (Math.abs(kr - home) > 1) return -20;
      if (kf >= 3 && kf <= 4) return -10;
      const dir = color === WHITE ? 16 : -16;
      const pawn = PAWN | (color << 3);
      let s = 0;
      for (let f = Math.max(0, kf - 1); f <= Math.min(7, kf + 1); f++) {
        const s1 = k - kf + f + dir, s2 = s1 + dir;
        if (this.board[s1] === pawn) s += 12;
        else if (!(s2 & 0x88) && this.board[s2] === pawn) s += 6;
        else if (!pawnCnt[f]) s -= 12;
        else s -= 4;
      }
      return s;
    }

    /** 폰 없는 종반의 무승부 경향과 킹 몰기(몹업)를 반영한다 */
    endgameAdjust(score) {
      const c = this.counts;
      const strong = score > 0 ? WHITE : BLACK;
      const weak = strong ^ 1;
      const so = strong << 3, wo = weak << 3;
      const strongPawns = c[so + PAWN];
      const sMat = c[so + KNIGHT] * 3 + c[so + BISHOP] * 3 + c[so + ROOK] * 5 + c[so + QUEEN] * 9;
      const wMat = c[wo + KNIGHT] * 3 + c[wo + BISHOP] * 3 + c[wo + ROOK] * 5 + c[wo + QUEEN] * 9;
      if (!strongPawns) {
        if (sMat - wMat <= 3) score = (score / 6) | 0;
        else if (c[so + KNIGHT] === 2 && sMat === 6 && wMat === 0) score = (score / 8) | 0;
      }
      if (!c[wo + PAWN] && wMat <= 3 && sMat - wMat >= 5) {
        const wk = this.kingSq[weak], sk = this.kingSq[strong];
        const wf = wk & 7, wr = wk >> 4;
        const center = Math.max(3 - wf, wf - 4) + Math.max(3 - wr, wr - 4);
        const dist = Math.abs((sk & 7) - wf) + Math.abs((sk >> 4) - wr);
        const bonus = 40 * center + 12 * (14 - dist);
        score += strong === WHITE ? bonus : -bonus;
      }
      return score;
    }

    /** perft (수 생성 검증용 노드 수) */
    perft(depth) {
      if (depth === 0) return 1;
      const buf = new Int32Array(256);
      const n = this.genMoves(buf, 0, true);
      let total = 0;
      for (let i = 0; i < n; i++) {
        if (!this.make(buf[i])) continue;
        total += depth === 1 ? 1 : this.perft(depth - 1);
        this.unmake();
      }
      return total;
    }
  }

  /** 알파베타 탐색기 (치환표·킬러·히스토리·널무브·LMR·정지탐색) */
  class Searcher {
    /** 치환표 크기를 정해 탐색기를 만든다 */
    constructor(ttBits) {
      const size = 1 << (ttBits || 18);
      this.ttMask = size - 1;
      this.ttKey = new Int32Array(size);
      this.ttMove = new Int32Array(size);
      this.ttScore = new Int16Array(size);
      this.ttDepth = new Int8Array(size);
      this.ttFlag = new Int8Array(size);
      this.killers = new Int32Array(MAX_PLY * 2);
      this.history = new Int32Array(16 * 128);
      this.moveBuf = new Int32Array(MAX_PLY * 256);
      this.scoreBuf = new Int32Array(MAX_PLY * 256);
      this.nodes = 0;
      this.stop = false;
      this.canStop = false;
      this.deadline = 0;
      this.maxNodes = 0;
      this.useQuiescence = true;
    }

    /** 치환표를 비운다 (새 대국 시작 시) */
    clear() {
      this.ttKey.fill(0); this.ttMove.fill(0); this.ttDepth.fill(0); this.ttFlag.fill(0);
      this.history.fill(0); this.killers.fill(0);
    }

    /** 시간·노드 제한을 확인한다 */
    checkLimits() {
      if (!this.canStop) return;
      if ((this.maxNodes && this.nodes >= this.maxNodes) || (this.deadline && Date.now() >= this.deadline)) this.stop = true;
    }

    /** 수 정렬 점수를 매긴다 */
    scoreMoves(pos, base, n, ttMove, ply) {
      const b = pos.board;
      const k1 = this.killers[ply * 2], k2 = this.killers[ply * 2 + 1];
      for (let i = base; i < base + n; i++) {
        const m = this.moveBuf[i];
        let s;
        if (m === ttMove) s = 4000000;
        else {
          const flags = (m >> 17) & 15, promo = (m >> 14) & 7;
          const from = m & 127, to = (m >> 7) & 127;
          if (flags & FLAG_CAPTURE) {
            const victim = (flags & FLAG_EP) ? PAWN : (b[to] & 7);
            s = 2000000 + SEE_VAL[victim] * 10 - (b[from] & 7) + (promo === QUEEN ? 50000 : 0);
          } else if (promo === QUEEN) s = 1900000;
          else if (promo) s = -100000;
          else if (m === k1) s = 1800000;
          else if (m === k2) s = 1799000;
          else s = this.history[b[from] * 128 + to];
        }
        this.scoreBuf[i] = s;
      }
    }

    /** 남은 수 가운데 점수가 가장 높은 수를 앞으로 가져온다 */
    pickMove(i, end) {
      let best = i, bs = this.scoreBuf[i];
      for (let j = i + 1; j < end; j++) if (this.scoreBuf[j] > bs) { bs = this.scoreBuf[j]; best = j; }
      if (best !== i) {
        const tm = this.moveBuf[i]; this.moveBuf[i] = this.moveBuf[best]; this.moveBuf[best] = tm;
        const ts = this.scoreBuf[i]; this.scoreBuf[i] = this.scoreBuf[best]; this.scoreBuf[best] = ts;
      }
      return this.moveBuf[i];
    }

    /** 정지 탐색 (잡기 수만 끝까지 본다) */
    qsearch(pos, alpha, beta, ply) {
      if ((++this.nodes & 1023) === 0) this.checkLimits();
      if (this.stop) return 0;
      if (ply >= MAX_PLY - 1) return pos.evaluate();
      const inCheck = pos.inCheck();
      let best, standPat = 0;
      if (inCheck) best = -MATE + ply;
      else {
        standPat = pos.evaluate();
        if (standPat >= beta) return standPat;
        if (standPat > alpha) alpha = standPat;
        best = standPat;
      }
      const base = ply * 256;
      const end = pos.genMoves(this.moveBuf, base, inCheck);
      this.scoreMoves(pos, base, end - base, 0, ply);
      let legal = 0;
      for (let i = base; i < end; i++) {
        const m = this.pickMove(i, end);
        if (!inCheck) {
          const flags = (m >> 17) & 15, promo = (m >> 14) & 7;
          if (!promo) {
            const victim = (flags & FLAG_EP) ? PAWN : (pos.board[(m >> 7) & 127] & 7);
            if (standPat + SEE_VAL[victim] + 200 < alpha) continue;
          }
        }
        if (!pos.make(m)) continue;
        legal++;
        const s = -this.qsearch(pos, -beta, -alpha, ply + 1);
        pos.unmake();
        if (this.stop) return 0;
        if (s > best) {
          best = s;
          if (s > alpha) { alpha = s; if (s >= beta) break; }
        }
      }
      if (inCheck && legal === 0) return -MATE + ply;
      return best;
    }

    /** 네가맥스 알파베타 탐색 */
    negamax(pos, depth, alpha, beta, ply, canNull) {
      if ((++this.nodes & 1023) === 0) this.checkLimits();
      if (this.stop) return 0;
      const pvNode = beta - alpha > 1;
      if (pos.halfmove >= 100 || pos.isRepetition() || pos.insufficientMaterialFast()) return 0;
      if (alpha < -MATE + ply) alpha = -MATE + ply;
      if (beta > MATE - ply - 1) beta = MATE - ply - 1;
      if (alpha >= beta) return alpha;
      const inCheck = pos.inCheck();
      if (inCheck) depth++;
      if (depth <= 0) return this.useQuiescence ? this.qsearch(pos, alpha, beta, ply) : pos.evaluate();
      if (ply >= MAX_PLY - 1) return pos.evaluate();

      const idx = pos.hashLo & this.ttMask;
      let ttMove = 0;
      if (this.ttKey[idx] === pos.hashHi && this.ttFlag[idx]) {
        ttMove = this.ttMove[idx];
        if (!pvNode && this.ttDepth[idx] >= depth) {
          let s = this.ttScore[idx];
          if (s > MATE_BOUND) s -= ply; else if (s < -MATE_BOUND) s += ply;
          const f = this.ttFlag[idx];
          if (f === TT_EXACT || (f === TT_LOWER && s >= beta) || (f === TT_UPPER && s <= alpha)) return s;
        }
      }

      const staticEval = inCheck ? -INF : pos.evaluate();
      if (!pvNode && !inCheck && depth <= 3 && Math.abs(beta) < MATE_BOUND && staticEval - 110 * depth >= beta) return staticEval;
      if (canNull && !pvNode && !inCheck && depth >= 3 && staticEval >= beta && pos.hasNonPawnMaterial(pos.side)) {
        const R = depth >= 7 ? 3 : 2;
        pos.makeNull();
        const s = -this.negamax(pos, depth - 1 - R, -beta, -beta + 1, ply + 1, false);
        pos.unmakeNull();
        if (this.stop) return 0;
        if (s >= beta) return s > MATE_BOUND ? beta : s;
      }

      const base = ply * 256;
      const end = pos.genMoves(this.moveBuf, base, true);
      this.scoreMoves(pos, base, end - base, ttMove, ply);
      const k1 = this.killers[ply * 2], k2 = this.killers[ply * 2 + 1];
      let best = -INF, bestMove = 0, legal = 0, flag = TT_UPPER;
      const futile = !pvNode && !inCheck && depth <= 2 && Math.abs(alpha) < MATE_BOUND && staticEval + FUTILITY_MARGIN[depth] <= alpha;
      for (let i = base; i < end; i++) {
        const m = this.pickMove(i, end);
        const flags = (m >> 17) & 15, promo = (m >> 14) & 7;
        const quiet = !(flags & FLAG_CAPTURE) && !promo;
        const mover = pos.board[m & 127];
        if (!pos.make(m)) continue;
        legal++;
        const givesCheck = pos.inCheck();
        if (futile && quiet && legal > 1 && !givesCheck) { pos.unmake(); continue; }
        let score;
        if (legal === 1) {
          score = -this.negamax(pos, depth - 1, -beta, -alpha, ply + 1, true);
        } else {
          let R = 0;
          if (depth >= 3 && quiet && !inCheck && !givesCheck && legal > 3 && m !== k1 && m !== k2) {
            R = 1;
            if (legal > 8) R++;
            if (depth >= 8 && legal > 16) R++;
            if (pvNode) R--;
            if (R > depth - 2) R = depth - 2;
            if (R < 0) R = 0;
          }
          score = -this.negamax(pos, depth - 1 - R, -alpha - 1, -alpha, ply + 1, true);
          if (score > alpha && R > 0) score = -this.negamax(pos, depth - 1, -alpha - 1, -alpha, ply + 1, true);
          if (score > alpha && score < beta) score = -this.negamax(pos, depth - 1, -beta, -alpha, ply + 1, true);
        }
        pos.unmake();
        if (this.stop) return 0;
        if (score > best) {
          best = score; bestMove = m;
          if (score > alpha) {
            alpha = score; flag = TT_EXACT;
            if (score >= beta) {
              flag = TT_LOWER;
              if (quiet) {
                if (m !== k1) { this.killers[ply * 2 + 1] = k1; this.killers[ply * 2] = m; }
                const hi = mover * 128 + ((m >> 7) & 127);
                this.history[hi] += depth * depth;
                if (this.history[hi] > 1000000) for (let j = 0; j < this.history.length; j++) this.history[j] >>= 1;
              }
              break;
            }
          }
        }
      }
      if (legal === 0) return inCheck ? -MATE + ply : 0;
      let store = best;
      if (store > MATE_BOUND) store += ply; else if (store < -MATE_BOUND) store -= ply;
      this.ttKey[idx] = pos.hashHi; this.ttMove[idx] = bestMove; this.ttScore[idx] = store;
      this.ttDepth[idx] = depth; this.ttFlag[idx] = flag;
      return best;
    }

    /**
     * 반복 심화로 최선의 수를 찾는다.
     * opts: maxDepth, maxNodes, timeMs, noise(루트 수마다 더할 흔들림, 센티폰), quiescence
     */
    think(pos, opts) {
      opts = opts || {};
      const maxDepth = Math.min(opts.maxDepth || 64, MAX_PLY - 4);
      this.nodes = 0; this.stop = false; this.canStop = false;
      this.maxNodes = opts.maxNodes || 0;
      this.deadline = opts.timeMs ? Date.now() + opts.timeMs : 0;
      this.useQuiescence = opts.quiescence !== false;
      this.killers.fill(0);
      for (let j = 0; j < this.history.length; j++) this.history[j] >>= 3;
      const root = pos.legalMoves();
      if (!root.length) return { move: 0, score: pos.inCheck() ? -MATE : 0, depth: 0, nodes: 0 };
      const noise = opts.noise || 0;
      const bonus = root.map(() => noise ? Math.round(gaussian() * noise) : 0);
      const order = root.map((_, i) => i);
      const scores = new Array(root.length).fill(-INF);
      if (root.length === 1 && !opts.analyzeSingle) {
        return { move: root[0], score: 0, raw: 0, depth: 0, nodes: 0, forced: true };
      }
      let bestIdx = order[0], bestScore = -INF, bestRaw = 0, completed = 0;
      const t0 = Date.now();
      for (let depth = 1; depth <= maxDepth; depth++) {
        let alpha = -INF;
        const beta = INF;
        let iterBest = -1, iterScore = -INF;
        for (let k = 0; k < order.length; k++) {
          const i = order[k];
          const m = root[i], bns = bonus[i];
          pos.make(m);
          let s;
          if (k === 0) {
            s = -this.negamax(pos, depth - 1, -(beta - bns), -(alpha - bns), 1, true) + bns;
          } else {
            const a = alpha - bns;
            s = -this.negamax(pos, depth - 1, -a - 1, -a, 1, true) + bns;
            if (s > alpha && !this.stop) s = -this.negamax(pos, depth - 1, -(beta - bns), -a, 1, true) + bns;
          }
          pos.unmake();
          if (this.stop) break;
          scores[i] = s;
          if (s > iterScore) { iterScore = s; iterBest = i; if (s > alpha) alpha = s; }
        }
        if (this.stop) {
          if (iterBest >= 0 && iterScore > -INF) { bestIdx = iterBest; bestScore = iterScore; bestRaw = iterScore - bonus[iterBest]; }
          break;
        }
        bestIdx = iterBest; bestScore = iterScore; bestRaw = iterScore - bonus[iterBest]; completed = depth;
        this.canStop = true;
        order.sort((a, b) => (a === bestIdx ? -1 : b === bestIdx ? 1 : scores[b] - scores[a]));
        if (bestRaw > MATE_BOUND && MATE - bestRaw <= depth) break;
        if (this.maxNodes && this.nodes >= this.maxNodes) break;
        if (this.deadline && Date.now() - t0 > (this.deadline - t0) * 0.55) break;
      }
      return { move: root[bestIdx], score: bestScore, raw: bestRaw, depth: completed, nodes: this.nodes };
    }
  }

  /** 기물 부족 무승부를 개수만으로 빠르게 판정한다 */
  Position.prototype.insufficientMaterialFast = function () {
    const c = this.counts;
    if (c[1] || c[9] || c[4] || c[12] || c[5] || c[13]) return false;
    return (c[2] + c[10] + c[3] + c[11]) <= 1;
  };

  /** 표준 정규분포 난수 */
  function gaussian() {
    let u = 0, v = 0;
    while (u === 0) u = Math.random();
    while (v === 0) v = Math.random();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  }

  const BOOK_LINES = [
    'e2e4 e7e5 g1f3 b8c6 f1b5 a7a6 b5a4 g8f6 e1g1 f8e7 f1e1 b7b5 a4b3 d7d6',
    'e2e4 e7e5 g1f3 b8c6 f1b5 g8f6 e1g1 f6e4 d2d4 e4d6',
    'e2e4 e7e5 g1f3 b8c6 f1c4 f8c5 c2c3 g8f6 d2d3 d7d6',
    'e2e4 e7e5 g1f3 b8c6 f1c4 g8f6 d2d3 f8e7 e1g1 e8g8',
    'e2e4 e7e5 g1f3 b8c6 d2d4 e5d4 f3d4 g8f6 d4c6 b7c6',
    'e2e4 e7e5 g1f3 b8c6 b1c3 g8f6 f1b5 f8b4',
    'e2e4 e7e5 g1f3 g8f6 f3e5 d7d6 e5f3 f6e4 d2d4 d6d5',
    'e2e4 e7e5 g1f3 d7d6 d2d4 g8f6 b1c3 b8d7',
    'e2e4 e7e5 b1c3 g8f6 g1f3 b8c6 d2d4 e5d4',
    'e2e4 c7c5 g1f3 d7d6 d2d4 c5d4 f3d4 g8f6 b1c3 a7a6 c1e3 e7e5',
    'e2e4 c7c5 g1f3 d7d6 d2d4 c5d4 f3d4 g8f6 b1c3 g7g6 c1e3 f8g7',
    'e2e4 c7c5 g1f3 b8c6 d2d4 c5d4 f3d4 g8f6 b1c3 e7e5 d4b5 d7d6',
