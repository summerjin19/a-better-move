    ], { label: '이어하기' });
  },
  /** 이어하기 문구와 진행 현황을 새로 고친다 */
  refresh() {
    const solo = Store.saved(false), pvp = Store.saved(true);
    const sub = $('continue-sub');
    const btn = $('btn-continue');
    btn.disabled = false;
    if (solo && pvp) sub.textContent = '저장된 대국 2개 · 골라서 이어 둬요';
    else if (solo) sub.textContent = levelLabel(solo.level) + ' · ' + plyLabel(solo);
    else if (pvp) sub.textContent = '둘이 하기 · ' + plyLabel(pvp);
    else if (Store.clearedCount() > 0) sub.textContent = '다음 도전: ' + levelLabel(Math.min(50, Store.nextLevel()));
    else {
      sub.textContent = '저장된 대국이 없어요';
      btn.disabled = true;
    }
    const n = Store.clearedCount();
    $('progress-chip').textContent = '클리어 ' + n + ' / 50';
    const st = Store.data.stats;
    $('record-chip').textContent = Store.playerRank().name + ' · ' + (st.wins + st.losses + st.draws) + '전 ' + st.wins + '승 ' + st.losses + '패 ' + st.draws + '무';
  },
  /** 메뉴 그림(마주 선 두 병정)을 켜고 끈다 */
  setHeroRunning(on) {
    this.heroOn = on;
    if (on && !this.heroRaf) { this.heroT0 = performance.now(); this.heroRaf = requestAnimationFrame((t) => this.drawHero(t)); }
  },
  /** 메뉴 그림을 그린다 (가볍게 숨 쉬는 정도만 움직임) */
  drawHero(now) {
    this.heroRaf = 0;
    const cv = $('menu-hero');
    if (!cv || !this.heroOn) return;
    const w = cv.clientWidth, h = cv.clientHeight;
    if (!w || !h) { this.heroRaf = requestAnimationFrame((t) => this.drawHero(t)); return; }
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, w, h);
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const t = reduce ? 0 : (now - this.heroT0) / 1000;
    const gy = h * 0.8;
    c.fillStyle = '#E6E3DD';
    c.beginPath(); c.ellipse(w / 2, gy + h * 0.04, Math.min(w * 0.46, h * 1.5), h * 0.11, 0, 0, Math.PI * 2); c.fill();
    c.strokeStyle = '#2B2420'; c.lineWidth = 3; c.stroke();
    const H = h * 0.46;
    const sep = Math.min(w * 0.2, H * 0.95);
    const knight = Object.assign(Art.standPose(2), { bob: Math.abs(Math.sin(t * 2.2)) * 0.03, aF: 2.0 + Math.sin(t * 2.2) * 0.12, wAng: 1.25 });
    const rook = Object.assign(Art.standPose(4), { bob: Math.abs(Math.sin(t * 2.2 + 1.3)) * 0.02, gallop: (t * 0.4) % 1, aF: 1.4 + Math.sin(t * 2.2 + 1.3) * 0.1 });
    Art.drawFigure(c, w / 2 - sep, gy, H, 2, 0, { view: 'side', facing: 1, pose: knight, expr: 'fight' });
    Art.drawFigure(c, w / 2 + sep, gy, H, 4, 1, { view: 'side', facing: -1, pose: rook, expr: 'fight' });
    const sparkle = 0.5 + 0.5 * Math.sin(t * 3);
    c.save();
    c.globalAlpha = 0.6 + 0.4 * sparkle;
    Art.drawStar(c, w / 2, gy - H * 1.25, h * 0.055, h * 0.024);
    c.fillStyle = '#0093A5'; c.fill(); c.lineWidth = 2.5; c.strokeStyle = '#2B2420'; c.stroke();
    c.restore();
    if (!reduce) setTimeout(() => { if (this.heroOn && !this.heroRaf) this.heroRaf = requestAnimationFrame((tt) => this.drawHero(tt)); }, 50);
  }
};

/** 단계 선택 화면 */
const Stages = {
  /** 뒤로 가기 버튼을 연결한다 */
  init() {
    $('stages-back').prepend(pixelIcon('back'));
    $('stages-back').addEventListener('click', () => { Sfx.button(); Screens.show('menu'); });
    window.addEventListener('resize', () => { if (!$('screen-stages').hidden) this.drawScenes(); });
  },
  /** 부대별 단계 칸을 그린다 */
  render() {
    const box = $('stages-list');
    box.textContent = '';
    const next = Store.nextLevel();
    $('stages-progress').textContent = '클리어 ' + Store.clearedCount() + ' / 50';
    let nextEl = null;
    for (const tier of TIERS) {
      const grid = el('div', { class: 'stage-grid' });
      for (let n = tier.from; n <= tier.to; n++) {
        const rec = Store.level(n);
        const unlocked = Store.isUnlocked(n);
        let cls = 'stage';
        if (!unlocked) cls += ' locked';
        else if (rec.perfect) cls += ' perfect';
        else if (rec.cleared) cls += ' cleared';
        else if (n === next) cls += ' next';
        const label = levelLabel(n) + (unlocked ? (rec.perfect ? ', 무르기 없이 클리어' : rec.cleared ? ', 클리어' : ', 도전 가능') : ', 잠김');
        const b = el('button', { class: cls, type: 'button', 'aria-label': label, disabled: !unlocked, onclick: () => { Sfx.button(); this.openSheet(n); } },
          el('span', { class: 'num', text: n }),
          el('span', { class: 'rk', text: Core.rankName(n) }));
        if (!unlocked) b.appendChild(el('span', { class: 'badge' }, pixelIcon('lock')));
        else if (rec.perfect) b.appendChild(el('span', { class: 'badge' }, pixelIcon('star')));
        else if (rec.cleared) b.appendChild(el('span', { class: 'badge' }, pixelIcon('check')));
        if (n === next) nextEl = b;
        grid.appendChild(b);
      }
      box.appendChild(el('section', { class: 'tier' },
        el('div', { class: 'tier-head' },
          el('canvas', { class: 'tier-bg', 'data-scene': tier.scene, 'aria-hidden': 'true' }),

        el('p', { text: tier.desc }),
        grid));
    }
    requestAnimationFrame(() => this.drawScenes());
    if (nextEl) requestAnimationFrame(() => {
      const body = $('stages-body');
      const r = nextEl.getBoundingClientRect(), br = body.getBoundingClientRect();
      body.scrollTop += (r.top - br.top) - (br.height / 2 - r.height / 2);
    });

  /** 부대 머리띠의 도트 배경을 현재 너비에 맞춰 그린다 */
  drawScenes() {
    for (const cv of document.querySelectorAll('#stages-list .tier-bg')) {
      const w = cv.parentElement.clientWidth;
      if (w > 0 && cv.dataset.w !== String(w)) { cv.dataset.w = String(w); Scenes.draw(cv, cv.dataset.scene, w); }

    if (!ok) return;

    this.render();
  }

/** 저장된 설정을 화면·소리·판에 반영한다 */
function applySettings() {
  const s = Store.data.settings;
  Sfx.configure(s.sound, s.volume);
  Sfx.vibrate = !!s.vibrate;
  if (Play.board) Play.board.setOptions({ hints: s.hints, coords: s.coords, letters: s.letters });
  if (Learn.board) Learn.board.setOptions({ hints: true, coords: s.coords, letters: s.letters });
  Play.refreshUndo();
}

/** 남은 시간을 시계 문자열로 (20초 미만은 0.1초까지) */
function fmtClock(ms) {
  if (ms >= 20000) {
    const t = Math.ceil(ms / 1000);
    return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0');
  }
  const t = Math.max(0, ms);
  return '0:' + String(Math.floor(t / 1000)).padStart(2, '0') + '.' + Math.floor((t % 1000) / 100);
}

/** 대국 결과 이유를 사람이 읽는 문장으로 */
function reasonText(result, session) {
  const loser = result.winner === -1 ? -1 : result.winner ^ 1;
  const loserIsMe = loser === session.humanColor;
  if (session.pvp && result.reason === 'resign') return josa(SIDE_NAMES[loser], '이', '가') + ' 기권했어요';
  if (session.pvp && result.reason === 'timeout') return SIDE_NAMES[loser] + '의 시간이 다 됐어요';
  switch (result.reason) {
    case 'checkmate': return '체크메이트';
    case 'resign': return loserIsMe ? '기권했어요' : '상대가 기권했어요';
    case 'timeout': return loserIsMe ? '내 시간이 다 됐어요' : 'AI의 시간이 다 됐어요';
    case 'timeout-draw': return '시간이 다 됐지만, 상대에게 체크메이트할 병정이 없어요';
    case 'stalemate': return '스테일메이트 · 둘 수 있는 수가 없어요';
    case 'threefold': return '같은 국면이 세 번 나왔어요';
    case 'fifty': return '50수 동안 잡기도 폰 이동도 없었어요';
    case 'insufficient': return '양쪽 모두 체크메이트할 병정이 부족해요';
    case 'agreement': return '무승부에 합의했어요';
    default: return '';
  }
}

/** 대국 화면 진행자 (터치 → 수 → 애니메이션/전투 → 다음 차례 → 결과). 혼자 하기는 다음 차례가 AI, 둘이 하기는 맞은편 사람이다 */
const Play = {
  session: null,
  board: null,
  phase: 'idle',
  paused: false,
  selected: -1,
  selMoves: [],
  aiReq: null,
  tickTimer: 0,
  lastTickSec: -1,
  reviewPly: -1,
  hintAt: 0,
  pauseEntry: null,

  /** 버튼·판·크기 감시를 연결한다 */
  init() {
    const s = Store.data.settings;
    this.board = new BoardView($('board'), { hints: s.hints, coords: s.coords, letters: s.letters });
    this.board.onTap = (sq) => this.onTap(sq);
    $('btn-pause').prepend(pixelIcon('pause'));
    $('btn-undo').prepend(pixelIcon('undo'));
    $('btn-resign').prepend(pixelIcon('whiteflag'));
    $('btn-pause').addEventListener('click', () => { Sfx.button(); this.pause(false); });
    $('btn-undo').addEventListener('click', () => { Sfx.button(); this.undo(); });
    $('btn-resign').addEventListener('click', () => { Sfx.button(); this.resign(); });
    const rv = [['rv-first', 'first', () => this.reviewTo(0)], ['rv-prev', 'prev', () => this.reviewTo(this.reviewPly - 1)],
      ['rv-next', 'next', () => this.reviewTo(this.reviewPly + 1)], ['rv-last', 'last', () => this.reviewTo(this.session.records.length)]];
    for (const [id, icon, fn] of rv) { $(id).appendChild(pixelIcon(icon)); $(id).addEventListener('click', () => { Sfx.select(); fn(); }); }
    $('rv-exit').prepend(pixelIcon('home'));
    $('rv-exit').addEventListener('click', () => { Sfx.button(); this.openResultAgain(); });
    if (window.ResizeObserver) new ResizeObserver(() => this.layout()).observe($('screen-game'));
    window.addEventListener('resize', () => this.layout());
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        if (Screens.current === 'game' && this.session && !this.session.result && ['human', 'ai', 'promo'].includes(this.phase)) this.pause(true);
        else if (Screens.current === 'game') this.save();
      }
    });
    window.addEventListener('pagehide', () => this.save());
    $('moves').addEventListener('click', (e) => {
      const t = e.target.closest('.mv');
      if (t && this.phase === 'review') { Sfx.select(); this.reviewTo(+t.dataset.ply + 1); }
    });
  },

  /** 혼자 하기 새 대국을 시작한다 */
  startNew(level, humanColor) {
    this.discardSession();
    const s = new GameSession({ level, humanColor });
    AI.newGame();
    this.begin(s, true);
  },

  /** 둘이 하기 새 대국을 시작한다 (p1: 1P의 진영, seat: 앉는 자리) */
  startPvp(p1, seat) {
    this.discardSession();
    this.begin(new GameSession({ mode: 'pvp', level: 0, p1, seat }), true);
  },

  /** 메뉴의 '이어하기' (저장된 대국이 하나면 바로 이어서, 둘이면 고르게 하고, 없으면 다음 단계) */
  continueFromMenu() {
    const solo = Store.saved(false), pvp = Store.saved(true);
    if (solo && pvp) Menu.openContinueSheet();
    else if (solo || pvp) this.resumeSaved(!!pvp);
    else {
      Screens.show('stages');
      Stages.openSheet(Store.nextLevel());
    }
  },

  /** 저장된 대국을 되살려 이어 둔다 (pvp가 참이면 둘이 하기 대국) */
  resumeSaved(pvp) {
    let s;
    try { s = new GameSession(Store.saved(pvp)); } catch (e) { s = null; }
    if (!s || s.result) { Store.setGame(null, pvp); Toast.show('저장된 대국을 불러오지 못했어요'); Menu.refresh(); return; }
    this.discardSession();
    this.begin(s, false);
  },

  /** 진행 중인 대국을 저장한다 (혼자 하기와 둘이 하기는 저장 칸이 따로다) */
  save() {
    const s = this.session;
    if (s && !s.result) Store.setGame(s.toJSON(), s.pvp);
  },

  /** 대국 화면을 준비하고 첫 차례를 시작한다 */
  begin(session, fresh) {
    this.session = session;
    this.phase = 'idle'; this.paused = false; this.reviewPly = -1;
    this.clearSelection();
    this.board.setCeremony(null);
    Sheet.closeAll();
    $('game-actions').hidden = false;
    $('review-actions').hidden = true;
    Screens.show('game');
    const st = Store.data.settings;
    this.seatPlayers();
    this.board.setOptions({ flipped: session.humanColor === 1, hints: st.hints, coords: st.coords, letters: st.letters });
    this.layout();
    this.board.setFromPosition(session.pos);
    const last = session.records[session.records.length - 1];
    this.board.lastMove = last ? { from: last.from, to: last.to } : null;
    this.board.setCheck(session.checkSquare());
    this.drawAvatars();
    this.renderBars(); this.renderMoves(); this.updateClocks(); this.updateStatus(); this.refreshUndo();
    this.startTicker();
    if (fresh) {
      this.save();
      this.phase = 'intro';
      this.banner('전투 시작!');
      Sfx.start();
      setTimeout(() => { if (this.session === session && this.phase === 'intro') this.continueTurn(); }, 1150);
    } else {
      this.paused = true;
      this.phase = session.pvp || session.turn === session.humanColor ? 'human' : 'ai';
      this.updateStatus();
      this.openResumeSheet();
    }
  },

  /** 둘이 하기의 자리 배치를 화면에 맞춘다 (마주 앉기면 위쪽 자리의 병정·이름표를 그쪽에서 바로 보이게 돌리고, 주고받기면 둘 차례인 진영을 아래쪽에 둔다) */
  seatPlayers() {
    const s = this.session;
    if (s.pvp && s.seat === 'pass' && !s.result) s.setBottom(s.turn);
    const face = s.pvp && s.seat === 'face';
    this.board.rotColor = face ? s.aiColor : -1;
    $('bar-opp').classList.toggle('rot', face);
    $('game-layout').classList.toggle('pvp', s.pvp);
  },

  /** 주고받기: 둘 차례인 진영이 아래쪽에 오도록 판과 이름표를 돌린다 */
  turnBoard() {
    const s = this.session;
    if (!s.pvp || s.seat !== 'pass' || s.humanColor === s.turn) return;
    s.setBottom(s.turn);
    this.board.setOptions({ flipped: s.humanColor === 1 });
    this.drawAvatars(); this.renderBars(); this.updateClocks();
  },

  /** 그 진영이 마주 앉은 위쪽 자리인지 (알림·진급 창·큰 글자를 그쪽에서 바로 보이게 돌릴 때 쓴다) */
  facesTop(color) {
    const s = this.session;
    return !!s && s.pvp && s.seat === 'face' && color === s.aiColor;
  },

  /** 둘이 하기에서 진영의 선수 표시 ('1P' 또는 '2P') */
  pvpTag(color) { return color === this.session.p1 ? '1P' : '2P'; },

  /** 둘이 하기에서 진영의 이름표 ('1P · 백') */
  pvpName(color) { return this.pvpTag(color) + ' · ' + SIDE_NAMES[color]; },

  /** 진행 중인 대국을 정리한다 (저장은 호출한 쪽에서) */
  discardSession() {
    if (this.aiReq) { AI.cancel(this.aiReq.id); this.aiReq = null; }
    if (Battle.active) Battle.skip();
    if (this.board) this.board.setCeremony(null);
    clearInterval(this.tickTimer);
    this.session = null;
    this.phase = 'idle';
    this.paused = false;
  },

  /** 화면 크기에 맞춰 판 크기와 배치(세로/가로)를 정한다 */
  layout() {
    const scr = $('screen-game');
    if (!scr || scr.hidden) return;
    const lay = $('game-layout');
    const W = scr.clientWidth - 32, H = scr.clientHeight - 18;
    if (W <= 0 || H <= 0) return;
    const wide = W >= 560 && W > H * 1.2;
    lay.classList.toggle('wide', wide);
    let size;
    if (wide) {
      size = Math.min(H - 38, W - 250 - 16 - 34);
    } else {
      const bars = $('bar-opp').offsetHeight + $('bar-me').offsetHeight;
      const actions = ($('game-actions').hidden ? $('review-actions') : $('game-actions')).offsetHeight || 48;
      const reserved = bars + actions + 34 + 8 * 6 + 28;
      size = Math.min(W - 22, H - reserved);
    }
    size = Math.max(184, Math.floor(size / 8) * 8);
    lay.style.setProperty('--board', size + 'px');
    this.board.resize(size);
  },

  /** 진영 아바타(킹)를 그린다 */
  drawAvatars() {
    const s = this.session;
    for (const [id, color] of [['avatar-me', s.humanColor], ['avatar-opp', s.aiColor]]) {
      const c = $(id);
      const dpr = Math.min(window.devicePixelRatio || 1, 3);
      c.width = c.height = Math.round(40 * dpr);
      const ctx = c.getContext('2d');
      ctx.clearRect(0, 0, c.width, c.height);
      Art.drawPieceInSquare(ctx, 6, color, c.width);
    }
  },

  /** 이름표·잡은 기물·기물 차이를 갱신한다 */
  renderBars() {
    const s = this.session;
    if (!s) return;
    if (s.pvp) {
      $('opp-name').textContent = this.pvpName(s.aiColor);
      $('me-name').textContent = this.pvpName(s.humanColor);
      for (const id of ['opp-meta', 'opp-record', 'me-meta', 'me-record']) $(id).textContent = '';
      $('cap-opp').setAttribute('aria-label', this.pvpName(s.aiColor) + ' 쪽이 잡은 병정');
      $('cap-me').setAttribute('aria-label', this.pvpName(s.humanColor) + ' 쪽이 잡은 병정');
    } else {
      const rec = Store.level(s.level), st = Store.data.stats, games = st.wins + st.losses + st.draws;
      $('opp-name').textContent = levelLabel(s.level);
      $('me-name').textContent = '나 · ' + SIDE_NAMES[s.humanColor];
      const my = Store.playerRank();
      $('opp-meta').textContent = 'AI · ' + SIDE_NAMES[s.aiColor] + ' · ' + Core.rankOf(s.level).latin + ' · 약 ' + Core.ratingOf(s.level);
      $('opp-record').textContent = '이 상대와 ' + (rec.w + rec.l + rec.d) + '전 ' + rec.w + '승 ' + rec.l + '패 ' + rec.d + '무';
      $('me-meta').textContent = my.name + ' · ' + my.latin + ' · 약 ' + Store.playerRating();
      $('me-record').textContent = '통산 ' + games + '전 ' + st.wins + '승 ' + st.losses + '패 ' + st.draws + '무';
      $('cap-opp').setAttribute('aria-label', 'AI가 잡은 병정');
      $('cap-me').setAttribute('aria-label', '내가 잡은 병정');
    }
    const diff = s.material(s.humanColor) - s.material(s.aiColor);
    for (const [boxId, advId, color, adv] of [['cap-me', 'adv-me', s.humanColor, diff], ['cap-opp', 'adv-opp', s.aiColor, -diff]]) {
      const box = $(boxId);
      box.textContent = '';
      for (const pc of s.capturedBy(color)) box.appendChild(pieceCanvas(pc & 7, pc >> 3, 20));
      $(advId).textContent = adv > 0 ? '+' + adv : '';
    }
  },

  /** 기보 목록을 갱신한다 */
  renderMoves() {
    const s = this.session, box = $('moves');
    box.textContent = '';
    if (!s || !s.records.length) { box.appendChild(el('span', { class: 'empty', text: '첫 수를 기다리는 중' })); return; }
    const cur = this.phase === 'review' ? this.reviewPly - 1 : s.records.length - 1;
    let curEl = null;
    s.records.forEach((r, i) => {
      if (r.color === 0 || i === 0) box.appendChild(el('span', { class: 'mv-num', text: (Math.floor(i / 2) + 1) + '.' + (r.color === 1 && i === 0 ? '..' : '') }));
      const m = el('span', { class: 'mv' + (i === cur ? ' cur' : ''), 'data-ply': i, text: r.san });
      if (i === cur) curEl = m;
      box.appendChild(m);
    });
    requestAnimationFrame(() => {
      if (!curEl) return;
      if ($('game-layout').classList.contains('wide')) {
        const top = curEl.offsetTop - box.offsetTop;
        if (top < box.scrollTop || top > box.scrollTop + box.clientHeight - 24) box.scrollTop = top - box.clientHeight / 2;
      } else {
        const left = curEl.offsetLeft - box.offsetLeft;
        box.scrollLeft = left - box.clientWidth + curEl.offsetWidth + 40;
      }
    });
  },

  /** 시계 표시를 갱신한다 */
  updateClocks() {
    const s = this.session;
    if (!s) return;
    const now = performance.now();
    for (const [id, color] of [['clock-me', s.humanColor], ['clock-opp', s.aiColor]]) {
      const c = $(id);
      const left = s.timeLeft(color, now);
      const txt = fmtClock(left);
      if (c.textContent !== txt) c.textContent = txt;
      c.classList.toggle('active', s.running === color);
      c.classList.toggle('low', left < 60000);
      c.classList.toggle('paused', this.paused && !s.result);
      c.setAttribute('aria-label', (s.pvp ? this.pvpName(color) + ' 시계 ' : color === s.humanColor ? '내 시계 ' : 'AI 시계 ') + txt);
    }
  },

  /** 차례 표시를 갱신한다 (혼자 하기: AI '생각 중'과 '내 차례', 둘이 하기: 둘 차례인 쪽 이름표에 '차례') */
  updateStatus() {
    const s = this.session;
    const st = $('opp-status');
    if (!s) return;
    const live = !this.paused && !s.result;
    if (s.pvp) {
      const waiting = live && this.phase === 'human';
      st.className = 'me-status';
      st.textContent = waiting && s.turn === s.aiColor ? '차례' : '';
      $('me-status').textContent = waiting && s.turn === s.humanColor ? '차례' : '';
      return;
    }
    const thinking = this.phase === 'ai' && live;
    st.textContent = thinking ? '생각 중' : '';
    st.className = thinking ? 'thinking' : '';
    $('me-status').textContent = this.phase === 'human' && live ? '내 차례' : '';
  },

  /** 무를 수 있는 수가 있는지 (혼자 하기는 내가 둔 수, 둘이 하기는 마지막 수) */
  hasUndo() {
    const s = this.session;
    return !!s && !s.result && (s.pvp ? s.records.length > 0 : s.records.some(r => r.color === s.humanColor));
  },

  /** 무르기 버튼 상태 */
  refreshUndo() {
    const btn = $('btn-undo');
    if (!btn) return;
    const allowed = Store.data.settings.undo;
    btn.hidden = !allowed;
    $('game-actions').style.gridTemplateColumns = allowed ? '' : 'repeat(2, minmax(0, 1fr))';
    btn.disabled = !this.hasUndo();
  },

  /** 0.1초마다 시계를 돌리고 시간 초과를 확인한다 */
  startTicker() {
    clearInterval(this.tickTimer);
    this.lastTickSec = -1;
    this.tickTimer = setInterval(() => this.tick(), 100);
  },

  /** 시계 한 번 갱신 */
  tick() {
    const s = this.session;
    if (!s) return;
    this.updateClocks();
    if (s.result || this.paused || s.running < 0) return;
    const color = s.running;
    if (s.timeLeft(color) <= 0) {
      if (this.aiReq) { AI.cancel(this.aiReq.id); this.aiReq = null; }
      if (this.phase === 'promo') Sheet.closeAll();
      this.gameOver(s.flag(color));
      return;
    }
    if (s.pvp || color === s.humanColor) {
      const left = s.timeLeft(color);
      if (left < 10000) {
        const sec = Math.ceil(left / 1000);
        if (sec !== this.lastTickSec) { this.lastTickSec = sec; Sfx.tick(); }
      }
    }
  },

  /** 판 가운데에 잠깐 큰 글자를 띄운다 (flip이면 마주 앉은 위쪽 자리에서 바로 보이게 돌려서) */
  banner(text, kind, flip) {
    const b = $('board-banner');
    $('banner-wrap').classList.toggle('rot', !!flip);
    b.hidden = true;
    b.className = 'board-banner' + (kind ? ' ' + kind : '');
    b.textContent = text;
    void b.offsetWidth;
    b.hidden = false;
    clearTimeout(this.bannerTimer);
    this.bannerTimer = setTimeout(() => { b.hidden = true; }, kind === 'check' ? 950 : 1150);
  },

  /** 다음 차례를 시작한다 (일시정지 중이면 표시만). 둘이 하기는 언제나 사람 차례다 */
  continueTurn() {
    const s = this.session;
    if (!s || s.result) return;
    const humanTurn = s.pvp || s.turn === s.humanColor;
    this.phase = humanTurn ? 'human' : 'ai';
    this.turnBoard();
    this.updateStatus(); this.refreshUndo();
    if (this.paused) return;
    if (humanTurn) s.startClock(s.turn);
    else this.startAiTurn();
    this.updateStatus();
  },

  /** AI 차례: 시계를 돌리고 수를 받아 둔다 */
  startAiTurn() {
    const s = this.session;
    s.startClock(s.aiColor);
    const req = AI.requestMove(s);
    this.aiReq = req;
    const P = Core.levelParams(s.level);
    const minWait = P.thinkMin + Math.random() * 500;
    const t0 = performance.now();
    const play = (uci) => {
      if (this.aiReq !== req || this.session !== s || this.paused || s.result) return;
      this.aiReq = null;
      let m = uci ? s.pos.moveFromUci(uci) : 0;
      if (!m) { const legal = s.pos.legalMoves(); m = legal[Math.floor(Math.random() * legal.length)]; }
      if (!m) return;
      s.stopClock();
      this.executeMove(m);
    };
    req.promise.then((res) => {
      const wait = Math.max(0, minWait - (performance.now() - t0));
      setTimeout(() => play(res && res.uci), wait);
    }).catch(() => setTimeout(() => play(null), 200));
  },

  /** 판을 탭했을 때: 둘 차례인 진영의 병정 고르기 → 갈 칸 고르기 */
  onTap(sq) {
    const s = this.session;
    if (!s || this.phase === 'review') return;
    if (this.phase !== 'human' || this.paused || Sheet.isOpen) {
      if (this.phase === 'ai' && !this.paused) this.hint('AI가 생각하는 중이에요');
      return;
    }
    const pc = this.board.pieces[sq];
    const mine = pc && (pc >> 3) === s.turn;
    if (this.selected >= 0) {
      if (sq === this.selected) { this.clearSelection(); return; }
      const moves = this.selMoves.filter(m => to64(Core.moveTo(m)) === sq);
      if (moves.length) {
        if (Core.movePromo(moves[0])) this.askPromotion(moves);
        else this.executeMove(moves[0]);
        return;
      }
      if (mine) { this.select(sq); return; }
      this.clearSelection();
      return;
    }
    if (mine) this.select(sq);
  },

  /** 같은 안내를 너무 자주 띄우지 않는다 (flip이면 위쪽 자리를 향해 띄운다) */
  hint(msg, flip) {
    const now = performance.now();
    if (now - this.hintAt < 1800) return;
    this.hintAt = now;
    Toast.show(msg, flip);
  },

  /** 병정을 고르고 갈 수 있는 칸을 표시한다 */
  select(sq) {
    const s = this.session;
    const moves = s.movesFrom(sq);
    this.selected = sq;
    this.selMoves = moves;
    const targets = new Map();
    for (const m of moves) {
      const to = to64(Core.moveTo(m));
      targets.set(to, { sq: to, capture: !!(Core.moveFlags(m) & Core.FLAG_CAPTURE) });
    }
    this.board.setSelection(sq, [...targets.values()]);
    Sfx.select();
    if (!moves.length) this.hint(s.pos.inCheck() ? '체크예요! 킹을 지키는 수만 둘 수 있어요' : '이 병정은 지금 움직일 수 없어요', this.facesTop(s.turn));
  },

  /** 선택을 지운다 */
  clearSelection() {
    this.selected = -1;
    this.selMoves = [];
    if (this.board) this.board.setSelection(-1, null);
  },

  /** 폰 진급 기물을 고르게 한다 */
  async askPromotion(moves) {
    const s = this.session;
    this.phase = 'promo';
    const type = await pickPromotion(s.turn, this.facesTop(s.turn));
    if (this.session !== s || s.result || this.phase !== 'promo') return;
    this.phase = 'human';
    const m = type && moves.find(x => Core.movePromo(x) === type);
    if (m) this.executeMove(m); else this.clearSelection();
  },

  /** 수를 두고 화면을 진행시킨다 (사람·AI 공통) */
  async executeMove(m) {
    const s = this.session;
    s.stopClock();
    this.clearSelection();
    this.phase = 'anim';
    this.updateStatus();
    const rec = s.applyMove(m);
    this.updateClocks();
    await this.animateRecord(rec);
    if (this.session !== s) return;
    this.afterMove(rec);
  },

  /** 수를 화면에 보여 준다 (잡기면 전투 장면, 아니면 미끄러지기) */
  async animateRecord(rec) {
    const s = this.session, b = this.board;
    const mode = Store.data.settings.battle;
    const mine = rec.color === s.humanColor;
    const castle = !!(rec.flags & Core.FLAG_CASTLE);
    if (rec.captured && mode !== 'off' && !document.hidden) {
      b.setCheck(-1);
      await Battle.play({
        board: b, to: rec.to, speed: mode === 'fast' ? 1.8 : 1,
        attacker: { type: rec.piece & 7, color: rec.color, sq: rec.from }, defender: { type: rec.captured & 7, color: rec.captured >> 3, sq: rec.capSq }
      });
      if (this.session !== s) return;
      b.setFromPosition(s.pos);
      b.lastMove = { from: rec.from, to: rec.to };
    } else {
      const moves = [{ piece: rec.piece, from: rec.from, to: rec.to }];
      if (castle) {
        const king = rec.to > rec.from;
        const rf = king ? rec.from + 3 : rec.from - 4, rt = king ? rec.from + 1 : rec.from - 1;
        moves.push({ piece: s.pos.board[to88(rt)], from: rf, to: rt });
      }
      b.setFromPosition(s.pos);
      b.lastMove = { from: rec.from, to: rec.to };
      if (rec.captured) b.ghosts = new Map([[rec.capSq, rec.captured]]);
      if (castle) Sfx.castle();
      await b.animate(moves, 230);
      b.ghosts = null;
      if (rec.captured) { b.effect('poof', rec.capSq, this.facesTop(rec.color)); Sfx.poof(); Sfx.buzz(20); }
      else if (!castle) Sfx.move(mine);
    }
    if (rec.promo) { b.effect('sparkle', rec.to, this.facesTop(rec.color)); Sfx.promote(); }
  },

  /** 수를 둔 뒤: 체크·종료 확인, 저장, 다음 차례 */
  afterMove(rec) {
    const s = this.session;
    this.board.lastMove = { from: rec.from, to: rec.to };
    this.board.setCheck(s.checkSquare());
    this.renderBars(); this.renderMoves(); this.refreshUndo();
    const end = s.evaluateEnd();
    if (end) { this.gameOver(end); return; }
    this.save();
    if (rec.check) { Sfx.check(); Sfx.buzz(25); this.banner('체크!', 'check', this.facesTop(s.turn)); }
    this.continueTurn();
  },

  /** 일시정지 (자동이면 화면이 가려졌을 때) */
  pause(auto) {
    const s = this.session;
    if (!s || s.result || Screens.current !== 'game') return;
    if (this.paused) { if (!this.pauseEntry && !Sheet.isOpen) this.openPauseSheet(); return; }
    if (this.phase === 'promo') { Sheet.closeAll(); this.phase = 'human'; }
    this.paused = true;
    s.stopClock();
    if (this.aiReq) { AI.cancel(this.aiReq.id); this.aiReq = null; }
    this.save();
    this.updateClocks(); this.updateStatus();
    if (!Sheet.isOpen) this.openPauseSheet(auto);
  },

  /** 일시정지를 풀고 다시 시작한다 */
  resume() {
    if (!this.paused) return;
    this.paused = false;
    const s = this.session;
    if (!s || s.result) return;
    if (this.phase === 'anim' || this.phase === 'intro') return;
    this.continueTurn();
  },

  /** 이어하기 시트 */
  openResumeSheet() {
    const s = this.session;
    const ply = s.records.length ? Math.ceil(s.records.length / 2) + '수째' : '첫 수 전';
    const lines = s.pvp
      ? ['둘이 하기 · ' + ply + ' · ' + SIDE_NAMES[s.turn] + '(' + this.pvpTag(s.turn) + ') 차례', '백 시계 ' + fmtClock(s.timeLeft(0)) + ' · 흑 시계 ' + fmtClock(s.timeLeft(1))]
      : [josa(levelLabel(s.level), '과', '와') + '의 대국 · ' + ply + ' · ' + (s.turn === s.humanColor ? '내 차례' : 'AI 차례'), '내 시계 ' + fmtClock(s.timeLeft(s.humanColor)) + ' · AI 시계 ' + fmtClock(s.timeLeft(s.aiColor))];
    let resumed = false;
    const entry = Sheet.open([
      el('h3', { text: '대국을 이어서 둘까요?' }),
      el('p', { class: 'muted', text: lines[0] }),
      el('p', { class: 'muted', text: lines[1] }),
      el('div', { class: 'actions' },
        el('button', { class: 'btn accent', type: 'button', onclick: () => { resumed = true; Sheet.close(entry); Sfx.start(); this.resume(); } }, pixelIcon('play'), el('span', { text: '계속하기' })),
        el('button', { class: 'btn', type: 'button', text: '메뉴로', onclick: () => { Sheet.close(entry); this.leaveToMenu(); } }))
    ], { label: '이어하기', dismiss: false, onClose: () => { if (!resumed && this.paused && Screens.current === 'game' && !Sheet.isOpen) setTimeout(() => this.openPauseSheet(), 0); } });
  },

  /** 일시정지 시트 */
  openPauseSheet(auto) {
    const s = this.session;
    if (!s || s.result || Screens.current !== 'game' || this.pauseEntry) return;
    const undoAllowed = Store.data.settings.undo && this.hasUndo();
    let action = null;
    const go = (fn) => () => { action = fn; Sheet.close(entry); };
    const entry = Sheet.open([
      el('h3', { text: auto ? '잠깐 멈췄어요' : '잠깐 멈춤' }),
      el('p', { class: 'muted', text: '두 시계 모두 멈춰 있어요.' }),
      el('div', { class: 'actions' },
        el('button', { class: 'btn accent', type: 'button', onclick: go(() => { Sfx.start(); this.resume(); }) }, pixelIcon('play'), el('span', { text: '계속하기' })),
        Store.data.settings.undo ? el('button', { class: 'btn', type: 'button', disabled: !undoAllowed, onclick: go(() => { this.paused = false; this.undo(); }) }, pixelIcon('undo'), el('span', { text: '한 수 무르기' })) : null,
        s.pvp
          ? el('button', { class: 'btn', type: 'button', onclick: go(() => this.agreeDraw()) }, pixelIcon('half'), el('span', { text: '무승부로 끝내기' }))
          : el('button', { class: 'btn', type: 'button', onclick: go(() => { this.resume(); this.offerDraw(); }) }, pixelIcon('half'), el('span', { text: '무승부 제안' })),
        el('button', { class: 'btn', type: 'button', onclick: go(() => Settings.open('game')) }, pixelIcon('gear'), el('span', { text: '설정' })),
        el('div', { class: 'actions two' },
          el('button', { class: 'btn ghost', type: 'button', onclick: go(() => this.resign(true)) }, pixelIcon('whiteflag'), el('span', { text: '기권' })),
          el('button', { class: 'btn ghost', type: 'button', onclick: go(() => this.leaveToMenu()) }, pixelIcon('home'), el('span', { text: '메뉴로' }))))
    ], { label: '일시정지', onClose: () => {
      this.pauseEntry = null;
      if (action) action();
      else if (this.paused) this.resume();
    } });
    this.pauseEntry = entry;
  },

  /** 설정 화면에서 돌아왔을 때 */
  afterSettings() {
    this.layout();
    if (this.session && this.paused && !this.session.result) this.openPauseSheet();
  },

  /** 저장하고 메뉴로 나간다 */
  leaveToMenu() {
    const s = this.session;
    if (s && !s.result) { s.stopClock(); this.save(); }
    this.discardSession();
    Screens.show('menu');
  },

  /** 한 수 무르기 (혼자 하기는 내 마지막 수까지, 둘이 하기는 마지막 한 수만 되돌림) */
  undo() {
    const s = this.session;
    if (!s || s.result || !Store.data.settings.undo) return;
    if (this.phase !== 'human' && this.phase !== 'ai') { this.hint('움직임이 끝난 뒤에 무를 수 있어요'); return; }
    let target = s.records.length - 1;
    if (!s.pvp) while (target >= 0 && s.records[target].color !== s.humanColor) target--;
    if (target < 0) { Sfx.denied(); this.hint('아직 무를 수가 없어요'); return; }
    if (this.aiReq) { AI.cancel(this.aiReq.id); this.aiReq = null; }
    s.stopClock();
    while (s.records.length > target) s.undoLast();
    s.undoCount++;
    this.clearSelection();
    this.board.setFromPosition(s.pos);
    const last = s.records[s.records.length - 1];
    this.board.lastMove = last ? { from: last.from, to: last.to } : null;
    this.board.setCheck(s.checkSquare());
    this.renderBars(); this.renderMoves(); this.updateClocks();
    this.save();
    Toast.show(s.pvp ? '한 수 물렀어요' : '한 수 물렀어요 · 무르기 ' + s.undoCount + '번');
    this.continueTurn();
  },

  /** 기권 (둘이 하기에서는 어느 쪽이 기권하는지 먼저 고른다) */
  async resign(fromPause) {
    const s = this.session;
    if (!s || s.result) return;
    const loser = s.pvp ? await this.pickResigner() : (await Sheet.confirm('기권할까요?', '이 대국은 패배로 기록돼요.', '기권하기')) ? s.humanColor : -1;
    if (this.session !== s || s.result) return;
    if (loser < 0) { if (this.paused) this.openPauseSheet(); return; }
    if (this.aiReq) { AI.cancel(this.aiReq.id); this.aiReq = null; }
    this.gameOver(s.finish(loser ^ 1, 'resign'));
  },

  /** 둘이 하기: 기권하는 진영을 고르게 한다 (취소하면 -1) */
  pickResigner() {
    const s = this.session;
    return new Promise((resolve) => {
      let done = false;
      const finish = (v) => { if (done) return; done = true; Sheet.close(entry); resolve(v); };
      const pick = (color) => el('button', { class: 'btn dark', type: 'button', onclick: () => finish(color) }, pixelIcon('whiteflag'), el('span', { text: this.pvpName(color) }));
      const entry = Sheet.open([
        el('h3', { text: '누가 기권하나요?' }),
        el('p', { class: 'muted', text: '기권한 쪽이 지고 대국이 끝나요.' }),
        el('div', { class: 'actions two' }, pick(s.p1), pick(s.p1 ^ 1)),
        el('div', { class: 'actions' }, el('button', { class: 'btn', type: 'button', text: '취소', onclick: () => finish(-1) }))
      ], { label: '기권', onClose: () => { if (!done) { done = true; resolve(-1); } } });
    });
  },

  /** 둘이 하기: 두 사람이 합의하면 무승부로 끝낸다 */
  async agreeDraw() {
    const s = this.session;
    if (!s || s.result) return;
    const ok = await Sheet.confirm('무승부로 끝낼까요?', '두 사람이 모두 좋다고 할 때 눌러 주세요.', '무승부로 끝내기');
    if (this.session !== s || s.result) return;
    if (!ok) { if (this.paused) this.openPauseSheet(); return; }
    this.gameOver(s.finish(-1, 'agreement'));
  },

  /** 무승부 제안 (AI가 불리하거나 완전히 비긴 형세면 받아들임) */
  async offerDraw() {
    const s = this.session;
    if (!s || s.result) return;
    if (this.phase !== 'human') { this.hint('내 차례에 제안할 수 있어요'); return; }
    if (s.records.length < 20) { this.hint('10수가 지난 뒤에 제안할 수 있어요'); return; }
    if (s.records.length - s.lastDrawOfferPly < 10) { this.hint('조금 더 둔 뒤에 다시 제안할 수 있어요'); return; }
    s.lastDrawOfferPly = s.records.length;
    Toast.show('AI가 무승부 제안을 생각하는 중');
    let res;
    try { res = await AI.askDraw(s); } catch (e) { res = { accept: false }; }
    if (this.session !== s || s.result) return;
    if (res.accept) this.gameOver(s.finish(-1, 'agreement'));
    else { Sfx.denied(); Toast.show('AI가 거절했어요. 끝까지 싸워 봐요!'); }
  },

  /** 대국 종료 처리 (열려 있던 물음 창 닫기·기록·소리·결과 시트) */
  gameOver(result) {
    const s = this.session;
    if (!s) return;
    this.phase = 'over';
    this.clearSelection();
    if (this.aiReq) { AI.cancel(this.aiReq.id); this.aiReq = null; }
    s.stopClock();
    this.paused = false;
    Sheet.closeAll();
    this.board.setCeremony(result.winner);
    this.updateClocks(); this.updateStatus(); this.refreshUndo();
    Store.setGame(null, s.pvp);
    let outcome, promoted = null;
    if (s.pvp) {
      outcome = result.winner === -1 ? 'draw' : 'win';
      this.lastOutcome = { result, outcome };
    } else {
      outcome = result.winner === -1 ? 'draw' : result.winner === s.humanColor ? 'win' : 'lose';
      const wasCleared = Store.level(s.level).cleared;
      const rankBefore = Store.playerRank();
      Store.recordResult(s.level, outcome, s.undoCount === 0);
      const rankAfter = Store.playerRank();
      promoted = rankAfter !== rankBefore ? rankAfter : null;
      this.lastOutcome = { result, outcome, wasCleared, promoted, rankBefore };
    }
    this.renderBars();
    let delay = 450;
    if (result.reason === 'checkmate') { this.banner('체크메이트!', '', this.facesTop(result.winner)); delay = 1250; }
    else if (result.reason === 'timeout' || result.reason === 'timeout-draw') { this.banner('시간 종료!'); delay = 1250; }
    setTimeout(() => {
      if (this.session !== s) return;
      if (promoted) Sfx.fanfare(); else if (outcome === 'win') Sfx.win(); else if (outcome === 'lose') Sfx.lose(); else Sfx.draw();
      this.openResultSheet();
    }, delay);
  },

  /** 둘이 하기 결과 시트 (이긴 쪽 · 한 판 더 · 진영 바꿔서 한 판 더) */
  openPvpResult() {
    const s = this.session;
    const { result, outcome } = this.lastOutcome;
    const again = (p1) => () => { Sheet.close(entry); this.startPvp(p1, s.seat); };
    const entry = Sheet.open([
      el('p', { class: 'result-title ' + outcome, text: outcome === 'draw' ? '무승부' : this.pvpTag(result.winner) + ' 승리!' }),
      el('p', { class: 'result-reason', text: (outcome === 'draw' ? '' : SIDE_NAMES[result.winner] + ' 승 · ') + reasonText(result, s) }),
      el('div', { class: 'actions' },
        el('button', { class: 'btn accent', type: 'button', onclick: again(s.p1) }, pixelIcon('flag'), el('span', { text: '한 판 더' })),
        el('button', { class: 'btn primary', type: 'button', onclick: again(s.p1 ^ 1) }, pixelIcon('swap'), el('span', { text: '진영 바꿔서 한 판 더' })),
        el('div', { class: 'actions two' },
          el('button', { class: 'btn ghost', type: 'button', onclick: () => { Sheet.close(entry); this.enterReview(); } }, pixelIcon('book'), el('span', { text: '기보 보기' })),
          el('button', { class: 'btn ghost', type: 'button', onclick: () => { Sheet.close(entry); this.discardSession(); Screens.show('menu'); } }, pixelIcon('home'), el('span', { text: '메뉴로' }))))
    ], { label: '대국 결과', dismiss: false });
    if (outcome === 'win') this.confetti(1);
  },

  /** 결과 시트 */
  openResultSheet() {
    const s = this.session;
    if (s.pvp) { this.openPvpResult(); return; }
    const { result, outcome, wasCleared, promoted, rankBefore } = this.lastOutcome;
    const notes = [];
    if (outcome === 'win') {
      if (s.undoCount === 0) notes.push('무르기 없이 이겨서 별 훈장을 받았어요.');
      else notes.push('무르기를 ' + s.undoCount + '번 썼어요. 무르기 없이 이기면 별 훈장을 받아요.');
      if (!wasCleared && s.level < 50) notes.push(levelLabel(s.level + 1) + ' 단계가 열렸어요.');
      if (s.level === 50) notes.push('임페라토르까지 이겼어요. 이제 당신이 이 전장의 임페라토르예요!');
    } else if (outcome === 'lose') notes.push('기보를 돌려 보면 흐름이 바뀐 수를 찾을 수 있어요.');
    else notes.push('비기면 다음 단계가 열리지 않아요. 한 번 더 도전해 봐요!');
    const title = promoted ? '승급!' : { win: '승리!', lose: '패배', draw: '무승부' }[outcome];
    const promoLine = promoted ? el('p', { class: 'result-promo', text: rankBefore.name + ' → ' + promoted.name + ' · ' + promoted.latin + ' · 추정 레이팅 약 ' + Store.playerRating() }) : null;
    const actions = el('div', { class: 'actions' });
    if (outcome === 'win' && s.level < 50) {
      actions.appendChild(el('button', { class: 'btn accent', type: 'button', onclick: () => { Sheet.close(entry); this.startNew(s.level + 1, s.humanColor); } }, pixelIcon('play'), el('span', { text: '다음 단계: ' + levelLabel(s.level + 1) })));
    }
    actions.appendChild(el('button', { class: 'btn ' + (outcome === 'win' && s.level < 50 ? 'primary' : 'accent'), type: 'button', onclick: () => { Sheet.close(entry); this.startNew(s.level, s.humanColor); } }, pixelIcon('flag'), el('span', { text: outcome === 'win' ? '같은 단계 다시' : '다시 도전' })));
    actions.appendChild(el('div', { class: 'actions two' },
      el('button', { class: 'btn ghost', type: 'button', onclick: () => { Sheet.close(entry); this.enterReview(); } }, pixelIcon('book'), el('span', { text: '기보 보기' })),
      el('button', { class: 'btn ghost', type: 'button', onclick: () => { Sheet.close(entry); this.discardSession(); Screens.show('stages'); } }, pixelIcon('home'), el('span', { text: '단계 선택' }))));
    const entry = Sheet.open([
      el('p', { class: 'result-title ' + outcome, text: title }),
      promoLine,
      el('p', { class: 'result-reason', text: reasonText(result, s) }),
      outcome === 'win' ? el('p', { class: 'result-reason', text: levelLabel(s.level) + ' 클리어!' }) : null,
      ...notes.map(n => el('p', { class: 'result-note', text: n })),
      actions
    ], { label: '대국 결과', dismiss: false });
    if (outcome === 'win') this.confetti(promoted ? 3 : 1);
  },

  /** 기보 보기에서 결과 시트로 돌아간다 */
  openResultAgain() {
    if (!this.session) { Screens.show('menu'); return; }
    this.reviewTo(this.session.records.length);
    this.board.setCeremony(this.lastOutcome ? this.lastOutcome.result.winner : null);
    this.openResultSheet();
  },

  /** 기보 보기 모드 */
  enterReview() {
    this.phase = 'review';
    this.board.setCeremony(null);
    $('game-actions').hidden = true;
    $('review-actions').hidden = false;
    this.layout();
    this.reviewTo(this.session.records.length);
  },

  /** 기보의 특정 수(0=시작)로 판을 맞춘다 */
  reviewTo(ply) {
    const s = this.session;
    if (!s) return;
    ply = Math.max(0, Math.min(s.records.length, ply));
    this.reviewPly = ply;
    const pos = Core.Position.fromFEN(s.startFen);
    for (let i = 0; i < ply; i++) pos.make(pos.moveFromUci(s.records[i].uci));
    this.board.setFromPosition(pos);
    const rec = s.records[ply - 1];
    this.board.lastMove = rec ? { from: rec.from, to: rec.to } : null;
    this.board.setCheck(pos.inCheck() ? to64(pos.kingSq[pos.side]) : -1);
    this.renderMoves();
    $('rv-first').disabled = $('rv-prev').disabled = ply === 0;
    $('rv-next').disabled = $('rv-last').disabled = ply === s.records.length;
  },

  /** 승리 축하 꽃가루 (판 위; 승급이면 몇 배로) */
  confetti(mult) {
    const m = mult || 1;
    const host = $('board-inner');
    const size = host.clientWidth;
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    const cv = el('canvas', { class: 'battle-canvas', 'aria-hidden': 'true' });
    cv.width = Math.round(size * dpr); cv.height = Math.round(size * dpr);
    cv.style.width = cv.style.height = size + 'px';
    cv.style.pointerEvents = 'none';
    host.appendChild(cv);
    const ctx = cv.getContext('2d');
    const colors = ['#D96629', '#FFFFFF', '#D96629', '#F3B48F', '#0093A5', '#FFFFFF'];
    const parts = Array.from({ length: 70 * m }, (_, i) => ({ x: Math.random() * size, y: -Math.random() * size * (0.6 + 0.5 * (m - 1)), vy: 0.05 + Math.random() * 0.09, vx: (Math.random() - 0.5) * 0.04, r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.01, s: 4 + Math.random() * 5, c: colors[i % colors.length] }));
    const t0 = performance.now();
    let last = t0;
    const step = (now) => {
      const dt = Math.min(40, now - last); last = now;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, size, size);
      for (const p of parts) {
        p.x += p.vx * dt; p.y += p.vy * dt * size / 300; p.r += p.vr * dt;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
        ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 3, p.s, p.s * 0.66);
        ctx.strokeStyle = '#2B2420'; ctx.lineWidth = 1; ctx.strokeRect(-p.s / 2, -p.s / 3, p.s, p.s * 0.66);
        ctx.restore();
      }
      if (now - t0 < 3200 + 1200 * (m - 1)) requestAnimationFrame(step); else cv.remove();
    };
    requestAnimationFrame(step);
  }
};

/** 문단 요소 */
function lp(text) { return el('p', { text }); }
/** 목록 요소 */
function lul(items) { return el('ul', {}, items.map(t => el('li', { text: t }))); }
/** 두 칸 표 요소 */
function ltable(rows) {
  return el('div', { style: 'overflow-x:auto' }, el('table', { class: 'notation-table' }, el('tbody', {}, rows.map(([a, b]) => el('tr', {}, el('td', { text: a }), el('td', { text: b }))))));
}

/** 배우기 화면 (장 목록 · 장 보기 · 연습판) */
const Learn = {
  board: null,
  wrap: null,
  chapter: -1,
  demoIdx: 0,
  demo: null,
  pos: null,
  selected: -1,
  selMoves: [],
  locked: false,
  busy: false,

  /** 뒤로 가기와 연습판을 준비한다 */
  init() {
    $('learn-back').prepend(pixelIcon('back'));
    $('learn-back').addEventListener('click', () => { Sfx.button(); if (this.chapter >= 0) this.showList(); else Screens.show('menu'); });
    const canvas = el('canvas', { class: 'board', 'aria-label': '연습용 체스판' });
    this.inner = el('div', { class: 'board-inner' }, canvas);
    this.wrap = el('div', { class: 'board-wrap' }, this.inner);
    const s = Store.data.settings;
    this.board = new BoardView(canvas, { hints: true, coords: s.coords, letters: s.letters });
    this.board.onTap = (sq) => this.onTap(sq);
    window.addEventListener('resize', () => { if (Screens.current === 'learn' && this.chapter >= 0) this.sizeBoard(); });
  },

  /** 배우기 화면을 연다 */
  open() {
    Screens.show('learn');
    this.showList();
  },

  /** 장 목록을 보여 준다 */
  showList() {
    this.chapter = -1;
    $('learn-title').textContent = '배우기';
    $('learn-count').hidden = true;
    const body = $('learn-content');
    body.textContent = '';
    body.appendChild(el('p', { class: 'muted', text: '체스 규칙을 15장으로 정리했어요. 연습판이 있는 장에서는 직접 눌러 보며 익힐 수 있어요.' }));
    const list = el('div', { class: 'chapter-list' });
    CHAPTERS.forEach((c, i) => {
      list.appendChild(el('button', { class: 'chapter-card', type: 'button', onclick: () => { Sfx.button(); this.openChapter(i); } },
        el('span', { class: 'no', text: String(i + 1) }),
        el('span', { class: 'body' }, el('span', { class: 't', text: c.title }), el('br'), el('span', { class: 'd', text: c.desc + (c.demos ? ' · 연습판' : '') }))));
    });
    body.appendChild(list);
    $('learn-body').scrollTop = 0;
  },

  /** 한 장을 연다 */
  openChapter(i) {
    this.chapter = i;
    this.demoIdx = 0;
    const c = CHAPTERS[i];
    $('learn-title').textContent = '배우기';
    $('learn-count').textContent = (i + 1) + ' / ' + CHAPTERS.length;
    $('learn-count').hidden = false;
    const body = $('learn-content');
    body.textContent = '';
    const art = el('article', { class: 'chapter' }, el('h3', { text: (i + 1) + '. ' + c.title }), c.body());
    if (c.demos) {
      const demo = el('div', { class: 'demo', id: 'learn-demo' },
        this.wrap,
        el('p', { class: 'demo-hint', id: 'learn-hint', 'aria-live': 'polite' }),
        el('div', { class: 'demo-actions', id: 'learn-actions' }));
      art.appendChild(demo);
    }
    body.appendChild(art);
    body.appendChild(el('div', { class: 'chapter-nav' },
      el('button', { class: 'btn ghost', type: 'button', disabled: i === 0, onclick: () => { Sfx.button(); this.openChapter(i - 1); } }, pixelIcon('prev'), el('span', { text: '이전 장' })),
      el('button', { class: 'btn primary', type: 'button', onclick: () => { Sfx.button(); if (i < CHAPTERS.length - 1) this.openChapter(i + 1); else this.showList(); } },
        el('span', { text: i < CHAPTERS.length - 1 ? '다음 장' : '목록으로' }), pixelIcon('next'))));
    $('learn-body').scrollTop = 0;
    if (c.demos) { this.sizeBoard(); this.loadDemo(0); }
  },

  /** 연습판 크기를 화면에 맞춘다 */
  sizeBoard() {
    const avail = Math.min($('learn-body').clientWidth - 32 - 22 - 28, 360);
    const size = Math.max(200, Math.floor(avail / 8) * 8);
    this.wrap.style.setProperty('--board', size + 'px');
    this.board.resize(size);
  },

  /** 연습 국면을 불러온다 */
  loadDemo(idx) {
    const c = CHAPTERS[this.chapter];
    this.demoIdx = idx;
    this.demo = c.demos[idx];
    this.pos = Core.Position.fromFEN(this.demo.fen, { relaxed: true });
    this.selected = -1; this.selMoves = [];
    this.locked = !!this.demo.readonly;
    this.busy = false;
    this.scriptDone = false;
    this.board.marks = new Map((this.demo.marks || []).map(n => [to64(Core.parseSquare(n)), 'rgba(217, 102, 41, 0.42)']));
    this.board.lastMove = null;
    this.board.setSelection(-1, null);
    this.board.setFromPosition(this.pos);
    this.board.setCheck(this.pos.inCheck() ? to64(this.pos.kingSq[this.pos.side]) : -1);
    this.setHint(this.demo.hint);
    this.renderActions();
  },

  /** 연습판 아래 버튼(처음으로·흑 차례·다음 연습) */
  renderActions() {
    const box = $('learn-actions');
    if (!box) return;
    box.textContent = '';
    const c = CHAPTERS[this.chapter];
    if (this.demo.script && !this.scriptDone) {
      box.appendChild(el('button', { class: 'btn small accent', type: 'button', onclick: () => this.runScript() }, pixelIcon('play'), el('span', { text: this.demo.script.label })));
    }
    if (!this.demo.readonly) box.appendChild(el('button', { class: 'btn small ghost', type: 'button', onclick: () => { Sfx.button(); this.loadDemo(this.demoIdx); } }, pixelIcon('undo'), el('span', { text: '처음으로' })));
    if (c.demos.length > 1) {
      const next = (this.demoIdx + 1) % c.demos.length;
      box.appendChild(el('button', { class: 'btn small primary', type: 'button', onclick: () => { Sfx.button(); this.loadDemo(next); } },
        el('span', { text: next === 0 ? '첫 연습 다시' : '다음 연습 (' + (next + 1) + '/' + c.demos.length + ')' }), pixelIcon('next')));
    }
  },

  /** 안내 문구 */
  setHint(text, ok) {
    const h = $('learn-hint');
    if (!h) return;
    h.textContent = text || '';
    h.classList.toggle('ok', !!ok);
  },

  /** 정해진 상대 수(흑)를 둔다 */
  async runScript() {
    if (this.busy || this.scriptDone) return;
    const sc = this.demo.script;
    const m = this.pos.moveFromUci(sc.uci);
    if (!m) return;
    Sfx.button();
    this.scriptDone = true;
    await this.playMove(m);
    this.setHint(sc.hint);
    this.renderActions();
  },

  /** 연습판 탭 */
  onTap(sq) {
    if (this.locked || this.busy || !this.pos) return;
    const pos = this.pos;
    if (pos.side !== Core.WHITE) {
      if (this.demo.script && !this.scriptDone) this.setHint('먼저 아래 "' + this.demo.script.label + '" 버튼을 눌러 보세요.');
      return;
    }
    const pc = this.board.pieces[sq];
    const mine = pc && (pc >> 3) === Core.WHITE;
    if (this.selected >= 0) {
      if (sq === this.selected) { this.selected = -1; this.board.setSelection(-1, null); return; }
      const moves = this.selMoves.filter(m => to64(Core.moveTo(m)) === sq);
      if (moves.length) { this.userMove(moves); return; }
      if (!mine) { this.selected = -1; this.board.setSelection(-1, null); return; }
    }
    if (!mine) return;
    const moves = pos.legalMoves().filter(m => to64(Core.moveFrom(m)) === sq);
    this.selected = sq; this.selMoves = moves;
    const t = new Map();
    for (const m of moves) { const to = to64(Core.moveTo(m)); t.set(to, { sq: to, capture: !!(Core.moveFlags(m) & Core.FLAG_CAPTURE) }); }
    this.board.setSelection(sq, [...t.values()]);
    Sfx.select();
    if (!moves.length) this.setHint(pos.inCheck() ? '체크 중에는 체크를 푸는 수만 둘 수 있어요.' : '이 병정은 지금 움직일 수 없어요.');
  },

  /** 사용자가 고른 수를 둔다 (진급이면 고르게 한다) */
  async userMove(moves) {
    let m = moves[0];
    if (Core.movePromo(m)) {
      this.busy = true;
      const type = await pickPromotion(Core.WHITE);
      this.busy = false;
      if (!type) { this.selected = -1; this.board.setSelection(-1, null); return; }
      m = moves.find(x => Core.movePromo(x) === type) || m;
    }
    const flags = Core.moveFlags(m), promo = Core.movePromo(m);
    await this.playMove(m);
    this.checkGoal(flags, promo);
  },

  /** 수를 두고 판에 보여 준다 */
  async playMove(m) {
    const pos = this.pos, b = this.board;
    this.busy = true;
    this.selected = -1; this.selMoves = [];
    b.setSelection(-1, null);
    const from = to64(Core.moveFrom(m)), to = to64(Core.moveTo(m)), flags = Core.moveFlags(m);
    const piece = pos.board[Core.moveFrom(m)];
    const capSq = (flags & Core.FLAG_EP) ? (pos.side === Core.WHITE ? to - 8 : to + 8) : to;
    const captured = (flags & Core.FLAG_CAPTURE) ? pos.board[to88(capSq)] : 0;
    pos.make(m);
    const anims = [{ piece, from, to }];
    if (flags & Core.FLAG_CASTLE) {
      const king = to > from;
      const rf = king ? from + 3 : from - 4, rt = king ? from + 1 : from - 1;
      anims.push({ piece: pos.board[to88(rt)], from: rf, to: rt });
    }
    b.setFromPosition(pos);
    b.lastMove = { from, to };
    if (captured) b.ghosts = new Map([[capSq, captured]]);
    if (flags & Core.FLAG_CASTLE) Sfx.castle();
    await b.animate(anims, 230);
    b.ghosts = null;
    if (captured) { b.effect('poof', capSq); Sfx.poof(); } else if (!(flags & Core.FLAG_CASTLE)) Sfx.move(true);
    if (Core.movePromo(m)) { b.effect('sparkle', to); Sfx.promote(); }
    b.setCheck(pos.inCheck() ? to64(pos.kingSq[pos.side]) : -1);
    this.busy = false;
  },

  /** 연습 목표를 확인하고, 자유 연습이면 다시 백 차례로 돌린다 */
  checkGoal(flags, promo) {
    const g = this.demo.goal;
    const pos = this.pos;
    if (g) {
      let ok = false, fail = false;
      if (g.type === 'any') ok = true;
      else if (g.type === 'promote') ok = !!promo;
      else if (g.type === 'ep') ok = !!(flags & Core.FLAG_EP);
      else if (g.type === 'castle') ok = !!(flags & Core.FLAG_CASTLE);
      else if (g.type === 'mate') { ok = pos.inCheck() && !pos.hasLegalMove(); fail = !ok; }
      if (ok) { this.locked = true; this.setHint(g.success, true); Sfx.sparkle(); this.renderActions(); return; }
      if (fail || g.lockOnMiss) { this.locked = true; this.setHint(g.fail || g.miss); Sfx.denied(); this.renderActions(); return; }
      if (g.miss) this.setHint(g.miss);
    }
    if (pos.side === Core.BLACK) {
      const parts = pos.toFEN().split(' ');
      parts[1] = 'w'; parts[3] = '-';
      this.pos = Core.Position.fromFEN(parts.join(' '), { relaxed: true });
      this.board.setCheck(this.pos.inCheck() ? to64(this.pos.kingSq[0]) : -1);
    }
    if (!g) this.setHint('좋아요! 다른 병정도 눌러 보세요.');
  }
};

/** 앱을 시작한다 (저장본 읽기 → 화면 연결 → 글꼴 → 계정 저장소) */
function start(hot) {
  Store.load();
  AI.init();
  Menu.init(); Stages.init(); Settings.init(); Play.init(); Learn.init();
  applySettings();
  document.addEventListener('pointerdown', () => Sfx.unlock(), { passive: true });
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    const top = Sheet.stack[Sheet.stack.length - 1];
    if (top) { if (top.opts.dismiss !== false) Sheet.close(top, 'dismiss'); return; }
    if (Screens.current === 'stages') Screens.show('menu');
    else if (Screens.current === 'settings') Settings.close();
    else if (Screens.current === 'learn') $('learn-back').click();
    else if (Screens.current === 'game' && Play.session && !Play.session.result) Play.pause(false);
  });
  Screens.show('menu');
  const fontsReady = document.fonts && document.fonts.load
    ? Promise.all([document.fonts.load('700 16px Galmuri11'), document.fonts.load('400 16px Galmuri11')]).catch(() => null)
    : Promise.resolve();
  fontsReady.then(() => {
    Art.spriteCache.clear();
    if (Play.board.size) { Play.board.buildCoords(); Play.board.draw(); }
    if (Learn.board.size) { Learn.board.buildCoords(); Learn.board.draw(); }
  });
  Store.initCloud(() => {
    applySettings();
    if (Screens.current === 'menu') Menu.refresh();
    else if (Screens.current === 'stages') Stages.render();
  });
  Visits.start();
  if (hot && hot.screen === 'game' && Store.saved(!!hot.pvp)) Play.resumeSaved(!!hot.pvp);
  else if (hot && hot.screen === 'learn') Learn.open();
  if (window.claude && window.claude.hot && window.claude.hot.snapshot) {
    window.claude.hot.snapshot(() => {
      const s = Play.session;
      if (s && !s.result) { s.stopClock(); Play.save(); }
      return { screen: Screens.current, pvp: !!(s && s.pvp) };
    });
  }
}

if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
else start((window.claude && window.claude.hot && window.claude.hot.data) || {});
</script>
