    spriteCache.set(key, c);
    return c;
  }

  /** 기물 종류별 서 있는 자세 (판·아바타용) */
  function standPose(type) {
    const mounted = !!MOUNTED[type];
    const pose = basePose(mounted ? 'side' : 'front');
    if (type === KING_T) Object.assign(pose, { aB: 0.95, eB: -1.55, aF: 0.42, eF: -0.1, wAng: Math.PI, hB: 0.2, hF: 0.2 });
    if (type === QUEEN_T) Object.assign(pose, { aB: 0.95, eB: -1.55, aF: 1.65, eF: -1.0, wAng: 0.55 });
    if (type === PAWN_T) Object.assign(pose, { aB: 0.72, eB: -0.9, aF: 0.95, eF: -1.4, wAng: 0, hB: 0.14, hF: 0.14 });
    if (type === KNIGHT_T) Object.assign(pose, { aB: 0.35, eB: 0.9, aF: 2.3, eF: -0.8, wAng: 1.3, lean: 0.1 });
    if (type === BISHOP_T) Object.assign(pose, { aB: 0.35, eB: 0.9, aF: 1.7, eF: -0.8, wAng: 1.1, lean: 0.1 });
    if (type === ROOK_T) Object.assign(pose, { aB: 0.6, eB: 0.5, aF: 1.35, eF: -0.6, wAng: 1.15, lean: 0.15 });
    return pose;
  }

  const WALK_A = { lean: 0.08, hB: -0.42, kB: 0.6, hF: 0.4, kF: 0.05, y: -0.005 };
  const WALK_B = { lean: 0.08, hB: 0.4, kB: 0.05, hF: -0.42, kF: 0.6, y: -0.03 };
  const STEP_A = { lean: 0.04, hB: -0.3, kB: 0.45, hF: 0.3, kF: 0.05, aB: 0.3, eB: 0.15, y: 0 };
  const STEP_B = { lean: 0.04, hB: 0.3, kB: 0.05, hF: -0.3, kF: 0.45, aB: -0.15, eB: 0.25, y: -0.02 };
  const DASH_A = { lean: 0.33, aB: 0.9, eB: 0.7, aF: 0.2, eF: 1.1, y: -0.02 };
  const DASH_B = { lean: 0.33, aB: -0.6, eB: 0.6, aF: 1.0, eF: 0.6, y: -0.07 };
  const WHEEL_TURN = 0.68;

  /**
   * 판 위를 이동하는 동안의 자세 (모두 측면). travel은 지금까지 간 거리(칸), ms는 이동 시작 후 시간.
   * 걸음은 거리에 묶여 있어 한 칸에 두어 걸음: 폰·킹은 걷고(두 자세 번갈아), 퀸은 달리고, 나이트·비숍은 말·코끼리가 뛰고, 룩은 간 거리만큼 전차 바퀴가 돈다
   */
  function movePose(type, travel, ms) {
    const beat = (perSquare, a, b) => Math.floor(travel * perSquare) % 2 ? b : a;
    const cycle = (perSquare) => (travel * perSquare) % 1;
    if (type === PAWN_T) return Object.assign({}, beat(2, WALK_A, WALK_B), { aB: 0.32, eB: 0.1, wAng: -0.3, aF: 0.55, eF: 0.55, shieldAng: 0.05 });
    if (type === KING_T) return Object.assign({}, beat(2, STEP_A, STEP_B), { aF: 0.9, eF: -0.1, wAng: 3.9 });
    if (type === QUEEN_T) return Object.assign({}, beat(2.5, DASH_A, DASH_B), { wAng: 1.25 });
    const pose = standPose(type);
    if (type === KNIGHT_T) { const g = cycle(1.1); return Object.assign(pose, { running: 1, gallop: g, bob: Math.abs(Math.sin(g * Math.PI)) * 0.05, lean: 0.25, aB: 0.4, eB: 0.6, aF: 1.1, eF: 0.15, wAng: 1.5 }); }
    if (type === BISHOP_T) { const g = cycle(0.9); return Object.assign(pose, { running: 1, gallop: g, bob: Math.abs(Math.sin(g * Math.PI)) * 0.03, lean: 0.12, aF: 1.6, eF: -0.5, wAng: 1.2 }); }
    return Object.assign(pose, { gallop: (travel / WHEEL_TURN) % 1, bob: Math.abs(Math.sin(ms / 38)) * 0.012, lean: 0.22, aF: 1.3, eF: -0.5, wAng: 1.2 });
  }

  /** 칸 크기에 맞춘 기물 키(px) — 판 위 정지 그림과 전투 장면이 같은 크기를 쓴다 */
  function pieceHeight(type, size) {
    const box = PIECE_BOX[type];
    return Math.min(size * 0.94 / box.w, size * 0.88 / box.h);
  }

  /** 판 위 정지 그림의 발 위치: 칸 가운데 기준 x 오프셋(px)과 바라보는 방향 */
  function spriteFoot(type, color, size) {
    const facing = MOUNTED[type] ? (color === 0 ? 1 : -1) : 1;
    return { x: -PIECE_BOX[type].cx * pieceHeight(type, size) * facing, facing };
  }

  /**
   * 한 칸 크기 안에 그림자와 함께 기물을 그린다 (기마 기물은 측면, 백은 오른쪽·흑은 왼쪽을 본다).
   * opts.pose가 있으면 이동 중 자세로 그린다(보병도 측면, opts.facing 방향). opts.dpr은 선 굵기 하한 보정용
   */
  function drawPieceInSquare(ctx, type, color, size, opts) {
    opts = opts || {};
    const box = PIECE_BOX[type];
    const H = pieceHeight(type, size);
    const footY = size * 0.92;
    const mounted = !!MOUNTED[type];
    const live = !!opts.pose;
    const view = opts.view || (mounted || live ? 'side' : 'front');
    const side = view === 'side';
    const facing = side ? (opts.facing || (color === 0 ? 1 : -1)) : 1;
    const jump = (opts.jump || 0) * H;
    const shrink = 1 - Math.min(0.5, jump / H);
    ctx.save();
    ctx.fillStyle = 'rgba(43,36,32,0.18)';
    ctx.beginPath(); ctx.ellipse(size / 2, footY + size * 0.01, size * (mounted ? 0.36 : 0.2) * shrink, size * 0.05 * shrink, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    const cx = live && !mounted && side ? MOVE_CX[type] : box.cx;
    const minLw = 1.25 / (H * (opts.dpr || 1));
    drawFigure(ctx, size / 2 - cx * H * facing, footY - jump, H, type, color, { view, facing, pose: live ? opts.pose : standPose(type), bold: true, minLw, expr: opts.expr, weapon: opts.weapon });
    if (opts.ground) drawGroundWeapon(ctx, type, color, size / 2 + facing * H * (mounted ? 0.1 : 0.26), footY - H * 0.03, H, facing, minLw);
    if (opts.letter) {
      const s = Math.round(size * 0.26);
      ctx.save();
      ctx.font = 'bold ' + s + 'px Galmuri11, monospace';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      const lx = size * 0.84, ly = size * 0.16;
      ctx.lineWidth = Math.max(2, size * 0.05); ctx.strokeStyle = color === 0 ? INK : '#FFFFFF';
      ctx.strokeText(' PNBRQK'[type], lx, ly);
      ctx.fillStyle = color === 0 ? '#FFFFFF' : INK;
      ctx.fillText(' PNBRQK'[type], lx, ly);
      ctx.restore();
    }
  }

  /** 땅에 내려놓은 무기 (킹·퀸은 칼, 나머지는 창): (x,y)는 손잡이 쪽 바닥 점, 날은 바라보는 쪽으로 눕는다 */
  function drawGroundWeapon(ctx, type, color, x, y, H, facing, minLw) {
    const st = styleFor(color, { bold: true, minLw });
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(H, H);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    outline = INK;
    if (type === KING_T || type === QUEEN_T) drawSword(ctx, st, { x: 0, y: 0 }, facing * (Math.PI / 2 - 0.06));
    else drawSpear(ctx, st, { x: 0, y: 0 }, facing * Math.PI / 2, 0.95);
    ctx.restore();
  }

  const CHEER_FRONT = { aB: 2.3, eB: 0.2, aF: 2.3, eF: 0.2, wAng: 0.3, shieldAng: 0.2, hB: 0.2, kB: 0, hF: 0.2, kF: 0, lean: 0, headTilt: 0 };
  const CHEER_RIDER = { aB: -2.2, eB: -0.25, aF: 2.2, eF: 0.25, wAng: 0.35, lean: -0.05 };
  const REST_SIDE = { lean: 0.03, headTilt: 0, aB: -0.25, eB: 0.5, aF: 0.6, eF: 0.4, hB: -0.15, kB: 0.1, hF: 0.15, kF: 0.05, shieldAng: 0, dressLen: 0.42, y: 0 };
  const KNEEL = { y: 0.2, lean: 0.28, headTilt: 0.42, aB: 0.55, eB: 0.3, aF: 1.0, eF: 0.35, hB: -0.4, kB: 1.17, hF: 1.45, kF: 1.45, wAng: 1.3, shieldAng: 0.3, dressLen: 0.22 };
  const SLUMP = { y: 0, lean: 0.3, headTilt: 0.45, aB: 0.5, eB: 0.2, aF: 0.9, eF: 0.3, wAng: 1.4, shieldAng: 0.2, dressLen: 0.42 };
  const REST_WEAPON = { 1: { wAng: 0.05 }, 5: { wAng: 0.55 }, 6: { wAng: 3.3 } };

  /**
   * 대국이 끝난 뒤 판 위 기물의 의식 자세. role: 'win'(뛰며 만세) · 'lose'(천천히 무릎 꿇고 무기를 내려놓음) · 'draw'(선 채로 고개 숙이고 무기를 내려놓음).
   * ms는 의식 시작 후 시간, seed(0~1)는 기물마다 다른 박자, still이면 움직임 없이 마지막 자세만
   */
  function ceremonyPose(type, color, role, ms, seed, still) {
    const mounted = !!MOUNTED[type];
    const facing = color === 0 ? 1 : -1;
    if (role === 'win') {
      const period = 950, k = ((ms + seed * period) % period) / period;
      const air = still || k >= 0.42 ? 0 : Math.sin(Math.PI * k / 0.42);
      const squash = !still && k >= 0.42 && k < 0.5 ? 0.93 : 1;
      if (mounted) {
        const pose = Object.assign(standPose(type), CHEER_RIDER, { rear: (type === ROOK_T ? 0.15 : type === BISHOP_T ? 0.35 : 0.7) * air, squash });
        if (type === ROOK_T) pose.gallop = ((ms + seed * period) / 140) % 1;
        return { pose, view: 'side', facing, expr: 'win', weapon: true, jump: 0.3 * air };
      }
      const pose = Object.assign(basePose('front'), CHEER_FRONT, { squash });
      if (air > 0) Object.assign(pose, { hB: 0.35, kB: 0.55, hF: 0.35, kF: 0.55 });
      return { pose, view: 'front', facing: 1, expr: 'win', weapon: true, jump: 0.42 * air };
    }
    const t = still ? 1 : Math.min(1, ms / 1400);
    const e = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    const laid = still || ms > 1050;
    const expr = still || ms > 600 ? 'sad' : 'idle';
    if (mounted) {
      const rider = mixPose(Object.assign({}, REST_SIDE, { aB: 0.35, eB: 0.9, aF: 2.3, eF: -0.8, wAng: 1.3 }), SLUMP, e);
      const pose = Object.assign(standPose(type), rider, { squash: 1 - (role === 'lose' ? 0.16 : 0.07) * e, hideSpear: laid ? 1 : 0 });
      return { pose, view: 'side', facing, expr, weapon: !laid, ground: laid, jump: 0 };
    }
    const from = Object.assign(basePose('side'), REST_SIDE, REST_WEAPON[type]);
    const to = Object.assign(basePose('side'), role === 'lose' ? KNEEL : SLUMP, type === QUEEN_T ? {} : { dressLen: 0.42 });
    return { pose: mixPose(from, to, e), view: 'side', facing, expr, weapon: !laid, ground: laid, jump: 0 };
  }

  /** 날아가는 창 (전투 결정타용): (x,y)는 창 가운데, ang는 0=위 기준 시계 방향 */
  function drawThrownSpear(ctx, x, y, H, ang, color) {
    const st = styleFor(color, {});
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(H, H);
    ctx.lineCap = 'round';
    drawSpear(ctx, st, { x: 0, y: 0 }, ang, 0.95);
    ctx.restore();
  }

  /** 별 모양 경로를 만든다 */
  function drawStar(ctx, cx, cy, R, r) {
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const a = -Math.PI / 2 + i * Math.PI / 5;
      const rad = i % 2 === 0 ? R : r;
      const x = cx + Math.cos(a) * rad, y = cy + Math.sin(a) * rad;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
  }

  /** 결정적 난수 */
  function seeded(seed) {
    let s = seed >>> 0;
    return () => { s = (s + 0x6D2B79F5) >>> 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }

  /** 클래식 체스판 배경(흰색·회색 칸)을 그린다 */
  function drawBoardField(ctx, sq) {
    for (let r = 0; r < 8; r++) {
      for (let f = 0; f < 8; f++) {
        ctx.fillStyle = (r + f) % 2 === 0 ? PAL.light : PAL.dark;
        ctx.fillRect(f * sq, r * sq, sq, sq);
      }
    }
  }

  /** 얼굴 클로즈업 (전투 컷인용): 큰 머리와 표정, 기물 종류를 주면 투구·왕관도 얹는다 */
  function drawFaceCloseup(ctx, x, y, R, color, expr, facing, type) {
    const st = styleFor(color, {});
    ctx.save();
    ctx.translate(x, y);
    const k = R / 0.19;
    ctx.scale(k, k);
    if (facing < 0) ctx.scale(-1, 1);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.arc(0, 0, 0.19, 0, Math.PI * 2);
    fillOut(ctx, st.fill, st.lw);
    ctx.save();
    ctx.scale(1.3, 1.3);
    drawFace(ctx, st, { x: 0, y: 0 }, expr, true, 0);
    const J = { head: { x: 0, y: 0 }, headAng: 0 };
    if (type === PAWN_T) drawHelmet(ctx, st, J, true);
    else if (type === KING_T || type === QUEEN_T) drawCrown(ctx, st, J, type);
    ctx.restore();
    ctx.restore();
  }

  return { PAL, TEAM, TYPE_SCALE, MOUNTED, drawFigure, drawFaceCloseup, drawThrownSpear, basePose, mixPose, standPose, movePose, ceremonyPose, pieceHeight, spriteFoot, pieceSprite, drawPieceInSquare, drawBoardField, drawStar, seeded, spriteCache };
})();

/** 부대 머리띠용 도트 그림 배경 (훈련소·전방 초소·평원 전투·요새 공방·왕성 결전). 작은 격자에 점을 찍고 캔버스를 확대해 보여준다 */
const Scenes = (() => {
  const C = {
    ink: '#2B2420', white: '#FFFFFF', ivory: '#FAF9F5', ivory2: '#F2F0E8', sand: '#E6E3DD', gray: '#C4C1BC', grayDeep: '#97918A',
    orange: '#D96629', orangeSoft: '#F3B48F', peach: '#F8E7D5', peach2: '#FAF2E7', teal: '#0093A5', tealSoft: '#8FD0D8', tealPale: '#CFE9EC', tealPale2: '#E6F2F3',
    night: '#2B2420', night2: '#3A322E', night3: '#4E463F', dusk: '#F3B48F'
  };
  const DOT = 3;
  const H = 18;
  const GROUND = 14;
  const EXTRA = 4;

  /** 색 문자열을 RGB로 */
  function rgb(hex) { return [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)]; }

  /** 점 격자 (색 이름 문자열을 담는다) */
  function grid(W) {
    const g = { W, H, cells: new Array(W * H).fill(C.ivory) };
    g.set = (x, y, c) => { x = Math.round(x); y = Math.round(y); if (x >= 0 && y >= 0 && x < W && y < H) g.cells[y * W + x] = c; };
    g.rect = (x, y, w, h, c) => { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) g.set(x + i, y + j, c); };
    g.hline = (x0, x1, y, c) => { for (let x = Math.min(x0, x1); x <= Math.max(x0, x1); x++) g.set(x, y, c); };
    g.vline = (x, y0, y1, c) => { for (let y = Math.min(y0, y1); y <= Math.max(y0, y1); y++) g.set(x, y, c); };
    g.tri = (xc, yBase, half, h, c) => { for (let j = 0; j < h; j++) { const w = Math.round(half * (j + 1) / h); g.hline(xc - w, xc + w, yBase - h + 1 + j, c); } };
    g.circle = (xc, yc, r, c) => { for (let y = -r; y <= r; y++) for (let x = -r; x <= r; x++) if (x * x + y * y <= r * r + r * 0.5) g.set(xc + x, yc + y, c); };
    g.dither = (x, y, w, h, c) => { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) if ((i + j) % 2 === 0) g.set(x + i, y + j, c); };
    return g;
  }

  /** 하늘 띠 (위→아래, 경계는 체크무늬로 섞음) */
  function sky(g, bands) {
    const n = bands.length, rows = GROUND;
    for (let y = 0; y < rows; y++) {
      const b = Math.min(n - 1, Math.floor(y / rows * n));
      g.hline(0, g.W - 1, y, bands[b]);
      if (b > 0 && Math.floor((y - 1) / rows * n) !== b) g.dither(0, y, g.W, 1, bands[b - 1]);
    }
  }

  /** 땅 (경계선 + 바닥 + 자갈) */
  function ground(g, rnd, top, bottom, line) {
    g.hline(0, g.W - 1, GROUND, line || C.grayDeep);
    g.rect(0, GROUND + 1, g.W, H - GROUND - 1, top);
    for (let x = 0; x < g.W; x++) if (rnd() < 0.12) g.set(x, GROUND + 1 + Math.floor(rnd() * 3), bottom);
  }

  /** 작은 깃발 (장대 + 삼각 깃발) */
  function flag(g, x, yTop, len, color, dir) {
    g.vline(x, yTop, yTop + len, C.ink);
    g.hline(x + (dir || 1), x + (dir || 1) * 3, yTop, color);
    g.hline(x + (dir || 1), x + (dir || 1) * 2, yTop + 1, color);
  }

  /** 병정 한 명 (머리 고리 + 방패), 백은 속 빈 머리, 흑은 채운 머리 */
  function soldier(g, x, y, black, shield, dir) {
    g.rect(x, y, 3, 3, C.ink);
    if (!black) g.set(x + 1, y + 1, C.white);
    g.rect(x, y + 3, 3, 2, shield);
    g.vline(x + (dir > 0 ? 3 : -1), y - 2, y + 4, C.ink);
    g.set(x + (dir > 0 ? 3 : -1), y - 3, C.grayDeep);
  }

  /** 훈련소: 새벽 하늘, 천막, 울타리, 허수아비, 모닥불 */
  function camp(g, rnd) {
    sky(g, [C.peach, C.peach2, C.ivory]);
    g.circle(Math.round(g.W * 0.1), 3, 2, C.orangeSoft); g.circle(Math.round(g.W * 0.1), 3, 1, C.orange);
    for (let x = 0; x < g.W; x += 11) { const h = 2 + Math.floor(rnd() * 2); g.tri(x + Math.floor(rnd() * 6), 13, 7, h, C.sand); }
    ground(g, rnd, C.sand, C.gray);
    const fenceEnd = Math.round(g.W * 0.4);

      const p0 = { x: A.x + fa.x, y: A.y + sq * 0.42 };
      const e0 = { x: D.x + dir * HOME * sq, y: gy };
      const distA = Math.hypot(e0.x - p0.x, e0.y - p0.y) / sq;
      const atk = attackerScript(at);
      const def = defenderScript(dt, atk);
      const realOf = buildWarp(atk);
      const speed = (opts.speed || 1) * (b.reduce ? 1.5 : 1);
      const epic = !!atk.slow;
      const s = {
        opts, b, sq, at, dt, dir, gy, D, p0, e0, distA, atk, def, realOf, speed, epic,
        tA: Math.round(Math.max(180, Math.min(epic ? 220 : 360, 120 + 60 * distA))),
        tFight: realOf[atk.T], tStep: epic ? 150 : 170, tWin: epic ? 200 : 300,
        tTurn: b.rotColor >= 0 && !b.reduce ? 180 : 0,
        target: { x: T.x + fa.x, y: T.y + sq * 0.42 },
        start: performance.now(), lastT: performance.now(), fired: new Set(), parts: [], marks: [],
        shakeAmp: 0, shakeT: -1e9, flashT: -1e9, u: 0, lastStep: -1, endX: null, resolve, skipped: false, done: false
      };
      s.total = s.tA + s.tFight + s.tStep + s.tWin;
      state = s;
      b.hidden.add(opts.attacker.sq); b.hidden.add(opts.defender.sq);
      b.fight = { draw: (ctx, now) => draw(ctx, now), shake: (now) => shakeOffset(now), skip, rot };
      Sfx.cry(at === 5 ? 1.4 : at === 3 ? 0.8 : at === 6 ? 0.85 : 1);
      b.draw();
    });
  }

  /** 탭하면 바로 마무리로 넘긴다 */
  function skip() {
    if (!state || state.skipped) return;
    state.skipped = true;
    Sfx.poof();
    state.start = performance.now() - state.total / state.speed;
    state.b.draw();
  }

  /** 장면을 정리하고 끝낸다 (immediate면 중단) */
  function finish(immediate) {
    if (!state) return;
    const s = state;
    state = null;
    s.b.fight = null;
    s.b.hidden.delete(s.opts.attacker.sq); s.b.hidden.delete(s.opts.defender.sq);
    s.b.draw();
    s.resolve(!immediate);
  }

  /** 흔들림 오프셋 (판 전체를 흔든다) */
  function shakeOffset(now) {
    const s = state;
    if (!s || s.b.reduce) return { x: 0, y: 0 };
    const k = s.shakeAmp * Math.max(0, 1 - (now - s.shakeT) / 240);
    if (k <= 0) return { x: 0, y: 0 };
    return { x: (Math.random() * 2 - 1) * k, y: (Math.random() * 2 - 1) * k };
  }

  /** 입자들을 뿌린다 (불꽃·별·먼지·연기·꽃가루), 좌표는 CSS px, 크기는 칸 기준 */
  function burst(s, x, y, kind, n) {
    const sq = s.sq;
    const pastel = ['#D96629', '#FFFFFF', '#F3B48F', '#D96629', '#0093A5', '#FFFFFF'];
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = (kind === 'smoke' ? 0.08 : kind === 'dust' ? 0.16 : kind === 'confetti' ? 0.28 : 0.5) * sq / 100 * (0.5 + Math.random());
      const p = {
        kind, x, y,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - (kind === 'confetti' ? 0.35 * sq / 100 : kind === 'dust' ? 0.08 * sq / 100 : 0),
        age: 0, life: kind === 'smoke' ? 600 : kind === 'confetti' ? 900 : kind === 'dust' ? 340 : 420,
        size: sq * (kind === 'smoke' ? 0.07 + Math.random() * 0.05 : kind === 'star' ? 0.045 + Math.random() * 0.03 : kind === 'confetti' ? 0.03 : 0.02 + Math.random() * 0.015),
        rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.02,
        color: kind === 'confetti' ? pastel[i % pastel.length] : kind === 'star' ? (i % 3 === 0 ? '#F3B48F' : '#FFFFFF') : kind === 'dust' ? '#E6E3DD' : '#FFFFFF'
      };
      if (kind === 'dust') p.vy = -Math.abs(p.vy);
      s.parts.push(p);
    }
  }

  /** 입자를 시간에 따라 움직인다 */
  function updateParticles(s, dt) {
    const g = s.sq * 0.0015 / 1000;
    for (const p of s.parts) {
      p.age += dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.kind === 'confetti' || p.kind === 'spark') p.vy += g * dt * (p.kind === 'confetti' ? 0.6 : 1.2);
      if (p.kind === 'smoke') { p.vx *= 0.98; p.vy *= 0.98; p.size *= 1.006; }
      p.rot += p.vr * dt;
    }
    s.parts = s.parts.filter(p => p.age < p.life);
  }

  /** 베기 자국을 남긴다: 'v'·'V' 세로, 'd1'·'D1' ＼, 'd2'·'D2' ／ (대문자는 결정타용 큰 자국) */
  function addMark(s, kind, x, y, now) {
    const big = kind === kind.toUpperCase();
    const ang = kind[0].toLowerCase() === 'v' ? -Math.PI / 2 : kind[1] === '1' ? Math.PI / 4 * s.dir : -Math.PI / 4 * s.dir;
    s.marks.push({ x, y, ang, len: s.sq * (big ? 1.15 : 0.8), w: s.sq * (big ? 0.11 : 0.07), t0: now, dur: big ? 420 : 260 });
  }

  /** 시각에 맞춰 효과음·입자·흔들림·자국을 터뜨린다 (장면 시간 u 기준) */
  function fireEvents(s, u, now) {
    const sq = s.sq, gy = s.gy, atk = s.atk;
    const X = (xu) => s.D.x + s.dir * xu * sq;
    const ev = (key, at, fn) => { if (u >= at && !s.fired.has(key)) { s.fired.add(key); fn(); } };
    const Hd = s.Hd, dX = s.defX !== undefined ? s.defX : X(0);
    atk.swings.forEach((sw, i) => ev('swing' + i, sw.u, () => { sw.sfx(); if (sw.stomp) { s.shakeAmp = 4; s.shakeT = now; burst(s, X(s.attX), gy, 'dust', 6); } }));
    atk.steps.forEach((st, i) => ev('step' + i, st.u, () => {
      if (st.hoof) Sfx.hoof(); else if (st.stomp) { Sfx.stomp(0.5); s.shakeAmp = 2; s.shakeT = now; } else if (st.rattle) Sfx.rattle(0.2); else Sfx.step(st.k);
      if (st.heavy) { s.shakeAmp = 2; s.shakeT = now; }
      burst(s, X(s.attX), gy, 'dust', 2);
    }));
    if (atk.slow) ev('slowmo', atk.slow[0], () => Sfx.slowmo());
    atk.hits.forEach((h, i) => ev('hit' + i, h.u, () => {
      h.sfx(); Sfx.buzz(h.kind === 'star' ? 30 : 15);
      s.shakeAmp = h.shake; s.shakeT = now;
      burst(s, dX, gy - Hd * h.y, h.kind, h.kind === 'star' ? 7 : 8);
      if (h.streak) addMark(s, h.streak, dX, gy - Hd * 0.5, now);
    }));
    ev('finish', atk.finisher.impact, () => {
      atk.finisher.sfx(); Sfx.buzz([20, 30, 40]);
      s.shakeAmp = 9; s.shakeT = now; s.flashT = now;
      burst(s, dX, gy - Hd * 0.5, 'star', 9);
      burst(s, dX, gy - Hd * 0.45, 'smoke', 7);
      burst(s, dX, gy, 'dust', 10);
      if (atk.finisher.streak) addMark(s, atk.finisher.streak, dX, gy - Hd * 0.5, now);
      s.impact = { x: dX, y: gy - Hd * 0.5, t: now };
    });
    ev('poof', atk.finisher.impact + FLY - 30, () => { Sfx.poof(); burst(s, s.flyX !== undefined ? s.flyX : dX, s.flyY !== undefined ? s.flyY : gy - Hd * 0.5, 'smoke', 8); });
  }

  /** 다가가기·공방·들어서기·승리 포즈를 시각에 맞춰 그린다 (BoardView.render가 매 프레임 부른다) */
  function draw(ctx, now) {
    const s = state;
    if (!s || s.done) return;
    const dt = Math.min(50, now - s.lastT) * s.speed;
    s.lastT = now;
    const el = (now - s.start) * s.speed;
    if (el >= s.total) { s.done = true; finish(false); return; }
    updateParticles(s, dt);
    const sq = s.sq, gy = s.gy, dir = s.dir, b = s.b;
    const at = s.at, dtp = s.dt;
    const X = (xu) => s.D.x + dir * xu * sq;
    const zoomIn = 1 + 0.15 * easeInOut(prog(el, 0, 160));
    const zoomOut = 1 + 0.15 * (1 - easeInOut(prog(el, s.total - 160, s.total)));
    const zoom = Math.min(zoomIn, zoomOut);
    const Ha = Art.pieceHeight(at, sq) * zoom, Hd = Art.pieceHeight(dtp, sq) * zoom;
    s.Hd = Hd;
    const aColor = s.opts.attacker.color, dColor = s.opts.defender.color;

    let ax, ay = gy, apose, aexpr = 'fight', aface = 1, ajy = 0, awalk = null;
    let dx = 0, dpose = null, dexpr = 'focus', dRot = 0, dY = 0, dAlpha = 1, dFlash = 0, dShow = true;
    let vig = 0, u = 0;

    if (el < s.tA) {
      const p = easeInOut(el / s.tA);
      const px = s.p0.x + (s.e0.x - s.p0.x) * p, py = s.p0.y + (s.e0.y - s.p0.y) * p;
      awalk = { x: px, y: py, travel: p * s.distA };
      ax = (px - s.D.x) / sq * dir;
      const stepIdx = Math.floor(p * s.distA * 2);
      if (stepIdx !== s.lastStep && el > 20) {
        s.lastStep = stepIdx;
        if (at === 2) Sfx.hoof(); else if (at === 3) { Sfx.stomp(0.4); s.shakeAmp = 1.5; s.shakeT = now; } else if (at === 4) { if (stepIdx === 0) Sfx.rattle(0.35); } else Sfx.step(at === 6 ? 0.9 : 0.5);
        burst(s, px, py, 'dust', 1);
      }
      if (el > 60 && !s.fired.has('glare')) { s.fired.add('glare'); Sfx.glare(); }
      dpose = P(el < 110 ? (Art.MOUNTED[dtp] ? CAV_STANCE : STANCE) : (Art.MOUNTED[dtp] ? CAV_BRACE : GUARD[kindOf(dtp)]));
      dexpr = el < 60 ? 'idle' : 'fight';
      dpose.y = (dpose.y || 0) - Math.abs(Math.sin(el / 120)) * 0.01;
    } else if (el < s.tA + s.tFight) {
      u = sceneTime(s, el - s.tA);
      s.u = u;
      const A = sample(s.atk.track, u);
      apose = A.pose; ax = A.x; aexpr = A.expr || 'fight'; aface = A.face; ajy = A.jy;
      if (apose.running > 0.4) { apose.gallop = (u / 110) % 1; apose.bob = Math.abs(Math.sin(u / 110 * Math.PI)) * 0.05; }
      const Dd = sample(s.def.track, u);
      dpose = Dd.pose; dx = Dd.x; dexpr = Dd.expr || 'focus';
      const hitFlash = s.atk.hits.find(h => u >= h.u && u < h.u + 60);
      if (hitFlash) dFlash = 0.7 * (1 - (u - hitFlash.u) / 60);
      const imp = s.atk.finisher.impact;
      if (u >= imp) {
        const tt = prog(u, imp, imp + FLY);
        dexpr = 'ko';
        dRot = dir * tt * Math.PI * 2.4;
        dx = s.def.launchX + 1.6 * tt;
        dY = -0.75 * Math.sin(Math.PI * Math.min(1, tt * 0.9)) * sq;
        dAlpha = 1 - prog(tt, 0.72, 1);
        dpose = P(Art.MOUNTED[dtp] ? CAV_HURT : HURT);
        if (u < imp + 12) { dFlash = 1; dRot = dir * 0.25; }
        if (tt >= 1) dShow = false;
        s.flyX = X(dx); s.flyY = gy + dY - Hd * 0.5;
      }
      s.defX = X(dx);
      if (s.atk.slow) vig = prog(u, s.atk.slow[0], s.atk.slow[0] + 40) * (1 - prog(u, s.atk.slow[1] - 15, s.atk.slow[1] + 40));
      if (!s.skipped) fireEvents(s, u, now);
      s.endX = ax;
    } else {
      dShow = false;
      const r2 = el - s.tA - s.tFight;
      const ex = X(s.endX !== null ? s.endX : HOME + 0.3);
      if (r2 < s.tStep) {
        const p = easeInOut(r2 / s.tStep);
        const px = ex + (s.target.x - ex) * p, py = gy + (s.target.y - gy) * p;
        awalk = { x: px, y: py, travel: p * Math.hypot(s.target.x - ex, s.target.y - gy) / sq };
        ax = (px - s.D.x) / sq * dir;
        if (!s.fired.has('stepin')) { s.fired.add('stepin'); if (at === 2) Sfx.hoof(); else if (at === 3) Sfx.stomp(0.4); else if (at === 4) Sfx.rattle(0.2); else Sfx.step(0.5); }
      } else {
        const w = r2 - s.tStep;
        awalk = null;
        ax = (s.target.x - s.D.x) / sq * dir; ay = s.target.y;
        const win = P(s.atk.win);
        apose = Art.mixPose(P(Art.MOUNTED[at] ? CAV_STANCE : STANCE), win, easeOutBack(Math.min(1, w / 160)));
        aexpr = 'win';
        if (!s.fired.has('win')) { s.fired.add('win'); Sfx.flourish(at); burst(s, s.target.x, s.target.y - Ha * 0.7, 'confetti', 14); }
      }
    }
    s.attX = ax;

    if (vig > 0 && !b.reduce) {
      ctx.save();
      const g = ctx.createRadialGradient(s.D.x, gy - sq * 0.3, sq * 0.9, s.D.x, gy - sq * 0.3, sq * 3.2);
      g.addColorStop(0, 'rgba(43,36,32,0)');
      g.addColorStop(1, 'rgba(43,36,32,' + (0.45 * vig) + ')');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, b.size, b.size);
      ctx.restore();
    }

    const ptsBack = (layer) => drawParticles(ctx, s, layer);
    ctx.save();
    ctx.fillStyle = 'rgba(43,36,32,0.18)';
    const afoot = awalk ? { x: awalk.x, y: awalk.y } : { x: X(ax), y: ay };
    const aCav = !!Art.MOUNTED[at], dCav = !!Art.MOUNTED[dtp];
    ctx.beginPath(); ctx.ellipse(afoot.x, afoot.y + 1, sq * (aCav ? 0.34 : 0.2) * (1 - Math.min(0.5, ajy * 0.5)), sq * 0.05, 0, 0, Math.PI * 2); ctx.fill();
    if (dShow && dAlpha > 0.05 && u < s.atk.finisher.impact && el >= s.tTurn) { ctx.beginPath(); ctx.ellipse(X(dx), gy + 1, sq * (dCav ? 0.34 : 0.2), sq * 0.05, 0, 0, Math.PI * 2); ctx.fill(); }
    ctx.restore();
    ptsBack('back');

    if (dShow && dAlpha > 0.01 && dpose) {
      ctx.save();
      const cx = X(dx), cy = gy + dY - Hd * 0.5;
      if (el < s.tTurn) { ctx.translate(s.D.x, s.D.y); ctx.rotate(Math.PI * (1 - easeInOut(el / s.tTurn))); ctx.translate(-s.D.x, -s.D.y); }
      if (dRot) { ctx.translate(cx, cy); ctx.rotate(dRot); ctx.translate(-cx, -cy); }
      Art.drawFigure(ctx, X(dx), gy + dY, Hd, dtp, dColor, { view: 'side', facing: -dir, pose: dpose, expr: dexpr, alpha: dAlpha, flash: dFlash });
      ctx.restore();
    }

    if (awalk) {
      const face = Math.abs(s.target.x - afoot.x) > 1 && el >= s.tA + s.tFight ? (s.target.x > afoot.x ? 1 : -1) : dir;
      Art.drawFigure(ctx, awalk.x, awalk.y, Ha, at, aColor, { view: 'side', facing: face, pose: Art.movePose(at, awalk.travel, el), expr: 'fight' });
    } else {
      if (u >= 120 && u < 200 && at === 5) drawSpeedLines(ctx, X(ax) - dir * Ha * 0.3, gy - Ha * 0.55, dir, sq, u);
      if (apose.running > 0.4) drawSpeedLines(ctx, X(ax) - dir * Ha * 0.7, gy - Ha * 0.45, dir, sq, u);
      Art.drawFigure(ctx, X(ax), ay - ajy * sq, Ha, at, aColor, { view: 'side', facing: aface * dir, pose: apose, expr: aexpr });
    }

    drawMarks(ctx, s, now);
    if (s.impact) drawImpact(ctx, s, now);
    ptsBack('front');
    const flashAge = now - s.flashT;
    if (flashAge < 130 && !b.reduce) { ctx.save(); ctx.globalAlpha = 0.55 * (1 - flashAge / 130); ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, b.size, b.size); ctx.restore(); }
  }

  /** 베기 자국: 흰 띠에 잉크 테두리, 시간이 지나며 옅어진다 */
  function drawMarks(ctx, s, now) {
    s.marks = s.marks.filter(m => now - m.t0 < m.dur);
    for (const m of s.marks) {
      const k = (now - m.t0) / m.dur;
      const grow = Math.min(1, k * 4);
      ctx.save();
      ctx.globalAlpha = 1 - k * k;
      ctx.translate(m.x, m.y);
      ctx.rotate(m.ang);
      const L = m.len * grow, w = m.w * (1 - k * 0.5);
      ctx.beginPath();
      ctx.moveTo(-L / 2, 0); ctx.quadraticCurveTo(0, -w, L / 2, 0); ctx.quadraticCurveTo(0, w, -L / 2, 0); ctx.closePath();
      ctx.fillStyle = '#FFFFFF'; ctx.fill();
      ctx.lineWidth = Math.max(1, s.sq * 0.02); ctx.strokeStyle = '#2B2420'; ctx.lineJoin = 'round'; ctx.stroke();
      ctx.restore();
    }
  }

  /** 충격 지점의 방사선 */
  function drawImpact(ctx, s, now) {
    const age = now - s.impact.t;
    if (age > 220) { s.impact = null; return; }
    const sq = s.sq, k = age / 220;
    ctx.save();
    ctx.globalAlpha = 1 - k;
    ctx.strokeStyle = '#2B2420'; ctx.lineCap = 'round';
    const rnd = Art.seeded(5);
    for (let i = 0; i < 12; i++) {
      const a = i / 12 * Math.PI * 2 + rnd() * 0.3;
      const r0 = sq * (0.18 + 0.3 * k), r1 = sq * (0.42 + 0.6 * k + rnd() * 0.15);
      ctx.lineWidth = Math.max(1.5, sq * 0.035 * (1 - k));
      ctx.beginPath(); ctx.moveTo(s.impact.x + Math.cos(a) * r0, s.impact.y + Math.sin(a) * r0); ctx.lineTo(s.impact.x + Math.cos(a) * r1, s.impact.y + Math.sin(a) * r1); ctx.stroke();
    }
    ctx.restore();
  }

  /** 돌진할 때 뒤로 남는 속도선 */
  function drawSpeedLines(ctx, x, y, dir, sq, u) {
    ctx.save();
    ctx.strokeStyle = 'rgba(43,36,32,0.3)';
    ctx.lineCap = 'round';
    for (let i = 0; i < 4; i++) {
      const yy = y + (i - 1.5) * sq * 0.09 + Math.sin(u / 40 + i) * 1.5;
      const len = sq * (0.18 + ((i * 37 + Math.floor(u / 30)) % 4) * 0.05);
      ctx.lineWidth = Math.max(1.5, sq * 0.025);
      ctx.beginPath(); ctx.moveTo(x - dir * sq * 0.05, yy); ctx.lineTo(x - dir * (sq * 0.05 + len), yy); ctx.stroke();
    }
    ctx.restore();
  }

  /** 입자를 그린다 (연기·먼지는 뒤, 나머지는 앞) */
  function drawParticles(ctx, s, layer) {
    for (const p of s.parts) {
      const back = p.kind === 'smoke' || p.kind === 'dust';
      if ((layer === 'back') !== back) continue;
      const k = 1 - p.age / p.life;
      ctx.save();
      ctx.globalAlpha = Math.max(0, Math.min(1, k * 1.4));
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      if (back) {
        ctx.fillStyle = p.color;
        ctx.strokeStyle = 'rgba(43,36,32,0.5)'; ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.arc(0, 0, p.size, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      } else if (p.kind === 'star') {
        Art.drawStar(ctx, 0, 0, p.size, p.size * 0.45);
        ctx.fillStyle = p.color; ctx.fill();
        ctx.lineWidth = 1.2; ctx.strokeStyle = '#2B2420'; ctx.stroke();
      } else if (p.kind === 'spark') {
        ctx.fillStyle = p.color;
        ctx.strokeStyle = '#2B2420'; ctx.lineWidth = 1;
        ctx.fillRect(-p.size, -p.size / 3, p.size * 2, p.size * 0.66);
        ctx.strokeRect(-p.size, -p.size / 3, p.size * 2, p.size * 0.66);
      } else {
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.7);
      }
      ctx.restore();
    }
  }

  return { play, skip, get active() { return !!state; } };
})();

/** 0x88 칸 번호를 0~63 칸 번호로 바꾼다 */
function to64(sq88) { return (sq88 >> 4) * 8 + (sq88 & 7); }
/** 0~63 칸 번호를 0x88 칸 번호로 바꾼다 */
function to88(sq64) { return ((sq64 >> 3) << 4) | (sq64 & 7); }
/** 0~63 칸 이름 ('e4') */
function sq64Name(sq) { return 'abcdefgh'[sq & 7] + ((sq >> 3) + 1); }

/** 기물별 이동 시간(ms, 한 칸 기준)과 뛰어오르는 높이(칸 비율): 보병은 걷고, 나이트는 뛰어넘고, 전차는 땅에 붙어 구른다 */
const MOVE_SPEC = { 1: { dur: 300, hop: 0.03 }, 2: { dur: 340, hop: 0.42 }, 3: { dur: 340, hop: 0.06 }, 4: { dur: 300, hop: 0.02 }, 5: { dur: 280, hop: 0.05 }, 6: { dur: 320, hop: 0.02 } };

/** 체스판 캔버스 (풀밭 칸·하이라이트·기물·이동 애니메이션·터치). rotColor에 진영을 넣으면 그 진영의 기물을 건너편 자리에서 바로 보이게 반 바퀴 돌려 그린다 */
class BoardView {
  /** 캔버스와 옵션으로 체스판을 만든다 */
  constructor(canvas, opts) {
    opts = opts || {};
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.size = 0; this.sq = 0; this.dpr = 1;
    this.flipped = false;
    this.coords = opts.coords !== false;
    this.hints = opts.hints !== false;
    this.letters = !!opts.letters;
    this.pieces = new Int8Array(64);
    this.selected = -1;
    this.selT = 0;
    this.targets = new Map();
    this.lastMove = null;
    this.checkSq = -1; this.checkT = 0;
    this.hidden = new Set();
    this.ghosts = null;
    this.marks = new Map();
    this.anims = [];
    this.effects = [];
    this.fight = null;
    this.ceremony = null;
    this.rotColor = -1;
    this.onTap = null;
    this.field = null; this.coordLayer = null;
    this.raf = 0;
    this.reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    canvas.addEventListener('pointerdown', (e) => this.handlePointer(e));
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());
  }

  /** 화면 크기(CSS px)에 맞춰 캔버스를 다시 만든다 */
  resize(cssSize) {
    const size = Math.max(64, Math.floor(cssSize / 8) * 8);
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    if (size === this.size && dpr === this.dpr && this.field) return;
    this.size = size; this.dpr = dpr; this.sq = size / 8;
    this.canvas.width = Math.round(size * dpr);
    this.canvas.height = Math.round(size * dpr);
    this.canvas.style.width = size + 'px';
    this.canvas.style.height = size + 'px';
    this.buildLayers();
    this.draw();
  }

  /** 풀밭 배경과 좌표 레이어를 미리 그려 둔다 */
  buildLayers() {
    const px = Math.round(this.size * this.dpr);
    this.field = document.createElement('canvas');
    this.field.width = px; this.field.height = px;
    const f = this.field.getContext('2d');
    f.scale(this.dpr, this.dpr);
    Art.drawBoardField(f, this.sq);
    this.buildCoords();
  }

  /** 좌표(a~h, 1~8)를 칸 귀퉁이에 그린다 */
  buildCoords() {
    const px = Math.round(this.size * this.dpr);
    this.coordLayer = document.createElement('canvas');
    this.coordLayer.width = px; this.coordLayer.height = px;
    if (!this.coords) return;
    const c = this.coordLayer.getContext('2d');
    c.scale(this.dpr, this.dpr);
    const sq = this.sq;
    const fs = Math.max(8, Math.round(sq * 0.2));
    c.font = '700 ' + fs + 'px Galmuri11, ui-monospace, monospace';
    for (let i = 0; i < 8; i++) {
      const fileIdx = this.flipped ? 7 - i : i;
      const rankIdx = this.flipped ? i : 7 - i;
      const lightBottom = (7 + i) % 2 === 0;
      c.fillStyle = lightBottom ? '#97918A' : '#FFFFFF';
      c.textAlign = 'right'; c.textBaseline = 'bottom';
      c.fillText('abcdefgh'[fileIdx], (i + 1) * sq - sq * 0.06, this.size - sq * 0.03);
      const lightLeft = i % 2 === 0;
      c.fillStyle = lightLeft ? '#97918A' : '#FFFFFF';
      c.textAlign = 'left'; c.textBaseline = 'top';
      c.fillText(String(rankIdx + 1), sq * 0.06, i * sq + sq * 0.05);
    }
  }

  /** 표시 옵션(좌표·힌트·글자)을 바꾼다 */
  setOptions(o) {
    let rebuild = false;
    if (o.coords !== undefined && o.coords !== this.coords) { this.coords = o.coords; rebuild = true; }
    if (o.hints !== undefined) this.hints = o.hints;
    if (o.letters !== undefined) this.letters = o.letters;
    if (o.flipped !== undefined && o.flipped !== this.flipped) { this.flipped = o.flipped; rebuild = true; }
    if (rebuild && this.size) this.buildCoords();
    this.draw();
  }

  /** 엔진 국면에서 기물 배치를 읽어 온다 */
  setFromPosition(pos) {
    for (let i = 0; i < 64; i++) this.pieces[i] = pos.board[to88(i)];
    this.draw();
  }

  /** 칸의 화면 위치(왼쪽 위, CSS px) */
  screenXY(sq) {
    const r = sq >> 3, f = sq & 7;
    const col = this.flipped ? 7 - f : f;
    const row = this.flipped ? r : 7 - r;
    return { x: col * this.sq, y: row * this.sq };
  }

  /** 칸 가운데의 화면 좌표 */
  squareCenter(sq) {
    const p = this.screenXY(sq);
    return { x: p.x + this.sq / 2, y: p.y + this.sq / 2 };
  }

  /** 터치한 칸을 찾아 콜백으로 넘긴다 */
  handlePointer(e) {
    if (this.fight) { e.preventDefault(); this.fight.skip(); return; }
    if (!this.onTap) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    const rect = this.canvas.getBoundingClientRect();
    const x = (e.clientX - rect.left) / rect.width * 8;
    const y = (e.clientY - rect.top) / rect.height * 8;
    if (x < 0 || y < 0 || x >= 8 || y >= 8) return;
    e.preventDefault();
    const col = Math.floor(x), row = Math.floor(y);
    const sq = this.flipped ? row * 8 + (7 - col) : (7 - row) * 8 + col;
    this.onTap(sq);
  }

  /** 선택한 칸과 갈 수 있는 칸을 표시한다 */
  setSelection(sq, targets) {
    this.selected = sq;
    this.selT = performance.now();
    this.targets = new Map();
    if (targets) for (const t of targets) this.targets.set(t.sq, t);
    this.draw();
  }

  /** 대국 종료 의식을 켜거나 끈다: winner 0/1이면 그 진영이 뛰며 만세, 상대는 무릎 꿇음 · -1이면 무승부(둘 다 무기 내려놓음) · null이면 끔 */
  setCeremony(winner) {
    this.ceremony = winner === null || winner === undefined ? null : { winner, t0: performance.now() };
    this.draw();
  }

  /** 체크된 킹 칸을 표시한다 (-1이면 해제) */
  setCheck(sq) {
    if (sq !== this.checkSq) this.checkT = performance.now();
    this.checkSq = sq;
    this.draw();
  }

  /**
   * 기물들을 옮긴다 (moves: [{piece, from, to}]). 종류별로 걷기·달리기·바퀴 굴리기 자세를 재생하며,
   * 가로로 움직이면 그쪽을 보고, 먼 거리는 조금 더 오래 걸린다. 움직임 줄이기 설정이면 짧게 미끄러진다
   */
  animate(moves, duration) {
    return new Promise((resolve) => {
      const t0 = performance.now();
      const group = { resolve, left: moves.length };
      for (const m of moves) {
        const type = m.piece & 7;
        const spec = MOVE_SPEC[type] || MOVE_SPEC[1];
        const p0 = this.screenXY(m.from), p1 = this.screenXY(m.to);
        const dist = Math.max(Math.abs(p1.x - p0.x), Math.abs(p1.y - p0.y)) / this.sq;
        const dur = this.reduce ? Math.min(duration, 90) : Math.round(spec.dur * Math.min(1.5, 1 + 0.08 * (dist - 1)));
        const rot = (m.piece >> 3) === this.rotColor;
        const heading = p1.x > p0.x + 1 ? 1 : p1.x < p0.x - 1 ? -1 : 0;
        const facing = heading ? (rot ? -heading : heading) : ((m.piece >> 3) === 0 ? 1 : -1);
        this.anims.push({ piece: m.piece, from: m.from, to: m.to, t0, dur, dist, hop: this.reduce ? 0 : spec.hop, facing, rot, walk: !this.reduce, group, land: m.land !== false });
      }
      if (!moves.length) resolve();
      this.draw();
    });
  }

  /** 칸 위에 짧은 효과를 띄운다 (poof·sparkle·land; rot이면 건너편 자리에서 바로 보이게 돌려서) */
  effect(kind, sq, rot) {
    this.effects.push({ kind, sq, rot: !!rot, t0: performance.now(), dur: kind === 'sparkle' ? 800 : kind === 'poof' ? 520 : 260, seed: Math.random() * 1000 });
    this.draw();
  }

  /** 정지 그림 한 장을 칸 왼쪽 위(x, y)에 찍는다 (돌려 그리는 진영은 뒤집어서; lift는 그 기물이 보는 위쪽으로 띄우는 높이) */
  stamp(ctx, pc, x, y, lift) {
    const img = Art.pieceSprite(pc & 7, pc >> 3, this.sq, this.dpr, { letter: this.letters });
    if ((pc >> 3) !== this.rotColor) { ctx.drawImage(img, x, y - lift, this.sq, this.sq); return; }
    ctx.save();
    ctx.translate(x + this.sq, y + this.sq);
    ctx.scale(-1, -1);
    ctx.drawImage(img, 0, -lift, this.sq, this.sq);
    ctx.restore();
  }

  /** 그리기 원점을 칸 왼쪽 위(x, y)로 옮긴다 (돌려 그리는 진영이면 칸 가운데를 축으로 반 바퀴 돌린 자리로) */
  enterSquare(ctx, pc, x, y) {
    ctx.translate(x, y);
    if ((pc >> 3) === this.rotColor) { ctx.translate(this.sq, this.sq); ctx.scale(-1, -1); }
  }

  /** 다음 프레임에 다시 그린다 */
  draw() {
    if (this.raf) return;
    this.raf = requestAnimationFrame((t) => { this.raf = 0; this.render(t); });
  }

  /** 한 프레임을 그린다 */
  render(now) {
    if (!this.size || !this.field) return;
    now = now || performance.now();
    const ctx = this.ctx, sq = this.sq;
    let busy = false;
    const sh = this.fight ? this.fight.shake(now) : { x: 0, y: 0 };
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
    ctx.setTransform(1, 0, 0, 1, Math.round(sh.x * this.dpr), Math.round(sh.y * this.dpr));
    ctx.drawImage(this.field, 0, 0);
    ctx.setTransform(this.dpr, 0, 0, this.dpr, sh.x * this.dpr, sh.y * this.dpr);

    if (this.lastMove) {
      ctx.fillStyle = 'rgba(243, 180, 143, 0.8)';
      for (const s of [this.lastMove.from, this.lastMove.to]) { const p = this.screenXY(s); ctx.fillRect(p.x, p.y, sq, sq); }
    }
    for (const [s, color] of this.marks) { const p = this.screenXY(s); ctx.fillStyle = color; ctx.fillRect(p.x, p.y, sq, sq); }
    if (this.checkSq >= 0) {
      const c = this.squareCenter(this.checkSq);
      const age = now - this.checkT;
      const pulse = age < 1400 && !this.reduce ? 0.75 + 0.25 * Math.sin(age / 90) : 1;
      if (age < 1400) busy = true;
      const g = ctx.createRadialGradient(c.x, c.y, sq * 0.05, c.x, c.y, sq * 0.62);
      g.addColorStop(0, 'rgba(217, 102, 41, ' + (0.95 * pulse) + ')');
      g.addColorStop(0.55, 'rgba(217, 102, 41, ' + (0.6 * pulse) + ')');
      g.addColorStop(1, 'rgba(217, 102, 41, 0)');
      ctx.fillStyle = g;
      const p = this.screenXY(this.checkSq);
      ctx.fillRect(p.x, p.y, sq, sq);
    }
    if (this.selected >= 0) {
      const p = this.screenXY(this.selected);
      ctx.fillStyle = 'rgba(143, 208, 216, 0.92)';
      ctx.fillRect(p.x, p.y, sq, sq);
      ctx.lineWidth = Math.max(2, sq * 0.06);
      ctx.strokeStyle = '#0093A5';
      const w = ctx.lineWidth;
      ctx.strokeRect(p.x + w / 2, p.y + w / 2, sq - w, sq - w);
    }
    ctx.drawImage(this.coordLayer, 0, 0, this.size, this.size);
    if (this.hints && this.targets.size) {
      for (const [s, t] of this.targets) {
        const c = this.squareCenter(s);
        if (t.capture) {
          ctx.lineWidth = sq * 0.085;
          ctx.strokeStyle = '#0093A5';
          ctx.beginPath(); ctx.arc(c.x, c.y, sq * 0.43, 0, Math.PI * 2); ctx.stroke();
          ctx.lineWidth = Math.max(1, sq * 0.025);
          ctx.strokeStyle = 'rgba(255,255,255,0.9)';
          ctx.beginPath(); ctx.arc(c.x, c.y, sq * 0.47, 0, Math.PI * 2); ctx.stroke();
        } else {
          ctx.fillStyle = '#0093A5';
          ctx.beginPath(); ctx.arc(c.x, c.y, sq * 0.14, 0, Math.PI * 2); ctx.fill();
          ctx.lineWidth = Math.max(1, sq * 0.03); ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.stroke();
        }
      }
    }

    const animTo = new Set();
    for (const a of this.anims) animTo.add(a.to);
    for (let i = 0; i < 64; i++) {
      const row = i >> 3, col = i & 7;
      const s = this.flipped ? row * 8 + (7 - col) : (7 - row) * 8 + col;
      const pc = this.pieces[s];
      if (!pc || this.hidden.has(s) || animTo.has(s)) continue;
      const p = this.screenXY(s);
      let lift = 0;
      if (s === this.selected && !this.reduce) {
        const t = (now - this.selT) / 1000;
        lift = Math.abs(Math.sin(t * 5.5)) * sq * 0.07;
        busy = true;
      }
      if (this.ceremony) {
        const cer = this.ceremony;
        const role = cer.winner === -1 ? 'draw' : (pc >> 3) === cer.winner ? 'win' : 'lose';
        const c = Art.ceremonyPose(pc & 7, pc >> 3, role, now - cer.t0, ((s * 7919 + 13) % 97) / 97, this.reduce);
        ctx.save();
        this.enterSquare(ctx, pc, p.x, p.y);
        Art.drawPieceInSquare(ctx, pc & 7, pc >> 3, sq, { letter: this.letters, pose: c.pose, view: c.view, facing: c.facing, expr: c.expr, weapon: c.weapon, jump: c.jump, ground: c.ground, dpr: this.dpr });
        ctx.restore();
        if (!this.reduce && this.canvas.offsetParent !== null) busy = true;
        continue;
      }
      this.stamp(ctx, pc, p.x, p.y, lift);
    }

    if (this.ghosts) {
      for (const [s, pc] of this.ghosts) {
        const p = this.screenXY(s);
        this.stamp(ctx, pc, p.x, p.y, 0);
      }
    }
    if (this.fight) {
      ctx.save();
      if (this.fight.rot) { ctx.translate(this.size, this.size); ctx.scale(-1, -1); }
      this.fight.draw(ctx, now);
      ctx.restore();
      busy = true;
    }
    const done = [];
    for (const a of this.anims) {
      let t = (now - a.t0) / a.dur;
      if (t >= 1) { t = 1; done.push(a); } else busy = true;
      const e = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
      const p0 = this.screenXY(a.from), p1 = this.screenXY(a.to);
      const hop = Math.sin(Math.PI * t) * sq * a.hop;
      const x = p0.x + (p1.x - p0.x) * e, y = p0.y + (p1.y - p0.y) * e + (a.rot ? hop : -hop);
      if (a.walk && t < 1) {
        ctx.save();
        this.enterSquare(ctx, a.piece, x, y);
        Art.drawPieceInSquare(ctx, a.piece & 7, a.piece >> 3, sq, { letter: this.letters, pose: Art.movePose(a.piece & 7, e * a.dist, now - a.t0), facing: a.facing, dpr: this.dpr });
        ctx.restore();
      } else {
        this.stamp(ctx, a.piece, x, y, 0);
      }
    }
    if (done.length) {
      this.anims = this.anims.filter(a => !done.includes(a));
      for (const a of done) {
        if (a.land) this.effect('land', a.to, a.rot);
        a.group.left--;
        if (a.group.left <= 0) a.group.resolve();
      }
      busy = true;
    }

    this.effects = this.effects.filter(fx => now - fx.t0 < fx.dur);
    for (const fx of this.effects) { this.renderEffect(ctx, fx, now); busy = true; }
    if (busy) this.draw();
  }

  /** 효과(착지 먼지·작은 펑·진급 반짝임)를 그린다 */
  renderEffect(ctx, fx, now) {
    const sq = this.sq, c = this.squareCenter(fx.sq);
    const t = (now - fx.t0) / fx.dur;
    ctx.save();
    if (fx.rot) { ctx.translate(2 * c.x, 2 * c.y); ctx.scale(-1, -1); }
    if (fx.kind === 'land') {
      ctx.globalAlpha = 1 - t;
      ctx.fillStyle = '#FFFFFF';
      ctx.strokeStyle = 'rgba(43,36,32,0.4)'; ctx.lineWidth = 1;
      for (let i = 0; i < 4; i++) {
        const dir = i < 2 ? -1 : 1;
        const x = c.x + dir * sq * (0.16 + t * 0.2 + (i % 2) * 0.08), y = c.y + sq * (0.36 - (i % 2) * 0.05 - t * 0.05);
        ctx.beginPath(); ctx.arc(x, y, sq * (0.035 + t * 0.03), 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      }
    } else if (fx.kind === 'poof') {
      ctx.globalAlpha = Math.min(1, (1 - t) * 1.6);
      for (let i = 0; i < 7; i++) {
        const a = i / 7 * Math.PI * 2 + fx.seed;
        const r = sq * (0.12 + t * 0.32);
        ctx.fillStyle = '#FFFFFF';
        ctx.strokeStyle = 'rgba(43,36,32,0.55)'; ctx.lineWidth = Math.max(1, sq * 0.03);
        ctx.beginPath(); ctx.arc(c.x + Math.cos(a) * r, c.y + Math.sin(a) * r, sq * (0.11 - t * 0.05), 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      }
      const fs = Math.round(sq * 0.42 * (0.7 + 0.3 * Math.min(1, t * 4)));
      ctx.font = '700 ' + fs + 'px Galmuri11, monospace';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineJoin = 'round'; ctx.lineWidth = fs * 0.25; ctx.strokeStyle = '#2B2420';
      ctx.strokeText('펑!', c.x, c.y - sq * (0.3 + t * 0.15));
      ctx.fillStyle = '#FFFFFF'; ctx.fillText('펑!', c.x, c.y - sq * (0.3 + t * 0.15));
    } else if (fx.kind === 'sparkle') {
      ctx.globalAlpha = 1 - t * t;
      for (let i = 0; i < 8; i++) {
        const a = i / 8 * Math.PI * 2 + t * 2;
        const r = sq * (0.15 + t * 0.45);
        Art.drawStar(ctx, c.x + Math.cos(a) * r, c.y + Math.sin(a) * r * 0.85 - t * sq * 0.1, sq * 0.09, sq * 0.04);
        ctx.fillStyle = i % 2 ? '#FFFFFF' : '#0093A5'; ctx.fill();
        ctx.lineWidth = Math.max(1, sq * 0.02); ctx.strokeStyle = '#2B2420'; ctx.stroke();
      }
      if (t < 0.8) {
        const fs = Math.round(sq * 0.34);
        ctx.font = '700 ' + fs + 'px Galmuri11, monospace';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.lineJoin = 'round'; ctx.lineWidth = fs * 0.25; ctx.strokeStyle = '#2B2420';
        const y = c.y - sq * (0.55 + t * 0.2);
        ctx.strokeText('진급!', c.x, y);
        ctx.fillStyle = '#FFFFFF'; ctx.fillText('진급!', c.x, y);
      }
    }
    ctx.restore();
  }
}

const Core = createChessCore();
const INITIAL_MS = 15 * 60 * 1000;
const TYPE_NAMES = ['', '폰', '나이트', '비숍', '룩', '퀸', '킹'];
const SIDE_NAMES = ['백', '흑'];
/** 앉는 자리 이름이 맞으면 그대로, 아니면 '나란히 앉기'(side)를 돌려준다 */
function seatOf(name) { return Object.prototype.hasOwnProperty.call(SEATS, name) ? name : 'side'; }
const SEATS = {
  side: { name: '나란히 앉기', desc: '같은 쪽에 나란히 앉아 함께 봐요. 1P의 진영이 화면 아래쪽에 놓여요.' },
  face: { name: '마주 앉기', desc: '기기를 가운데 놓고 마주 앉아요. 아래쪽이 1P, 위쪽이 2P예요. 위쪽 병정과 이름표는 2P 쪽을 향하게 돌려 그려요.' },
  pass: { name: '주고받기', desc: '기기를 주고받으며 둬요. 수를 둘 때마다 판이 돌아서, 둘 차례인 사람의 진영이 아래쪽으로 와요.' }
};

/**
 * 한 판의 대국 상태 (국면·기보·시계·결과) — 혼자 하기(mode 'ai')와 둘이 하기(mode 'pvp')가 같은 모델을 쓴다.
 * 둘이 하기에서는 humanColor가 화면 아래쪽 자리, aiColor가 위쪽 자리의 진영이고, p1은 1P의 진영이다
 */
class GameSession {
  /** 새 대국을 만들거나 저장본에서 되살린다 */
  constructor(o) {
    this.mode = o.mode === 'pvp' ? 'pvp' : 'ai';
    this.level = o.level;
    this.seat = seatOf(o.seat);
    this.p1 = o.p1 === 1 ? 1 : 0;
    this.humanColor = this.mode === 'pvp' ? this.p1 : o.humanColor;
    this.aiColor = this.humanColor ^ 1;
    this.startFen = o.startFen || Core.START_FEN;
    this.pos = Core.Position.fromFEN(this.startFen);
    this.records = [];
    this.clock = [INITIAL_MS, INITIAL_MS];
    this.running = -1;
    this.runStart = 0;
    this.result = null;
    this.undoCount = o.undoCount || 0;
    this.lastDrawOfferPly = o.lastDrawOfferPly != null ? o.lastDrawOfferPly : -99;
    this.rep = new Map();
    this.bumpRep(this.pos.repetitionKey(), 1);
    this.id = o.id || (Date.now().toString(36) + Math.random().toString(36).slice(2, 6));
    this.createdAt = o.createdAt || Date.now();
    if (o.moves && o.moves.length) {
      for (const uci of o.moves) {
        const m = this.pos.moveFromUci(uci);
        if (!m) break;
        this.applyMove(m);
      }
    }
    if (o.clockHist && o.clockHist.length === this.records.length) {
      this.records.forEach((r, i) => { const c = o.clockHist[i]; if (Array.isArray(c) && c.length === 2) r.clockAfter = [c[0], c[1]]; });
    }
    if (o.clock) this.clock = [Math.max(0, o.clock[0]), Math.max(0, o.clock[1])];
    if (o.result) this.result = o.result;
  }

  /** 같은 국면 횟수를 더하거나 뺀다 */
  bumpRep(key, d) {
    const n = (this.rep.get(key) || 0) + d;
    if (n <= 0) this.rep.delete(key); else this.rep.set(key, n);
    return n;
  }

  /** 지금 차례인 진영 */
  get turn() { return this.pos.side; }

  /** 둘이 하기 대국인지 */
  get pvp() { return this.mode === 'pvp'; }

  /** 화면 아래쪽 자리의 진영을 정한다 (위쪽 자리는 그 반대 진영) */
  setBottom(color) {
    this.humanColor = color;
    this.aiColor = color ^ 1;
  }

  /** 진영의 남은 시간(ms) — 흐르는 시계까지 반영 */
  timeLeft(color, now) {
    let t = this.clock[color];
    if (this.running === color) t -= (now || performance.now()) - this.runStart;
    return Math.max(0, t);
  }

  /** 한 진영의 시계를 시작한다 */
  startClock(color) {
    this.stopClock();
    this.running = color;
    this.runStart = performance.now();
  }

  /** 흐르던 시계를 멈추고 쓴 시간을 깎는다 */
  stopClock() {
    if (this.running >= 0) {
      this.clock[this.running] = this.timeLeft(this.running);
      this.running = -1;
    }
  }

  /** 특정 칸(0~63)에서 출발하는 합법 수 */
  movesFrom(sq64) {
    const from88 = to88(sq64);
    return this.pos.legalMoves().filter(m => Core.moveFrom(m) === from88);
  }

  /** 수를 두고 기록을 남긴다 (합법 수만 넘긴다) */
  applyMove(m) {
    const pos = this.pos;
    const legal = pos.legalMoves();
    const from = Core.moveFrom(m), to = Core.moveTo(m), flags = Core.moveFlags(m), promo = Core.movePromo(m);
    const piece = pos.board[from];
    const capSq88 = (flags & Core.FLAG_EP) ? (pos.side === Core.WHITE ? to - 16 : to + 16) : to;
    const captured = (flags & Core.FLAG_CAPTURE) ? pos.board[capSq88] : 0;
    const san = pos.san(m, legal);
    const rec = {
      uci: Core.moveToUci(m), san, color: pos.side, piece, captured,
      from: to64(from), to: to64(to), capSq: to64(capSq88), promo, flags,
      clockAfter: [this.timeLeft(0), this.timeLeft(1)]
    };
    pos.make(m);
    rec.key = pos.repetitionKey();
    rec.repeat = this.bumpRep(rec.key, 1);
    rec.check = pos.inCheck();
    this.records.push(rec);
    return rec;
  }

  /** 마지막 한 수를 되돌린다 (시계는 그 국면이 처음 나왔을 때로) */
  undoLast() {
    const rec = this.records.pop();
    if (!rec) return null;
    this.bumpRep(rec.key, -1);
    this.pos.unmake();
    const prev = this.records[this.records.length - 1];
    this.clock = prev ? prev.clockAfter.slice() : [INITIAL_MS, INITIAL_MS];
    this.running = -1;
    return rec;
  }

  /** 대국이 끝났는지 판정한다 (끝났으면 결과 객체) */
  evaluateEnd() {
    if (this.result) return this.result;
    const pos = this.pos;
    if (!pos.hasLegalMove()) {
      if (pos.inCheck()) return this.finish(pos.side ^ 1, 'checkmate');
      return this.finish(-1, 'stalemate');
    }
    if (pos.insufficientMaterial()) return this.finish(-1, 'insufficient');
    const last = this.records[this.records.length - 1];
    if (last && last.repeat >= 3) return this.finish(-1, 'threefold');
    if (pos.halfmove >= 100) return this.finish(-1, 'fifty');
    return null;
  }

  /** 시간이 다 된 쪽을 처리한다 (상대가 메이트할 수 없으면 무승부) */
  flag(color) {
    if (this.result) return this.result;
    this.clock[color] = 0;
    this.running = -1;
    if (this.pos.cannotMate(color ^ 1)) return this.finish(-1, 'timeout-draw');
    return this.finish(color ^ 1, 'timeout');
  }

  /** 결과를 확정한다 (winner: 0 백, 1 흑, -1 무승부) */
  finish(winner, reason) {
    this.stopClock();
    this.result = { winner, reason, plies: this.records.length, at: Date.now() };
    return this.result;
  }

  /** 잡힌 기물 목록 (진영별로 잡은 상대 기물) */
  capturedBy(color) {
    const list = [];
    for (const r of this.records) if (r.color === color && r.captured) list.push(r.captured);
    return list.sort((a, b) => (b & 7) - (a & 7));
  }

  /** 기물 가치 합 (폰1·나이트3·비숍3·룩5·퀸9) */
  material(color) {
    const v = [0, 1, 3, 3, 5, 9, 0];
    let s = 0;
    for (let i = 0; i < 64; i++) { const p = this.pos.board[to88(i)]; if (p && (p >> 3) === color) s += v[p & 7]; }
    return s;
  }

  /** 지금 국면의 체크된 킹 칸(0~63) 또는 -1 */
  checkSquare() {
    return this.pos.inCheck() ? to64(this.pos.kingSq[this.pos.side]) : -1;
  }

  /** 저장용 JSON (둘이 하기는 mode·seat·p1을 함께 담는다) */
  toJSON() {
    const json = {
      v: 1, id: this.id, level: this.level, humanColor: this.humanColor, startFen: this.startFen,
      moves: this.records.map(r => r.uci), clock: [Math.round(this.timeLeft(0)), Math.round(this.timeLeft(1))],
      clockHist: this.records.map(r => [Math.round(r.clockAfter[0]), Math.round(r.clockAfter[1])]),
      undoCount: this.undoCount, lastDrawOfferPly: this.lastDrawOfferPly,
      createdAt: this.createdAt, savedAt: Date.now()
    };
    return this.pvp ? Object.assign(json, { mode: 'pvp', seat: this.seat, p1: this.p1 }) : json;
  }
}

/** 워커 안에서 돌아가는 AI 응답기 (createChessCore와 함께 문자열로 묶여 실행된다) */
function aiWorkerMain(CoreW, scope) {
  const searcher = new CoreW.Searcher(19);
  /** 시작 국면과 수순으로 국면을 다시 만든다 */
  function rebuild(d) {
    const pos = CoreW.Position.fromFEN(d.startFen);
    for (const u of d.moves) { const m = pos.moveFromUci(u); if (!m) break; pos.make(m); }
    return pos;
  }
  scope.onmessage = (e) => {
    const d = e.data;
    try {
      if (d.type === 'newgame') { searcher.clear(); return; }
      const pos = rebuild(d);
      if (d.type === 'move') {
        const t0 = Date.now();
        const r = CoreW.chooseAiMove(searcher, pos, d.moves, d.level, d.clockMs);
        scope.postMessage({ type: 'move', id: d.id, uci: r ? CoreW.moveToUci(r.move) : null, kind: r && r.kind, score: r && r.score, depth: r && r.depth, ms: Date.now() - t0 });
      } else if (d.type === 'draw') {
        scope.postMessage({ type: 'draw', id: d.id, accept: CoreW.shouldAcceptDraw(searcher, pos, d.aiColor) });
      }
    } catch (err) {
      scope.postMessage({ type: 'error', id: d.id, message: String(err && err.message || err) });
    }
  };
}

/** AI 계산을 워커(없으면 메인 스레드)에 맡기는 창구 */
const AI = {
  worker: null,
  seq: 0,
  pending: new Map(),
  local: null,

  /** 워커를 만든다 (실패하면 메인 스레드로 대신 계산) */
  init() {
    try {
      const src = 'const CoreW = (' + createChessCore.toString() + ')();\n(' + aiWorkerMain.toString() + ')(CoreW, self);';
      const url = URL.createObjectURL(new Blob([src], { type: 'text/javascript' }));
      this.worker = new Worker(url);
      this.worker.onmessage = (e) => this.receive(e.data);
      this.worker.onerror = () => { this.fallback(); };
    } catch (e) {
      this.fallback();
    }
  },

  /** 메인 스레드 계산으로 바꾼다 */
  fallback() {
    if (this.worker) { try { this.worker.terminate(); } catch (e) { this.worker = null; } }
    this.worker = null;
    if (!this.local) {
      const scope = { postMessage: (msg) => setTimeout(() => this.receive(msg), 0) };
      aiWorkerMain(Core, scope);
      this.local = scope;
    }
    const waiting = [...this.pending.values()];
    this.pending.clear();
    for (const w of waiting) this.send(w.msg, w);
  },

  /** 요청을 보낸다 */
  send(msg, entry) {
    this.pending.set(msg.id, entry);
    if (this.worker) this.worker.postMessage(msg);
    else if (this.local) setTimeout(() => this.local.onmessage({ data: msg }), 30);
  },

  /** 응답을 받아 해당 요청을 끝낸다 */
  receive(d) {
    const entry = this.pending.get(d.id);
    if (!entry) return;
    this.pending.delete(d.id);
    if (d.type === 'error') entry.reject(new Error(d.message));
    else entry.resolve(d);
  },

  /** AI에게 수를 묻는다 */
  requestMove(session) {
    const id = ++this.seq;
    const msg = {
      type: 'move', id, startFen: session.startFen, moves: session.records.map(r => r.uci),
      level: session.level, clockMs: session.timeLeft(session.aiColor)
    };
    const p = new Promise((resolve, reject) => this.send(msg, { msg, resolve, reject }));
    return { id, promise: p };
  },

  /** 무승부 제안을 AI가 받아들이는지 묻는다 */
  askDraw(session) {
    const id = ++this.seq;
    const msg = { type: 'draw', id, startFen: session.startFen, moves: session.records.map(r => r.uci), aiColor: session.aiColor };
    return new Promise((resolve, reject) => this.send(msg, { msg, resolve, reject }));
  },

  /** 기다리던 요청을 버린다 (결과가 와도 무시) */
  cancel(id) { this.pending.delete(id); },

  /** 새 대국 시작을 알린다 */
  newGame() {
    if (this.worker) this.worker.postMessage({ type: 'newgame' });
    else if (this.local) this.local.onmessage({ data: { type: 'newgame' } });
  }
};

/** 설정·진행·저장된 대국(혼자 하기는 game, 둘이 하기는 pvpGame)을 브라우저와 (가능하면) 계정 저장소에 보관한다 */
const Store = {
  KEY: 'cutechess.v1',
  data: null,
  cloud: { ref: null, writing: false, dirty: false, timer: 0, unsub: null, ready: false },

  /** 기본값 */
  defaults() {
    return {
      v: 1,
      settings: {
        sound: true, volume: 0.8, battle: 'normal', hints: true, coords: true, letters: false,
        undo: true, vibrate: true, unlockAll: false, updatedAt: 0
      },
      progress: { levels: {} },
      stats: { wins: 0, losses: 0, draws: 0 },
      game: null,
      gameUpdatedAt: 0,
      pvpGame: null,
      pvpGameUpdatedAt: 0,
      updatedAt: 0
    };
  },

  /** 브라우저 저장소에서 읽는다 */
  load() {
    this.data = this.defaults();
    try {
      const raw = localStorage.getItem(this.KEY);
      if (raw) this.merge(JSON.parse(raw), true);
    } catch (e) { this.data = this.defaults(); }
    return this.data;
  },

  /** 다른 저장본을 합친다 (진행은 합집합, 설정·대국은 최신 우선) */
  merge(other, trustAll) {
    if (!other || typeof other !== 'object') return false;
    const d = this.data;
    const before = JSON.stringify(d);
    if (other.resetAt && other.resetAt > (d.resetAt || 0)) {
      d.progress = { levels: {} };
      d.stats = { wins: 0, losses: 0, draws: 0 };
      d.resetAt = other.resetAt;
    }
    if (other.settings && (trustAll || (other.settings.updatedAt || 0) > (d.settings.updatedAt || 0))) {
      d.settings = Object.assign({}, d.settings, other.settings);
    }
    const ol = other.progress && other.progress.levels;
    if (ol && typeof ol === 'object') {
      for (const k of Object.keys(ol)) {
        const a = d.progress.levels[k] || {}, b = ol[k] || {};
        d.progress.levels[k] = {
          cleared: !!(a.cleared || b.cleared), perfect: !!(a.perfect || b.perfect),
          w: Math.max(a.w || 0, b.w || 0), l: Math.max(a.l || 0, b.l || 0), d: Math.max(a.d || 0, b.d || 0)
        };
      }
    }
    if (other.stats) {
      d.stats.wins = Math.max(d.stats.wins, other.stats.wins || 0);
      d.stats.losses = Math.max(d.stats.losses, other.stats.losses || 0);
      d.stats.draws = Math.max(d.stats.draws, other.stats.draws || 0);
    }
    for (const slot of ['game', 'pvpGame']) {
      const at = slot + 'UpdatedAt';
      if ((trustAll || (other[at] || 0) > (d[at] || 0)) && slot in other) { d[slot] = other[slot] || null; d[at] = other[at] || 0; }
    }
    d.updatedAt = Math.max(d.updatedAt || 0, other.updatedAt || 0);
    return JSON.stringify(d) !== before;
  },

  /** 바뀐 내용을 저장한다 (브라우저는 즉시, 계정은 잠시 모아서) */
  save() {
    this.data.updatedAt = Date.now();
    try { localStorage.setItem(this.KEY, JSON.stringify(this.data)); } catch (e) { this.data.localFailed = true; }
    this.scheduleCloud();
  },

  /** 설정을 바꾸고 저장한다 */
  setSetting(key, value) {
    this.data.settings[key] = value;
    this.data.settings.updatedAt = Date.now();
    this.save();
  },

  /** 진행 중인 대국을 저장하거나 지운다 (pvp가 참이면 둘이 하기 칸) */
  setGame(json, pvp) {
    const slot = pvp ? 'pvpGame' : 'game';
    this.data[slot] = json || null;
    this.data[slot + 'UpdatedAt'] = Date.now();
    this.save();
  },

  /** 저장된 대국 (pvp가 참이면 둘이 하기 칸; 없으면 null) */
  saved(pvp) {
    const g = pvp ? this.data.pvpGame : this.data.game;
    return g && g.moves ? g : null;
  },

  /** 단계 기록 */
  level(n) { return this.data.progress.levels[n] || { cleared: false, perfect: false, w: 0, l: 0, d: 0 }; },

  /** 대국 결과를 진행 기록에 반영한다 */
  recordResult(level, outcome, perfect) {
    const cur = Object.assign({ cleared: false, perfect: false, w: 0, l: 0, d: 0 }, this.data.progress.levels[level]);
    if (outcome === 'win') { cur.w++; cur.cleared = true; if (perfect) cur.perfect = true; this.data.stats.wins++; }
    else if (outcome === 'lose') { cur.l++; this.data.stats.losses++; }
    else { cur.d++; this.data.stats.draws++; }
    this.data.progress.levels[level] = cur;
    this.save();
  },

  /** 깬 단계 수 */
  clearedCount() {
    let n = 0;
    for (let i = 1; i <= 50; i++) if (this.level(i).cleared) n++;
    return n;
  },

  /** 깬 단계 중 가장 높은 단계 (없으면 0) */
  topCleared() {
    let n = 0;
    for (let i = 1; i <= 50; i++) if (this.level(i).cleared) n = i;
    return n;
  },

  /** 내 계급 (지금 도전 중인 단계의 계급; 50단계까지 깨면 임페라토르) */
  playerRank() { return Core.rankOf(Math.min(50, this.topCleared() + 1)); },

  /** 내 추정 레이팅 (가장 높이 깬 단계 기준, 아직 없으면 신병 시작값) */
  playerRating() { const top = this.topCleared(); return top ? Core.ratingOf(top) : 400; },

  /** 아직 깨지 않은 첫 단계 (다음 도전 단계) */
  nextLevel() {
    let n = 1;
    while (n < 50 && this.level(n).cleared) n++;
    return n;
  },

  /** 단계가 열려 있는지 */
  isUnlocked(n) { return this.data.settings.unlockAll || n === 1 || this.level(n - 1).cleared; },

  /** 진행 초기화 (설정은 그대로) */
  resetProgress() {
    this.data.progress = { levels: {} };
    this.data.stats = { wins: 0, losses: 0, draws: 0 };
    this.data.game = null;
    this.data.gameUpdatedAt = Date.now();
    this.data.pvpGame = null;
    this.data.pvpGameUpdatedAt = Date.now();
    this.data.resetAt = Date.now();
    this.save();
    if (this.cloud.ref) this.writeCloud(true);
  },

  /** 계정 저장소(있을 때만)를 연결해 기기 간에 진행을 맞춘다 */
  async initCloud(onChange) {
    try {
      if (!window.claude || typeof window.claude.use !== 'function') return;
      const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      if (!db || !user) return;
      const uid = await user.id();
      if (!uid) return;
      const ref = db.doc('data/users/' + uid + '/save');
      this.cloud.ref = ref;
      const snap = await ref.get();
      if (snap.exists) {
        if (this.merge(snap.data(), false) && onChange) onChange();
        try { localStorage.setItem(this.KEY, JSON.stringify(this.data)); } catch (e) { this.data.localFailed = true; }
      }
      this.cloud.ready = true;
      this.writeCloud(false);
      this.cloud.unsub = ref.onSnapshot((s) => {
        if (!s.exists || s.metadata.hasPendingWrites) return;
        if (this.merge(s.data(), false)) {
          try { localStorage.setItem(this.KEY, JSON.stringify(this.data)); } catch (e) { this.data.localFailed = true; }
          if (onChange) onChange();
        }
      }, () => { this.cloud.unsub = null; });
    } catch (e) {
      this.cloud.ref = null;
    }
  },

  /** 계정 저장을 잠시 미뤘다가 한 번에 쓴다 */
  scheduleCloud() {
    if (!this.cloud.ref) return;
    clearTimeout(this.cloud.timer);
    this.cloud.timer = setTimeout(() => this.writeCloud(true), 1500);
  },

  /** 계정 저장소에 쓴다 (한 번에 하나씩) */
  async writeCloud(force) {
    const c = this.cloud;
    if (!c.ref || !c.ready) return;
    if (c.writing) { c.dirty = true; return; }
    c.writing = true;
    try {
      const body = JSON.parse(JSON.stringify(this.data));
      delete body.localFailed;
      await c.ref.set(body);
    } catch (e) {
      if (e && (e.code === 'revoked' || e.code === 'invalid_argument' || e.code === 'not_granted')) c.ref = null;
    }
    c.writing = false;
    if (c.dirty) { c.dirty = false; this.writeCloud(true); }
  }
};

/** 공개 주소로 들어온 방문을 바깥 계수 서비스(Abacus)에 세고 그 숫자를 읽어 온다 (숫자만 올리며 개인 정보는 보내지 않는다) */
const Visits = {
  API: 'https://abacus.jasoncameron.dev',
  SPACE: 'summerjin19-a-better-move',
  KEY: 'cutechess.visit',
  DAYS: 14,
  memo: {},

  /** Claude 아티팩트 안에서 열렸는지 (그 안에서는 바깥 서비스에 닿지 않는다) */
  inClaude() {
    const origins = [location.hostname].concat(Array.from(location.ancestorOrigins || []));
    return !!window.claude || origins.some((o) => /claude/i.test(o));
  },

  /** 이 접속을 셀지 정한다 (내 컴퓨터에서 연 파일·개발용 주소·Claude 아티팩트·자동 프로그램은 세지 않는다) */
  counts() {
    const host = location.hostname;
    if (this.inClaude() || !/^https?:$/.test(location.protocol)) return false;
    if (!host.includes('.') || /^(127|10|192\.168|172\.(1[6-9]|2\d|3[01]))\./.test(host)) return false;
    return !navigator.webdriver && !/bot|crawl|spider|slurp|headless|lighthouse/i.test(navigator.userAgent);
  },

  /** 한국 시간 기준 날짜 열쇠 (예: '20261005'); back은 며칠 전인지 */
  dayKey(back) {
    return new Date(Date.now() + 9 * 3600000 - (back || 0) * 86400000).toISOString().slice(0, 10).replace(/-/g, '');
  },

  /** 계수기 주소를 만든다 */
  url(action, key) { return this.API + '/' + action + '/' + this.SPACE + '/' + key; },

  /** 계수기 하나를 1 올린다 */
  async hit(key) {
    const res = await fetch(this.url('hit', key), { cache: 'no-store' });
    if (!res.ok) throw new Error('hit ' + res.status);
  },

  /** 계수기 값을 읽는다 (아직 없으면 0; 1분 안에 다시 물으면 읽어 둔 값을 쓴다) */
  read(key) {
    const kept = this.memo[key];
    if (kept && Date.now() - kept.at < 60000) return kept.value;
    const value = fetch(this.url('get', key), { cache: 'no-store' }).then((res) => {
      if (res.status === 404) return 0;
      if (!res.ok) throw new Error('get ' + res.status);
      return res.json().then((body) => Number(body.value) || 0);
    });
    this.memo[key] = { at: Date.now(), value };
    value.catch(() => { if (this.memo[key] && this.memo[key].value === value) delete this.memo[key]; });
    return value;
  },

  /** 이 브라우저에 남긴 방문 표시를 읽는다 (저장소를 쓸 수 없으면 null — 그때는 사람 수를 세지 않는다) */
  loadSeen() {
    try {
      let seen = null;
      try { seen = JSON.parse(localStorage.getItem(this.KEY)); } catch (e) { seen = null; }
      if (!seen || typeof seen !== 'object') seen = {};
      localStorage.setItem(this.KEY, JSON.stringify(seen));
      return seen;
    } catch (e) { return null; }
  },

  /** 방문 표시를 남긴다 */
  saveSeen(seen) {
    try { localStorage.setItem(this.KEY, JSON.stringify(seen)); } catch (e) { return; }
  },

  /** 이번에 연 창에서 이미 방문을 셌는지 (mark가 참이면 셌다고 적는다) */
  session(mark) {
    try {
      if (mark) sessionStorage.setItem(this.KEY, '1');
      return sessionStorage.getItem(this.KEY) === '1';
    } catch (e) { return false; }
  },

  /** 아직 세지 않은 것만 센다: 이 브라우저의 첫 방문, 오늘의 첫 방문, 이번에 연 창 (실패하면 표시를 남기지 않아 다음에 다시 센다) */
  async track() {
    const seen = this.loadSeen();
    const today = this.dayKey(0);
    const jobs = [];
    if (seen && !seen.first) jobs.push(this.hit('visitors').then(() => { seen.first = today; this.saveSeen(seen); }));
    if (seen && seen.day !== today) jobs.push(this.hit('day-' + today).then(() => { seen.day = today; this.saveSeen(seen); }));
    if (!this.session(false)) jobs.push(this.hit('visits').then(() => { this.session(true); }));
    if (!jobs.length) return;
    await Promise.allSettled(jobs);
    this.memo = {};
  },

  /** 화면이 실제로 보일 때 한 번 센다 */
  start() {
    if (!this.counts()) return;
    const run = () => {
      if (document.visibilityState !== 'visible') return;
      document.removeEventListener('visibilitychange', run);
      this.track().catch(() => null);
    };
    document.addEventListener('visibilitychange', run);
    run();
  },

  /** 오늘과 전체 방문자 수를 읽는다 */
  async summary() {
    const [today, total] = await Promise.all([this.read('day-' + this.dayKey(0)), this.read('visitors')]);
    return { today, total };
  },

  /** 지난 14일의 날짜별 방문자 수(오늘부터 거꾸로)와 전체 방문 횟수를 읽는다 */
  async history() {
    const keys = [];
    for (let i = 0; i < this.DAYS; i++) keys.push(this.dayKey(i));
    const [visits, ...counts] = await Promise.all([this.read('visits')].concat(keys.map((k) => this.read('day-' + k))));
    return { visits, days: keys.map((key, i) => ({ key, count: counts[i] })) };
  }
};

/** 받침에 맞는 조사를 붙인다 (예: josa('상병', '과', '와') → '상병과') */
function josa(word, withBatchim, without) {
  const code = word.charCodeAt(word.length - 1) - 0xAC00;
  const has = code >= 0 && code <= 11171 && code % 28 !== 0;
  if (withBatchim === '으로' && has && code % 28 === 8) return word + without;
  return word + (has ? withBatchim : without);
}

/** DOM 요소를 id로 찾는다 */
function $(id) { return document.getElementById(id); }

/** 태그·속성·자식으로 요소를 만든다 */
function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  if (attrs) {
    for (const k in attrs) {
      const v = attrs[k];
      if (v == null || v === false) continue;
      if (k === 'class') e.className = v;
      else if (k === 'text') e.textContent = v;
      else if (k === 'html') e.innerHTML = v;
      else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v === true ? '' : v);
    }
  }
  for (const k of kids.flat()) if (k != null && k !== false) e.append(k.nodeType ? k : document.createTextNode(String(k)));
  return e;
}

const ICON_COLORS = { '#': 'currentColor', y: 'currentColor' };

/** 픽셀 아이콘 SVG를 만든다 */
function pixelIcon(name, cls) {
  const rows = PIXEL_ICONS[name] || PIXEL_ICONS.flag;
  const w = rows[0].length, h = rows.length;
  let rects = '';
  for (let y = 0; y < h; y++) {
    let x = 0;
    while (x < w) {
      const ch = rows[y][x];
      if (ch === '.' || !ICON_COLORS[ch]) { x++; continue; }
      let run = 1;
      while (x + run < w && rows[y][x + run] === ch) run++;
      rects += '<rect x="' + x + '" y="' + y + '" width="' + run + '" height="1" fill="' + ICON_COLORS[ch] + '"/>';
      x += run;
    }
  }
  const wrap = document.createElement('span');
  wrap.innerHTML = '<svg class="' + (cls || '') + '" viewBox="0 0 ' + w + ' ' + h + '" aria-hidden="true" focusable="false">' + rects + '</svg>';
  return wrap.firstChild;
}

/** 아이콘이 붙은 버튼을 만든다 */
function iconButton(icon, label, cls, onClick, attrs) {
  return el('button', Object.assign({ class: 'btn ' + (cls || ''), type: 'button', onclick: onClick }, attrs || {}), pixelIcon(icon), el('span', { text: label }));
}

/** 마지막 입력이 키보드였는지 기억한다 (대화상자 포커스 표시용) */
const Input = { keyboard: false };
document.addEventListener('keydown', (e) => { if (e.key === 'Tab' || e.key === 'Enter' || e.key === ' ' || e.key.startsWith('Arrow')) Input.keyboard = true; }, true);
document.addEventListener('pointerdown', () => { Input.keyboard = false; }, true);

/** 화면 위쪽에 잠깐 뜨는 알림 */
const Toast = {
  timer: 0,
  /** 메시지를 보여 준다 (flip이면 마주 앉은 위쪽 자리에서 바로 보이게 돌려서) */
  show(msg, flip) {
    const old = $('toast');
    if (old) old.remove();
    const t = el('div', { id: 'toast', class: 'toast' + (flip ? ' flip' : ''), role: 'status', text: msg });
    $('app').appendChild(t);
    clearTimeout(this.timer);
    this.timer = setTimeout(() => t.remove(), 2300);
  }
};

/** 아래에서 올라오는 시트(대화상자) */
const Sheet = {
  stack: [],
  /** 시트를 연다 (content: 요소 배열, opts.dismiss: 바깥 탭으로 닫기 허용, opts.onClose, opts.flip: 위쪽 자리에서 바로 보이게 돌림) */
  open(content, opts) {
    opts = opts || {};
    const layer = el('div', { class: 'layer' + (opts.flip ? ' rot' : ''), role: 'presentation' });
    const sheet = el('div', { class: 'sheet', role: 'dialog', 'aria-modal': 'true', 'aria-label': opts.label || '알림', tabindex: '-1' }, content);
    layer.appendChild(sheet);
    layer.addEventListener('pointerdown', (e) => {
      if (e.target === layer && opts.dismiss !== false) { e.preventDefault(); this.close(entry, 'dismiss'); }
    });
    const entry = { layer, opts, prevFocus: document.activeElement };
    this.stack.push(entry);
    $('app').appendChild(layer);
    const first = Input.keyboard ? sheet.querySelector('button:not([disabled])') : sheet;
    if (first) setTimeout(() => first.focus({ preventScroll: true }), 30);
    return entry;
  },
  /** 시트를 닫는다 */
  close(entry, reason) {
    entry = entry || this.stack[this.stack.length - 1];
    if (!entry) return;
    const i = this.stack.indexOf(entry);
    if (i < 0) return;
    this.stack.splice(i, 1);
    entry.layer.remove();
    if (entry.opts.onClose) entry.opts.onClose(reason || 'close');
    if (entry.prevFocus && entry.prevFocus.focus && document.contains(entry.prevFocus)) entry.prevFocus.focus({ preventScroll: true });
  },
  /** 모든 시트를 닫는다 */
  closeAll() { while (this.stack.length) this.close(this.stack[this.stack.length - 1], 'all'); },
  /** 열린 시트가 있는지 */
  get isOpen() { return this.stack.length > 0; },
  /** 확인/취소 시트 */
  confirm(title, message, okLabel, okClass) {
    return new Promise((resolve) => {
      let done = false;
      const finish = (v) => { if (done) return; done = true; Sheet.close(entry); resolve(v); };
      const entry = this.open([
        el('h3', { text: title }),
        el('p', { class: 'muted', text: message }),
        el('div', { class: 'actions two' },
          el('button', { class: 'btn', type: 'button', text: '취소', onclick: () => finish(false) }),
          el('button', { class: 'btn ' + (okClass || 'dark'), type: 'button', text: okLabel || '확인', onclick: () => finish(true) }))
      ], { label: title, onClose: () => { if (!done) { done = true; resolve(false); } } });
    });
  }
};

/** 진급할 기물을 고르는 시트 (고른 종류 또는 null; flip이면 위쪽 자리에서 바로 보이게 돌림) */
function pickPromotion(color, flip) {
  return new Promise((resolve) => {
    let done = false;
    const finish = (v) => { if (done) return; done = true; Sheet.close(entry); resolve(v); };
    const grid = el('div', { class: 'promo-grid' });
    for (const [type, name] of [[Core.QUEEN, '퀸'], [Core.ROOK, '룩'], [Core.BISHOP, '비숍'], [Core.KNIGHT, '나이트']]) {
      grid.appendChild(el('button', { type: 'button', 'aria-label': josa(name, '으로', '로') + ' 진급', onclick: () => { Sfx.select(); finish(type); } },
        pieceCanvas(type, color, 56), el('span', { text: name })));
    }
    const entry = Sheet.open([
      el('h3', { text: '진급! 어떤 병정이 될까요?' }),
      el('p', { class: 'muted', text: '끝 줄에 닿은 폰은 다른 병정으로 바뀌어요. 보통은 가장 강한 퀸을 골라요.' }),
      grid
    ], { label: '진급 선택', flip, onClose: () => { if (!done) { done = true; resolve(null); } } });
  });
}

/** 여러 보기 가운데 하나를 고르는 버튼 묶음 (options: [값, 글자] 목록, 고르면 onPick(값)) */
function segGroup(label, options, value, onPick) {
  const wrap = el('div', { class: 'seg', role: 'group', 'aria-label': label });
  const btns = [];
  for (const [v, text] of options) {
    const b = el('button', { type: 'button', 'aria-pressed': String(v === value), text, onclick: () => {
      Sfx.select();
      for (const x of btns) x.setAttribute('aria-pressed', String(x === b));
      onPick(v);
    } });
    btns.push(b);
    wrap.appendChild(b);
  }
  return wrap;
}

/** 작은 캔버스에 기물(정면)을 그린 요소를 만든다 */
function pieceCanvas(type, color, cssSize, cls) {
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const c = el('canvas', { class: cls || '', 'aria-hidden': 'true' });
  c.width = Math.round(cssSize * dpr); c.height = Math.round(cssSize * dpr);
  c.style.width = cssSize + 'px'; c.style.height = cssSize + 'px';
  Art.drawPieceInSquare(c.getContext('2d'), type, color, c.width);
  return c;
}

  openContinueSheet() {
