    'g1f3 g8f6 c2c4 g7g6 b1c3 f8g7 e2e4 d7d6 d2d4 e8g8',
    'g1f3 d7d5 d2d4 g8f6 c2c4 e7e6 b1c3 f8e7'
  ];
  let bookTree = null;

  /** 오프닝 북을 수순 트리로 만든다 */
  function buildBook() {
    bookTree = new Map();
    for (const line of BOOK_LINES) {
      const moves = line.split(' ');
      let key = '';
      for (const mv of moves) {
        if (!bookTree.has(key)) bookTree.set(key, new Map());
        const next = bookTree.get(key);
        next.set(mv, (next.get(mv) || 0) + 1);
        key = key ? key + ' ' + mv : mv;
      }
    }
  }

  /** 지금까지의 수순(UCI 배열)에 맞는 오프닝 북 수를 무작위로 고른다 */
  function bookMove(history, rng) {
    if (!bookTree) buildBook();
    const next = bookTree.get(history.join(' '));
    if (!next || !next.size) return null;
    let total = 0;
    for (const w of next.values()) total += w;
    let r = (rng ? rng() : Math.random()) * total;
    for (const [mv, w] of next) { r -= w; if (r <= 0) return mv; }
    return next.keys().next().value;
  }

  const RANKS = [
    { name: '신병', latin: '티로 (Tiro)', from: 1, to: 3 },
    { name: '군단병', latin: '밀레스 (Miles)', from: 4, to: 6 },
    { name: '고참병', latin: '베테라누스 (Veteranus)', from: 7, to: 8 },
    { name: '십인대장', latin: '데카누스 (Decanus)', from: 9, to: 10 },
    { name: '기수', latin: '시그니페르 (Signifer)', from: 11, to: 13 },
    { name: '백인대장', latin: '켄투리오 (Centurio)', from: 14, to: 17 },
    { name: '수석 백인대장', latin: '프리무스 필루스 (Primus Pilus)', from: 18, to: 20 },
    { name: '대대장', latin: '트리부누스 (Tribunus)', from: 21, to: 25 },
    { name: '진영장', latin: '프라이펙투스 (Praefectus)', from: 26, to: 30 },
    { name: '군단장', latin: '레가투스 (Legatus)', from: 31, to: 35 },
    { name: '총독', latin: '프로콘술 (Proconsul)', from: 36, to: 40 },
    { name: '집정관', latin: '콘술 (Consul)', from: 41, to: 45 },
    { name: '개선장군', latin: '트리움파토르 (Triumphator)', from: 46, to: 49 },
    { name: '임페라토르', latin: '임페라토르 (Imperator)', from: 50, to: 50 }
  ];

  /** 단계(1~50)가 속한 계급 (로마 군단식: 신병 → 백인대장 → 군단장 → … → 임페라토르) */
  function rankOf(level) {
    const L = Math.max(1, Math.min(50, level | 0));
    return RANKS.find(r => L >= r.from && L <= r.to);
  }

  /** 단계(1~50)에 맞는 상대 계급 이름 */
  function rankName(level) { return rankOf(level).name; }

  /** 단계(1~50)의 추정 레이팅 (자체 대국으로 잰 세기 곡선을 사람 레이팅 400~2300 범위에 맞춰 옮긴 어림값) */
  function ratingOf(level) {
    const L = Math.max(1, Math.min(50, level | 0));
    return Math.round((400 + (L - 1) * (1900 / 49)) / 10) * 10;
  }

  /** 세기 매개변수 x(0~1)로 AI 탐색 설정을 만든다 */
  function strengthParams(x) {
    const r = x < 0.6 ? 0.5 * Math.pow(1 - x / 0.6, 2) : 0;
    return {
      maxDepth: 64,
      maxNodes: Math.round(300 * Math.pow(4000, x)),
      noise: Math.round(260 * Math.pow(1 - x, 1.3)),
      randomRate: r,
      quiescence: true,
      takeMate: x >= 0.05,
      guardMate: x >= 0.2
    };
  }

  const LEVEL_X = [0, 0.037, 0.073, 0.106, 0.13, 0.153, 0.176, 0.2, 0.224, 0.248, 0.273, 0.297, 0.32, 0.342, 0.364, 0.387, 0.407, 0.426, 0.444, 0.462, 0.48, 0.498, 0.515, 0.533, 0.55, 0.567, 0.584, 0.602, 0.62, 0.638, 0.657, 0.675, 0.693, 0.71, 0.726, 0.742, 0.759, 0.775, 0.791, 0.806, 0.821, 0.836, 0.851, 0.866, 0.881, 0.896, 0.919, 0.946, 0.973, 1];

  /** 단계(1~50)별 AI 세기 설정 (자체 대국으로 잰 세기 곡선을 단계마다 고르게 나눔) */
  function levelParams(level) {
    const L = Math.max(1, Math.min(50, level | 0));
    const p = strengthParams(LEVEL_X[L - 1]);
    p.level = L;
    p.timeMs = L <= 30 ? 1500 : 1500 + (L - 30) * 125;
    p.useBook = L >= 12;
    p.thinkMin = L < 20 ? 450 : 350;
    if (L === 50) p.maxNodes = 0;
    return p;
  }

  /** 이 수를 두면 상대에게 한 수 메이트를 허용하는지 */
  function allowsMateInOne(pos, m) {
    if (!pos.make(m)) return false;
    let mated = false;
    const replies = pos.legalMoves();
    for (const r of replies) {
      pos.make(r);
      if (pos.inCheck() && !pos.hasLegalMove()) mated = true;
      pos.unmake();
      if (mated) break;
    }
    pos.unmake();
    return mated;
  }

  /** 한 수 메이트가 되는 수를 찾는다 (없으면 0) */
  function findMateInOne(pos, legal) {
    for (const m of legal) {
      pos.make(m);
      const mate = pos.inCheck() && !pos.hasLegalMove();
      pos.unmake();
      if (mate) return m;
    }
    return 0;
  }

  /** AI가 둘 수를 고른다 (오프닝 북 · 무작위 실수 · 흔들린 탐색 · 메이트 안전장치) */
  function chooseAiMove(searcher, pos, history, level, clockMs) {
    const P = typeof level === 'object' ? Object.assign(levelParams(level.level || 25), level) : levelParams(level);
    const legal = pos.legalMoves();
    if (!legal.length) return null;
    if (legal.length === 1) return { move: legal[0], kind: 'forced', score: 0 };
    if (P.useBook && history && history.length < 20) {
      const uci = bookMove(history);
      if (uci) { const m = pos.moveFromUci(uci); if (m) return { move: m, kind: 'book', score: 0 }; }
    }
    if (P.takeMate) {
      const mate = findMateInOne(pos, legal);
      if (mate) return { move: mate, kind: 'mate', score: MATE - 1 };
    }
    let timeMs = P.timeMs;
    if (clockMs != null && isFinite(clockMs)) timeMs = Math.max(60, Math.min(timeMs, clockMs / 25));
    let result;
    if (Math.random() < P.randomRate) {
      result = { move: legal[Math.floor(Math.random() * legal.length)], kind: 'random', score: 0 };
    } else {
      const r = searcher.think(pos, { maxDepth: P.maxDepth, maxNodes: P.maxNodes, timeMs, noise: P.noise, quiescence: P.quiescence });
      result = { move: r.move, kind: 'search', score: r.raw, depth: r.depth, nodes: r.nodes };
    }
    if (P.guardMate && allowsMateInOne(pos, result.move)) {
      const r = searcher.think(pos, { maxDepth: 3, timeMs, quiescence: true });
      if (r.move && !allowsMateInOne(pos, r.move)) result = { move: r.move, kind: 'guard', score: r.raw, depth: r.depth, nodes: r.nodes };
    }
    return result;
  }

  /** 무승부 제안을 받아들일지 판단한다 (AI 입장 점수가 불리하거나 완전히 비긴 형세일 때) */
  function shouldAcceptDraw(searcher, pos, aiColor) {
    if (pos.insufficientMaterial()) return true;
    const r = searcher.think(pos, { maxDepth: 8, timeMs: 500, analyzeSingle: true });
    let score = r.raw;
    if (pos.side !== aiColor) score = -score;
    const c = pos.counts;
    const pawns = c[1] + c[9];
    if (score <= -60) return true;
    if (Math.abs(score) <= 25 && pawns === 0) return true;
    return false;
  }

  return {
    WHITE, BLACK, PAWN, KNIGHT, BISHOP, ROOK, QUEEN, KING,
    chooseAiMove, shouldAcceptDraw, allowsMateInOne, findMateInOne,
    FLAG_CAPTURE, FLAG_EP, FLAG_CASTLE, FLAG_DOUBLE,
    MATE, MATE_BOUND, START_FEN, SQUARES,
    Position, Searcher,
    makePiece, encodeMove, moveFrom, moveTo, movePromo, moveFlags,
    sqName, parseSquare, moveToUci, isSquareAttacked,
    bookMove, levelParams, strengthParams, rankName, rankOf, RANKS, ratingOf, gaussian
  };
}


/** 선 그림 졸라맨 기물·체스판을 캔버스에 그리는 도구 모음 (백=속 빈 선 그림, 흑=속 채운 그림) */
const Art = (() => {
  const INK = '#2B2420';
  const PAL = {
    ink: INK,
    white: '#FFFFFF',
    light: '#FFFFFF',
    dark: '#C4C1BC',
    shade: '#E6E3DD'
  };
  const TEAM = [
    { main: '#D96629', dark: '#A94A17', light: '#F3B48F', name: '주황' },
    { main: '#0093A5', dark: '#006A78', light: '#8FD0D8', name: '청록' }
  ];
  const PAWN_T = 1, KNIGHT_T = 2, BISHOP_T = 3, ROOK_T = 4, QUEEN_T = 5, KING_T = 6;
  const LW = 0.026, LW_BOLD = 0.03;
  const MOUNTED = { 2: true, 3: true, 4: true };

  const FRONT_POSE = {
    x: 0, y: 0, rot: 0, lean: 0, squash: 1, headTilt: 0,
    aB: 0.95, eB: -1.5, aF: 0.3, eF: 0.0,
    hB: 0.18, kB: 0, hF: 0.18, kF: 0,
    wAng: 0, shieldAng: 0, gallop: 0, bob: 0, rear: 0, running: 0
  };
  const SIDE_POSE = {
    x: 0, y: 0, rot: 0, lean: 0.05, squash: 1, headTilt: 0,
    aB: -0.3, eB: 0.6, aF: 0.7, eF: 0.8,
    hB: -0.2, kB: 0.2, hF: 0.22, kF: 0.12,
    wAng: 0.85, shieldAng: 0, gallop: 0, bob: 0, rear: 0, running: 0
  };

  /** 기본 자세(정면/측면)를 복사해 돌려준다 */
  function basePose(view) { return Object.assign({}, view === 'front' ? FRONT_POSE : SIDE_POSE); }

  /** 두 자세를 t(0~1)로 섞는다 */
  function mixPose(a, b, t) {
    const out = {};
    for (const k in a) out[k] = (typeof a[k] === 'number' && typeof b[k] === 'number') ? a[k] + (b[k] - a[k]) * t : (t < 0.5 ? a[k] : b[k]);
    for (const k in b) if (!(k in out)) out[k] = b[k];
    return out;
  }

  /** 진영별 그리기 스타일 (선 색·채움·눈 색·강조색·선 굵기) */
  function styleFor(color, o) {
    const lw = Math.max((o && o.minLw) || 0, o && o.bold ? LW_BOLD : LW);
    if (o && o.mono) return { ink: o.mono, fill: o.mono, eye: o.mono, accent: o.mono, accentLight: o.mono, solid: false, lw, mono: o.mono };
    return {
      ink: INK,
      fill: color === 0 ? '#FFFFFF' : INK,
      eye: color === 0 ? INK : '#FFFFFF',
      accent: TEAM[color].main,
      accentLight: TEAM[color].light,
      solid: color === 1,
      lw
    };
  }

  /** 졸라맨 관절 좌표 (키 1 기준, 발 중앙이 원점, 위가 -y) */
  function joints(p, front) {
    const hip = { x: p.x, y: p.y - 0.40 };
    const torso = 0.27;
    const neck = { x: hip.x + Math.sin(p.lean) * torso, y: hip.y - Math.cos(p.lean) * torso };
    const headAng = p.lean + p.headTilt;
    const head = { x: neck.x + Math.sin(headAng) * 0.17, y: neck.y - Math.cos(headAng) * 0.17 };
    const sh = { x: neck.x - Math.sin(p.lean) * 0.03, y: neck.y + Math.cos(p.lean) * 0.03 };
    const limb = (root, a1, bend, l1, l2, side, knee) => {
      const mid = { x: root.x + Math.sin(a1) * l1 * side, y: root.y + Math.cos(a1) * l1 };
      const a2 = knee ? a1 - bend : a1 + bend;
      const end = { x: mid.x + Math.sin(a2) * l2 * side, y: mid.y + Math.cos(a2) * l2 };
      return [root, mid, end];
    };
    return {
      hip, neck, head, sh, headAng,
      armB: limb(sh, p.aB, p.eB, 0.16, 0.15, front ? -1 : 1, false),
      armF: limb(sh, p.aF, p.eF, 0.16, 0.15, 1, false),
      legB: limb(hip, p.hB, p.kB, 0.205, 0.205, front ? -1 : 1, true),
      legF: limb(hip, p.hF, p.kF, 0.205, 0.205, 1, true)
    };
  }

  /** 점들을 잇는 선 */
  function stroke(ctx, pts, color, lw) {
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.stroke();
  }

  let outline = INK;

  /** 현재 경로를 채우고 잉크로 테두리 친다 */
  function fillOut(ctx, fill, lw) {
    ctx.fillStyle = fill; ctx.fill();
    ctx.lineWidth = lw; ctx.strokeStyle = outline; ctx.lineJoin = 'round'; ctx.stroke();
  }

  /**
   * 졸라맨 한 명(또는 기수+탈것)을 그린다. (x,y)는 발밑 가운데, H는 사람 키(px).
   * o: view('front'|'side'), facing(1|-1), pose, expr('idle'|'fight'|'hurt'|'ko'|'win'|'focus'), weapon(false로 숨김), flash(0~1), alpha, bold
   */
  function drawFigure(ctx, x, y, H, type, color, o) {
    o = o || {};
    const front = o.view === 'front';
    const f = o.facing || 1;
    const st = styleFor(color, o);
    const p = Object.assign(basePose(front ? 'front' : 'side'), o.pose || {});
    ctx.save();
    ctx.translate(x, y);
    if (o.alpha !== undefined) ctx.globalAlpha *= o.alpha;
    ctx.scale(H, H);
    if (!front && f < 0) ctx.scale(-1, 1);
    if (p.rot) { ctx.translate(p.x, p.y - 0.45); ctx.rotate(p.rot); ctx.translate(-p.x, -(p.y - 0.45)); }
    if (p.squash !== 1) ctx.scale(1 / Math.sqrt(p.squash), p.squash);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    outline = st.mono || INK;
    if (MOUNTED[type]) drawMounted(ctx, st, p, type, o);
    else drawPerson(ctx, st, p, front, type, o.expr || 'idle', o.weapon !== false, 1, null);
    outline = INK;
    ctx.restore();
    if (o.flash && !o.mono) {
      ctx.save();
      ctx.globalAlpha *= Math.min(1, o.flash);
      drawFigure(ctx, x, y, H, type, color, Object.assign({}, o, { flash: 0, mono: '#FFFFFF' }));
      ctx.restore();
    }
  }

  /** 보병(킹·퀸·폰) 또는 기수를 그린다. rider: null(보병) | 'near'(앉은 기수, 앞다리만) | 'both'(선 기수) */
  function drawPerson(ctx, st, p, front, type, expr, weapon, scale, rider) {
    const J = joints(p, front);
    const lw = st.lw;
    ctx.save();
    if (scale !== 1) { ctx.translate(p.x, p.y); ctx.scale(scale, scale); ctx.translate(-p.x, -p.y); }
    const dress = type === QUEEN_T;
    if (!dress && rider !== 'near') stroke(ctx, J.legB.slice(0, 3), st.ink, lw);
    if (type === PAWN_T && weapon && !front && !p.hideSpear) drawSpear(ctx, st, J.armB[2], p.wAng, 0.95);
    if (type === PAWN_T && weapon && front) drawShieldFront(ctx, st, J.armB[2], p.shieldAng);
    stroke(ctx, J.armB.slice(0, 3), st.ink, lw);
    if (dress) drawDress(ctx, st, J, front, lw, p.dressLen);
    else if (type === KING_T) drawTunic(ctx, st, J, front, lw);
    else stroke(ctx, [J.hip, J.neck], st.ink, lw);
    if (!dress) stroke(ctx, J.legF.slice(0, 3), st.ink, lw);
    drawHead(ctx, st, J, expr, front, p);
    if (type === KING_T || type === QUEEN_T) drawCrown(ctx, st, J, type);
    if (type === PAWN_T) drawHelmet(ctx, st, J, front);
    if (weapon) {
      if (type === KING_T || type === QUEEN_T) drawSword(ctx, st, J.armF[2], p.wAng);
      else if (type === PAWN_T) { if (front) drawSpear(ctx, st, J.armF[2], p.wAng, 1.0); else drawShieldSide(ctx, st, J.armF[2], p.shieldAng); }
      else if (!p.hideSpear) drawSpear(ctx, st, J.armF[2], p.wAng, 0.95);
    }
    stroke(ctx, J.armF.slice(0, 3), st.ink, lw);
    ctx.restore();
    return J;
  }

  /** 머리(속 빈 원 또는 채운 원)와 표정 */
  function drawHead(ctx, st, J, expr, front, p) {
    const h = J.head;
    ctx.beginPath(); ctx.arc(h.x, h.y, 0.145, 0, Math.PI * 2);
    fillOut(ctx, st.fill, st.lw);
    drawFace(ctx, st, h, expr, front, p.headTilt || 0);
  }

  /** 눈 (평소 점, 전투 중 치켜뜬 눈, 다침·기절·승리 표정) */
  function drawFace(ctx, st, h, expr, front, tilt) {
    const dx = front ? 0 : 0.045;
    const ex = 0.052, ey = h.y - 0.005 + tilt * 0.03;
    const L = { x: h.x + dx - ex, y: ey }, R = { x: h.x + dx + ex, y: ey };
    const col = st.eye;
    ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = st.lw; ctx.lineCap = 'round';
    const dot = (pt, s) => { ctx.beginPath(); ctx.arc(pt.x, pt.y, s, 0, Math.PI * 2); ctx.fill(); };
    const line = (x1, y1, x2, y2) => { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); };
    if (expr === 'fight' || expr === 'focus') {
      ctx.lineWidth = expr === 'fight' ? st.lw * 1.3 : st.lw;
      line(L.x - 0.04, L.y - 0.034, L.x + 0.026, L.y + 0.022);
      line(R.x + 0.04, R.y - 0.034, R.x - 0.026, R.y + 0.022);
      if (expr === 'focus') { dot({ x: L.x - 0.006, y: L.y + 0.034 }, 0.015); dot({ x: R.x + 0.006, y: R.y + 0.034 }, 0.015); }
    } else if (expr === 'hurt') {
      line(L.x - 0.03, L.y - 0.03, L.x + 0.02, L.y); line(L.x + 0.02, L.y, L.x - 0.03, L.y + 0.03);
      line(R.x + 0.03, R.y - 0.03, R.x - 0.02, R.y); line(R.x - 0.02, R.y, R.x + 0.03, R.y + 0.03);
    } else if (expr === 'ko') {
      for (const e of [L, R]) { line(e.x - 0.028, e.y - 0.028, e.x + 0.028, e.y + 0.028); line(e.x + 0.028, e.y - 0.028, e.x - 0.028, e.y + 0.028); }
    } else if (expr === 'win') {
      for (const e of [L, R]) { ctx.beginPath(); ctx.arc(e.x, e.y + 0.014, 0.03, Math.PI * 1.08, Math.PI * 1.92); ctx.stroke(); }
    } else if (expr === 'sad') {
      line(L.x - 0.032, L.y - 0.008, L.x + 0.028, L.y + 0.012);
      line(R.x + 0.032, R.y - 0.008, R.x - 0.028, R.y + 0.012);
    } else {
      dot(L, 0.02); dot(R, 0.02);
    }
  }

  /** 왕관 (킹: 세 뿔 채운 왕관, 퀸: 작은 티아라) */
  function drawCrown(ctx, st, J, type) {
    const h = J.head;
    ctx.save();
    ctx.translate(h.x, h.y);
    ctx.rotate(J.headAng);
    const base = -0.1;
    if (type === KING_T) {
      const w = 0.15, ht = 0.17;
      ctx.beginPath();
      ctx.moveTo(-w, base);
      ctx.lineTo(-w, base - ht * 0.95);
      ctx.lineTo(-w * 0.5, base - ht * 0.5);
      ctx.lineTo(0, base - ht);
      ctx.lineTo(w * 0.5, base - ht * 0.5);
      ctx.lineTo(w, base - ht * 0.95);
      ctx.lineTo(w, base);
      ctx.closePath();
      fillOut(ctx, st.accent, st.lw * 0.9);
    } else {
      const w = 0.11, ht = 0.1;
      ctx.beginPath();
      ctx.moveTo(-w, base + 0.01);
      ctx.lineTo(-w * 0.85, base - ht * 0.8);
      ctx.lineTo(-w * 0.42, base - ht * 0.35);
      ctx.lineTo(0, base - ht);
      ctx.lineTo(w * 0.42, base - ht * 0.35);
      ctx.lineTo(w * 0.85, base - ht * 0.8);
      ctx.lineTo(w, base + 0.01);
      ctx.closePath();
      fillOut(ctx, st.accent, st.lw * 0.8);
      for (const px of [-w * 0.85, 0, w * 0.85]) {
        ctx.beginPath(); ctx.arc(px, base - (px === 0 ? ht : ht * 0.8) - 0.012, 0.02, 0, Math.PI * 2);
        fillOut(ctx, st.mono || '#FFFFFF', st.lw * 0.55);
      }
    }
    ctx.restore();
  }

  /** 폰의 투구 (로마 군단병식: 반구 투구 + 챙, 측면에서는 목가리개와 위에 얹은 깃 장식) */
  function drawHelmet(ctx, st, J, front) {
    const h = J.head;
    const r = 0.165, rim = -0.04;
    const crest = st.mono || st.accentLight;
    ctx.save();
    ctx.translate(h.x, h.y);
    ctx.rotate(J.headAng);
    if (front) {
      ctx.beginPath(); ctx.roundRect(-0.03, rim - r - 0.075, 0.06, 0.1, 0.02);
      fillOut(ctx, crest, st.lw * 0.7);
      ctx.beginPath(); ctx.arc(0, rim, r, Math.PI, Math.PI * 2); ctx.closePath();
      fillOut(ctx, st.accent, st.lw * 0.9);
      stroke(ctx, [{ x: -r - 0.02, y: rim }, { x: r + 0.02, y: rim }], st.ink, st.lw * 0.95);
    } else {
      ctx.beginPath(); ctx.arc(0, rim, r, 0, Math.PI, true);
      ctx.lineTo(-0.2, rim + 0.125); ctx.lineTo(-0.12, rim + 0.095); ctx.lineTo(-0.1, rim); ctx.closePath();
      fillOut(ctx, st.accent, st.lw * 0.9);
      ctx.beginPath();
      ctx.arc(0, rim, r + 0.05, -Math.PI * 0.86, -Math.PI * 0.2);
      ctx.arc(0, rim, r, -Math.PI * 0.2, -Math.PI * 0.86, true);
      ctx.closePath();
      fillOut(ctx, crest, st.lw * 0.7);
      stroke(ctx, [{ x: 0.15, y: rim + 0.004 }, { x: 0.22, y: rim - 0.016 }], st.ink, st.lw);
    }
    ctx.restore();
  }

  /** 킹의 튜닉 (어깨에서 허리로 좁아지는 옷, V넥·허리띠) */
  function drawTunic(ctx, st, J, front, lw) {
    const n = J.neck, hp = J.hip;
    const ux = n.x - hp.x, uy = n.y - hp.y;
    const len = Math.hypot(ux, uy) || 1;
    const px = -uy / len, py = ux / len;
    const sw = front ? 0.16 : 0.09, hw = front ? 0.11 : 0.075;
    const s1 = { x: n.x + px * sw + ux / len * -0.03, y: n.y + py * sw + uy / len * -0.03 }, s2 = { x: n.x - px * sw + ux / len * -0.03, y: n.y - py * sw + uy / len * -0.03 };
    const h1 = { x: hp.x + px * hw, y: hp.y + py * hw }, h2 = { x: hp.x - px * hw, y: hp.y - py * hw };
    ctx.beginPath();
    ctx.moveTo(s1.x, s1.y); ctx.lineTo(s2.x, s2.y); ctx.lineTo(h2.x, h2.y); ctx.lineTo(h1.x, h1.y); ctx.closePath();
    fillOut(ctx, st.fill, lw * 0.85);
    const belt = 0.3;
    const b1 = { x: h1.x + (s1.x - h1.x) * belt, y: h1.y + (s1.y - h1.y) * belt }, b2 = { x: h2.x + (s2.x - h2.x) * belt, y: h2.y + (s2.y - h2.y) * belt };
    stroke(ctx, [b1, b2], st.mono ? st.mono : (st.solid ? '#FFFFFF' : st.ink), lw * 0.55);
    if (front) {
      const vx = n.x, vy = n.y + 0.02;
      stroke(ctx, [{ x: vx - 0.07, y: vy }, { x: vx, y: vy + 0.1 }, { x: vx + 0.07, y: vy }], st.mono ? st.mono : (st.solid ? '#FFFFFF' : st.ink), lw * 0.5);
    }
  }

  /** 퀸의 드레스 (허리에서 바닥으로 퍼지는 삼각형; len으로 길이를 줄이면 무릎 꿇은 치마) */
  function drawDress(ctx, st, J, front, lw, len) {
    const hp = J.hip;
    stroke(ctx, [hp, J.neck], st.ink, lw);
    const baseY = hp.y + (len || 0.42);
    ctx.beginPath();
    ctx.moveTo(hp.x - 0.05, hp.y - 0.02);
    ctx.lineTo(hp.x + 0.05, hp.y - 0.02);
    ctx.lineTo(hp.x + (front ? 0.29 : 0.3), baseY);
    ctx.lineTo(hp.x - (front ? 0.29 : 0.22), baseY);
    ctx.closePath();
    fillOut(ctx, st.fill, lw);
  }

  /** 칼 (손 위치에서 각도만큼 돌려 그린다; 0=위) */
  function drawSword(ctx, st, hand, ang) {
    ctx.save();
    ctx.translate(hand.x, hand.y);
    ctx.rotate(ang);
    ctx.lineCap = 'round';
    stroke(ctx, [{ x: 0, y: 0.09 }, { x: 0, y: -0.03 }], st.ink, st.lw * 1.1);
    stroke(ctx, [{ x: -0.085, y: -0.04 }, { x: 0.085, y: -0.04 }], st.ink, st.lw);
    ctx.beginPath();
    ctx.moveTo(-0.028, -0.055); ctx.lineTo(-0.028, -0.4); ctx.lineTo(0, -0.47); ctx.lineTo(0.028, -0.4); ctx.lineTo(0.028, -0.055); ctx.closePath();
    fillOut(ctx, st.solid ? st.ink : '#FFFFFF', st.lw * 0.7);
    if (!st.solid) stroke(ctx, [{ x: 0, y: -0.08 }, { x: 0, y: -0.38 }], st.ink, st.lw * 0.4);
    ctx.restore();
  }

  /** 창 (손 위치에서 각도만큼; 손은 자루의 아래쪽 1/3을 잡는다) */
  function drawSpear(ctx, st, hand, ang, len) {
    ctx.save();
    ctx.translate(hand.x, hand.y);
    ctx.rotate(ang);
    const butt = len * 0.38, top = -len * 0.62;
    stroke(ctx, [{ x: 0, y: butt }, { x: 0, y: top }], st.ink, st.lw);
    ctx.beginPath();
    ctx.moveTo(0, top - 0.17);
    ctx.quadraticCurveTo(0.055, top - 0.08, 0.04, top + 0.01);
    ctx.lineTo(-0.04, top + 0.01);
    ctx.quadraticCurveTo(-0.055, top - 0.08, 0, top - 0.17);
    ctx.closePath();
    fillOut(ctx, st.ink, st.lw * 0.5);
    ctx.restore();
  }

  /** 방패 (정면: 가운데 선이 있는 하트형 방패) */
  function drawShieldFront(ctx, st, hand, tilt) {
    ctx.save();
    ctx.translate(hand.x - 0.02, hand.y + 0.02);
    ctx.rotate(tilt || 0);
    shieldPath(ctx, 0.15, 0.2);
    fillOut(ctx, st.accent, st.lw * 0.9);
    stroke(ctx, [{ x: 0, y: -0.15 }, { x: 0, y: 0.13 }], st.mono || '#FFFFFF', st.lw * 0.8);
    ctx.restore();
  }

  /** 방패 (측면: 앞으로 든 좁은 방패) */
  function drawShieldSide(ctx, st, hand, tilt) {
    ctx.save();
    ctx.translate(hand.x + 0.04, hand.y + 0.03);
    ctx.rotate((tilt || 0) + 0.1);
    ctx.scale(0.55, 1);
    shieldPath(ctx, 0.15, 0.2);
    fillOut(ctx, st.accent, st.lw * 0.95);
    stroke(ctx, [{ x: 0, y: -0.15 }, { x: 0, y: 0.13 }], st.mono || '#FFFFFF', st.lw * 0.9);
    ctx.restore();
  }

  /** 방패 외곽 경로 */
  function shieldPath(ctx, w, h) {
    ctx.beginPath();
    ctx.moveTo(-w, -h * 0.85);
    ctx.quadraticCurveTo(0, -h * 1.05, w, -h * 0.85);
    ctx.quadraticCurveTo(w * 1.05, h * 0.2, 0, h);
    ctx.quadraticCurveTo(-w * 1.05, h * 0.2, -w, -h * 0.85);
    ctx.closePath();
  }

  /** 탈것(말·코끼리·전차)과 기수를 그린다 */
  function drawMounted(ctx, st, p, type, o) {
    const g = p.gallop || 0;
    ctx.save();
    ctx.translate(p.x, p.y - (p.bob || 0));
    if (p.rear) { ctx.translate(-0.3, 0); ctx.rotate(-p.rear * 0.5); ctx.translate(0.3, 0); }
    let seat;
    if (type === KNIGHT_T) seat = drawHorse(ctx, st, g, p);
    else if (type === BISHOP_T) seat = drawElephant(ctx, st, g, p);
    else seat = drawChariot(ctx, st, g, p);
    const rp = Object.assign(basePose('side'), {
      x: seat.x, y: seat.y, lean: p.lean, headTilt: p.headTilt,
      aB: p.aB, eB: p.eB, aF: p.aF, eF: p.eF, wAng: p.wAng,
      hB: seat.hB, kB: seat.kB, hF: seat.hF, kF: seat.kF
    });
    drawPerson(ctx, st, rp, false, type, o.expr || 'idle', o.weapon !== false, seat.scale, seat.standing ? 'both' : 'near');
    ctx.restore();
  }

  /** 말 (오른쪽을 보는 측면). 기수 자리를 돌려준다 */
  function drawHorse(ctx, st, g, p) {
    const lw = st.lw;
    const swing = Math.sin(g * Math.PI * 2);
    const run = p.running ? 1 : 0;
    const legs = [
      { x: -0.22, a: run ? -0.5 * swing - 0.3 : -0.1, k: run ? 0.9 : 0.12 },
      { x: -0.11, a: run ? -0.5 * swing + 0.1 : 0.04, k: run ? 0.6 : 0.04 },
      { x: 0.1, a: run ? 0.5 * swing + 0.05 : -0.04, k: run ? -0.7 : -0.08 },
      { x: 0.21, a: run ? 0.5 * swing + 0.4 : 0.08, k: run ? -0.5 : -0.04 }
    ];
    const legPts = (L) => {
      const root = { x: L.x, y: -0.38 };
      const knee = { x: root.x + Math.sin(L.a) * 0.17, y: root.y + Math.cos(L.a) * 0.17 };
      const hoof = { x: knee.x + Math.sin(L.a + L.k) * 0.21, y: knee.y + Math.cos(L.a + L.k) * 0.21 };
      return [root, knee, hoof];
    };
    stroke(ctx, legPts(legs[0]), st.ink, lw * 1.1);
    stroke(ctx, legPts(legs[2]), st.ink, lw * 1.1);
    stroke(ctx, [{ x: -0.32, y: -0.5 }, { x: -0.46, y: -0.52 }, { x: -0.52, y: -0.34 }, { x: -0.48, y: -0.22 }], st.ink, lw);
    ctx.beginPath(); ctx.ellipse(0.0, -0.5, 0.36, 0.2, 0, 0, Math.PI * 2);
    fillOut(ctx, st.fill, lw);
    ctx.beginPath();
    ctx.moveTo(0.18, -0.64); ctx.lineTo(0.44, -0.93); ctx.lineTo(0.55, -0.86); ctx.lineTo(0.33, -0.52); ctx.closePath();
    fillOut(ctx, st.fill, lw);
    ctx.beginPath(); ctx.ellipse(0.57, -0.84, 0.14, 0.08, 0.35, 0, Math.PI * 2);
    fillOut(ctx, st.fill, lw);
    ctx.beginPath(); ctx.moveTo(0.44, -0.9); ctx.lineTo(0.41, -1.02); ctx.lineTo(0.5, -0.94); ctx.closePath(); fillOut(ctx, st.fill, lw * 0.7);
    ctx.beginPath(); ctx.moveTo(0.52, -0.92); ctx.lineTo(0.54, -1.04); ctx.lineTo(0.6, -0.94); ctx.closePath(); fillOut(ctx, st.fill, lw * 0.7);
    stroke(ctx, [{ x: 0.26, y: -0.68 }, { x: 0.32, y: -0.8 }], st.ink, lw * 0.6);
    stroke(ctx, [{ x: 0.34, y: -0.76 }, { x: 0.4, y: -0.88 }], st.ink, lw * 0.6);
    ctx.beginPath(); ctx.arc(0.59, -0.87, 0.02, 0, Math.PI * 2); ctx.fillStyle = st.eye; ctx.fill();
    ctx.beginPath(); ctx.roundRect(-0.15, -0.72, 0.24, 0.13, 0.04); fillOut(ctx, st.accent, lw * 0.6);
    stroke(ctx, legPts(legs[1]), st.ink, lw * 1.1);
    stroke(ctx, legPts(legs[3]), st.ink, lw * 1.1);
    return { x: -0.05, y: -0.43, scale: 0.78, hB: 1.15, kB: 1.4, hF: 1.15, kF: 1.4 };
  }

  /** 코끼리 (오른쪽을 보는 측면). 기수 자리를 돌려준다 */
  function drawElephant(ctx, st, g, p) {
    const lw = st.lw;
    const swing = p.running ? Math.sin(g * Math.PI * 2) * 0.1 : 0;
    const leg = (x, off) => {
      ctx.beginPath(); ctx.roundRect(x - 0.06 + off, -0.44, 0.12, 0.44, 0.04); fillOut(ctx, st.fill, lw * 0.9);
    };
    leg(-0.26, swing); leg(0.08, -swing);
    stroke(ctx, [{ x: -0.42, y: -0.52 }, { x: -0.52, y: -0.36 }], st.ink, lw * 0.7);
    ctx.beginPath(); ctx.ellipse(-0.04, -0.52, 0.4, 0.26, 0, 0, Math.PI * 2);
    fillOut(ctx, st.fill, lw);
    leg(-0.12, -swing); leg(0.24, swing);
    ctx.beginPath(); ctx.arc(0.42, -0.6, 0.19, 0, Math.PI * 2);
    fillOut(ctx, st.fill, lw);
    ctx.beginPath();
    ctx.moveTo(0.55, -0.56);
    ctx.quadraticCurveTo(0.74, -0.42, 0.68, -0.16);
    ctx.quadraticCurveTo(0.64, -0.03, 0.54, -0.07);
    ctx.strokeStyle = st.ink; ctx.lineWidth = lw * 4; ctx.stroke();
    if (!st.solid && !st.mono) { ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = lw * 2; ctx.stroke(); }
    stroke(ctx, [{ x: 0.5, y: -0.46 }, { x: 0.6, y: -0.38 }], st.mono || '#FFFFFF', lw * 1.4);
    stroke(ctx, [{ x: 0.5, y: -0.46 }, { x: 0.6, y: -0.38 }], st.mono || (st.solid ? '#FFFFFF' : st.ink), lw * 0.6);
    ctx.beginPath(); ctx.ellipse(0.35, -0.62, 0.1, 0.15, -0.15, 0, Math.PI * 2);
    fillOut(ctx, st.fill, lw * 0.9);
    ctx.beginPath(); ctx.arc(0.53, -0.66, 0.02, 0, Math.PI * 2); ctx.fillStyle = st.eye; ctx.fill();
    ctx.beginPath(); ctx.roundRect(-0.22, -0.82, 0.3, 0.13, 0.04); fillOut(ctx, st.accent, lw * 0.6);
    return { x: -0.08, y: -0.56, scale: 0.72, hB: 1.2, kB: 1.45, hF: 1.2, kF: 1.45 };
  }

  /** 전차 (오른쪽으로 달리는 측면). 기수 자리를 돌려준다 */
  function drawChariot(ctx, st, g, p) {
    const lw = st.lw;
    const wheel = (cx) => {
      ctx.beginPath(); ctx.arc(cx, -0.17, 0.17, 0, Math.PI * 2);
      fillOut(ctx, st.fill, lw);
      ctx.save(); ctx.translate(cx, -0.17); ctx.rotate(g * Math.PI * 2);
      ctx.strokeStyle = st.mono || (st.solid ? '#FFFFFF' : st.ink); ctx.lineWidth = lw * 0.5;
      for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.moveTo(-0.15, 0); ctx.lineTo(0.15, 0); ctx.stroke(); ctx.rotate(Math.PI / 4); }
      ctx.restore();
      ctx.beginPath(); ctx.arc(cx, -0.17, 0.03, 0, Math.PI * 2); ctx.fillStyle = st.ink; ctx.fill();
    };
    wheel(-0.17);
    ctx.beginPath(); ctx.roundRect(-0.34, -0.5, 0.6, 0.12, 0.03); fillOut(ctx, st.fill, lw);
    ctx.beginPath();
    ctx.moveTo(0.22, -0.46);
    ctx.quadraticCurveTo(0.46, -0.56, 0.42, -0.86);
    ctx.lineTo(0.32, -0.86);
    ctx.quadraticCurveTo(0.34, -0.62, 0.14, -0.54);
    ctx.closePath();
    fillOut(ctx, st.accent, lw * 0.8);
    wheel(0.17);
    return { x: -0.08, y: -0.5, scale: 0.74, standing: true, hB: -0.08, kB: 0, hF: 0.12, kF: 0 };
  }

  const PIECE_BOX = { 1: { w: 0.62, h: 1.3, cx: 0 }, 2: { w: 1.3, h: 1.3, cx: 0.1 }, 3: { w: 1.3, h: 1.36, cx: 0.1 }, 4: { w: 0.9, h: 1.38, cx: 0.05 }, 5: { w: 0.62, h: 1.22, cx: 0 }, 6: { w: 0.72, h: 1.17, cx: 0 } };
  const TYPE_SCALE = [0, 0.62, 0.6, 0.58, 0.6, 0.64, 0.66];
  const MOVE_CX = { 1: 0.06, 5: 0.12, 6: 0.05 };
  const spriteCache = new Map();

  /** 체스판용 기물 그림을 오프스크린 캔버스로 만들어 캐시한다 */
  function pieceSprite(type, color, squarePx, dpr, opts) {
    const key = type + ':' + color + ':' + squarePx + ':' + dpr + ':' + (opts && opts.letter ? 1 : 0) + ':' + (opts && opts.expr || '');
    let c = spriteCache.get(key);
    if (c) return c;
    const size = Math.max(1, Math.round(squarePx * dpr));
    c = document.createElement('canvas');
    c.width = size; c.height = size;

  /** 기물 종류별 서 있는 자세 (판·아바타용) */

    const mounted = !!MOUNTED[type];

    if (type === KING_T) Object.assign(pose, { aB: 0.95, eB: -1.55, aF: 0.42, eF: -0.1, wAng: Math.PI, hB: 0.2, hF: 0.2 });

    if (type === PAWN_T) Object.assign(pose, { aB: 0.72, eB: -0.9, aF: 0.95, eF: -1.4, wAng: 0, hB: 0.14, hF: 0.14 });

  }

  const WALK_A = { lean: 0.08, hB: -0.42, kB: 0.6, hF: 0.4, kF: 0.05, y: -0.005 };
  const WALK_B = { lean: 0.08, hB: 0.4, kB: 0.05, hF: -0.42, kF: 0.6, y: -0.03 };
  const STEP_A = { lean: 0.04, hB: -0.3, kB: 0.45, hF: 0.3, kF: 0.05, aB: 0.3, eB: 0.15, y: 0 };
  const STEP_B = { lean: 0.04, hB: 0.3, kB: 0.05, hF: -0.3, kF: 0.45, aB: -0.15, eB: 0.25, y: -0.02 };
  const DASH_A = { lean: 0.33, aB: 0.9, eB: 0.7, aF: 0.2, eF: 1.1, y: -0.02 };
  const DASH_B = { lean: 0.33, aB: -0.6, eB: 0.6, aF: 1.0, eF: 0.6, y: -0.07 };
  const WHEEL_TURN = 0.68;

  /**
   * 판 위를 이동하는 동안의 자세 (모두 측면). travel은 지금까지 간 거리(칸), ms는 이동 시작 후 시간.
   * 걸음은 거리에 묶여 있어 한 칸에 두어 걸음: 폰·킹은 걷고(두 자세 번갈아), 퀸은 달리고, 나이트·비숍은 말·코끼리가 뛰고, 룩은 간 거리만큼 전차 바퀴가 돈다
   */
  function movePose(type, travel, ms) {
    const beat = (perSquare, a, b) => Math.floor(travel * perSquare) % 2 ? b : a;
    const cycle = (perSquare) => (travel * perSquare) % 1;
    if (type === PAWN_T) return Object.assign({}, beat(2, WALK_A, WALK_B), { aB: 0.32, eB: 0.1, wAng: -0.3, aF: 0.55, eF: 0.55, shieldAng: 0.05 });
    if (type === KING_T) return Object.assign({}, beat(2, STEP_A, STEP_B), { aF: 0.9, eF: -0.1, wAng: 3.9 });
    if (type === QUEEN_T) return Object.assign({}, beat(2.5, DASH_A, DASH_B), { wAng: 1.25 });
    const pose = standPose(type);
    if (type === KNIGHT_T) { const g = cycle(1.1); return Object.assign(pose, { running: 1, gallop: g, bob: Math.abs(Math.sin(g * Math.PI)) * 0.05, lean: 0.25, aB: 0.4, eB: 0.6, aF: 1.1, eF: 0.15, wAng: 1.5 }); }

  }

  /** 칸 크기에 맞춘 기물 키(px) — 판 위 정지 그림과 전투 장면이 같은 크기를 쓴다 */

  }

  /** 판 위 정지 그림의 발 위치: 칸 가운데 기준 x 오프셋(px)과 바라보는 방향 */

  /**
   * 한 칸 크기 안에 그림자와 함께 기물을 그린다 (기마 기물은 측면, 백은 오른쪽·흑은 왼쪽을 본다).
   * opts.pose가 있으면 이동 중 자세로 그린다(보병도 측면, opts.facing 방향). opts.dpr은 선 굵기 하한 보정용

  const CHEER_FRONT = { aB: 2.3, eB: 0.2, aF: 2.3, eF: 0.2, wAng: 0.3, shieldAng: 0.2, hB: 0.2, kB: 0, hF: 0.2, kF: 0, lean: 0, headTilt: 0 };

  const KNEEL = { y: 0.2, lean: 0.28, headTilt: 0.42, aB: 0.55, eB: 0.3, aF: 1.0, eF: 0.35, hB: -0.4, kB: 1.17, hF: 1.45, kF: 1.45, wAng: 1.3, shieldAng: 0.3, dressLen: 0.22 };

  /**
   * 대국이 끝난 뒤 판 위 기물의 의식 자세. role: 'win'(뛰며 만세) · 'lose'(천천히 무릎 꿇고 무기를 내려놓음) · 'draw'(선 채로 고개 숙이고 무기를 내려놓음).

   */
  function ceremonyPose(type, color, role, ms, seed, still) {
    const mounted = !!MOUNTED[type];
    const facing = color === 0 ? 1 : -1;
    if (role === 'win') {
      const period = 950, k = ((ms + seed * period) % period) / period;
      const air = still || k >= 0.42 ? 0 : Math.sin(Math.PI * k / 0.42);

        return { pose, view: 'side', facing, expr: 'win', weapon: true, jump: 0.3 * air };
      }
      const pose = Object.assign(basePose('front'), CHEER_FRONT, { squash });
      if (air > 0) Object.assign(pose, { hB: 0.35, kB: 0.55, hF: 0.35, kF: 0.55 });

    }

    const e = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

    }

    const to = Object.assign(basePose('side'), role === 'lose' ? KNEEL : SLUMP, type === QUEEN_T ? {} : { dressLen: 0.42 });
    return { pose: mixPose(from, to, e), view: 'side', facing, expr, weapon: !laid, ground: laid, jump: 0 };
  }

  /** 날아가는 창 (전투 결정타용): (x,y)는 창 가운데, ang는 0=위 기준 시계 방향 */
  function drawThrownSpear(ctx, x, y, H, ang, color) {
    const st = styleFor(color, {});
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(H, H);
    ctx.lineCap = 'round';
    drawSpear(ctx, st, { x: 0, y: 0 }, ang, 0.95);
    ctx.restore();
  }

  /** 별 모양 경로를 만든다 */

  }

      }

  }

  /** 얼굴 클로즈업 (전투 컷인용): 큰 머리와 표정, 기물 종류를 주면 투구·왕관도 얹는다 */

    ctx.translate(x, y);
    const k = R / 0.19;
    ctx.scale(k, k);

    ctx.restore();
  }

  return { PAL, TEAM, TYPE_SCALE, MOUNTED, drawFigure, drawFaceCloseup, drawThrownSpear, basePose, mixPose, standPose, movePose, ceremonyPose, pieceHeight, spriteFoot, pieceSprite, drawPieceInSquare, drawBoardField, drawStar, seeded, spriteCache };
})();

/** 부대 머리띠용 도트 그림 배경 (훈련소·전방 초소·평원 전투·요새 공방·왕성 결전). 작은 격자에 점을 찍고 캔버스를 확대해 보여준다 */
const Scenes = (() => {
  const C = {
    ink: '#2B2420', white: '#FFFFFF', ivory: '#FAF9F5', ivory2: '#F2F0E8', sand: '#E6E3DD', gray: '#C4C1BC', grayDeep: '#97918A',
    orange: '#D96629', orangeSoft: '#F3B48F', peach: '#F8E7D5', peach2: '#FAF2E7', teal: '#0093A5', tealSoft: '#8FD0D8', tealPale: '#CFE9EC', tealPale2: '#E6F2F3',
    night: '#2B2420', night2: '#3A322E', night3: '#4E463F', dusk: '#F3B48F'
  };
  const DOT = 3;
  const H = 18;
  const GROUND = 14;
  const EXTRA = 4;

  /** 색 문자열을 RGB로 */
  function rgb(hex) { return [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)]; }

  /** 점 격자 (색 이름 문자열을 담는다) */
  function grid(W) {
    const g = { W, H, cells: new Array(W * H).fill(C.ivory) };
    g.set = (x, y, c) => { x = Math.round(x); y = Math.round(y); if (x >= 0 && y >= 0 && x < W && y < H) g.cells[y * W + x] = c; };
    g.rect = (x, y, w, h, c) => { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) g.set(x + i, y + j, c); };
    g.hline = (x0, x1, y, c) => { for (let x = Math.min(x0, x1); x <= Math.max(x0, x1); x++) g.set(x, y, c); };
    g.vline = (x, y0, y1, c) => { for (let y = Math.min(y0, y1); y <= Math.max(y0, y1); y++) g.set(x, y, c); };
    g.tri = (xc, yBase, half, h, c) => { for (let j = 0; j < h; j++) { const w = Math.round(half * (j + 1) / h); g.hline(xc - w, xc + w, yBase - h + 1 + j, c); } };
    g.circle = (xc, yc, r, c) => { for (let y = -r; y <= r; y++) for (let x = -r; x <= r; x++) if (x * x + y * y <= r * r + r * 0.5) g.set(xc + x, yc + y, c); };
    g.dither = (x, y, w, h, c) => { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) if ((i + j) % 2 === 0) g.set(x + i, y + j, c); };
    return g;
  }

  /** 하늘 띠 (위→아래, 경계는 체크무늬로 섞음) */
  function sky(g, bands) {
    const n = bands.length, rows = GROUND;
    for (let y = 0; y < rows; y++) {
      const b = Math.min(n - 1, Math.floor(y / rows * n));
      g.hline(0, g.W - 1, y, bands[b]);
      if (b > 0 && Math.floor((y - 1) / rows * n) !== b) g.dither(0, y, g.W, 1, bands[b - 1]);
    }
  }

  /** 땅 (경계선 + 바닥 + 자갈) */
  function ground(g, rnd, top, bottom, line) {
    g.hline(0, g.W - 1, GROUND, line || C.grayDeep);
    g.rect(0, GROUND + 1, g.W, H - GROUND - 1, top);
    for (let x = 0; x < g.W; x++) if (rnd() < 0.12) g.set(x, GROUND + 1 + Math.floor(rnd() * 3), bottom);
  }

  /** 작은 깃발 (장대 + 삼각 깃발) */
  function flag(g, x, yTop, len, color, dir) {
    g.vline(x, yTop, yTop + len, C.ink);
    g.hline(x + (dir || 1), x + (dir || 1) * 3, yTop, color);
    g.hline(x + (dir || 1), x + (dir || 1) * 2, yTop + 1, color);
  }

  /** 병정 한 명 (머리 고리 + 방패), 백은 속 빈 머리, 흑은 채운 머리 */
  function soldier(g, x, y, black, shield, dir) {
    g.rect(x, y, 3, 3, C.ink);
    if (!black) g.set(x + 1, y + 1, C.white);

    g.set(x + (dir > 0 ? 3 : -1), y - 3, C.grayDeep);
  }

  /** 훈련소: 새벽 하늘, 천막, 울타리, 허수아비, 모닥불 */
  function camp(g, rnd) {
    sky(g, [C.peach, C.peach2, C.ivory]);
    g.circle(Math.round(g.W * 0.1), 3, 2, C.orangeSoft); g.circle(Math.round(g.W * 0.1), 3, 1, C.orange);
    for (let x = 0; x < g.W; x += 11) { const h = 2 + Math.floor(rnd() * 2); g.tri(x + Math.floor(rnd() * 6), 13, 7, h, C.sand); }
    ground(g, rnd, C.sand, C.gray);
    const fenceEnd = Math.round(g.W * 0.4);
    g.hline(1, fenceEnd, 12, C.ink);

    const tents = [0.08, 0.24, 0.52, 0.66];
    tents.forEach((f, i) => {
      const xc = Math.round(g.W * f), h = 6;
      g.tri(xc, 13, 5, h, C.ink);
      g.tri(xc, 13, 4, h - 1, C.white);
      g.hline(xc - 2, xc + 2, 11, C.orange);
      g.tri(xc, 13, 1, 2, C.ink);
      if (i === 2) flag(g, xc, 4, 3, C.orange, 1);
    });
    const dx = Math.round(g.W * 0.92);
    g.vline(dx, 9, 13, C.ink); g.hline(dx - 2, dx + 2, 10, C.ink);
    g.rect(dx - 1, 7, 3, 2, C.ink); g.set(dx, 7, C.white);
    const fx = Math.round(g.W * 0.8);
    g.hline(fx - 1, fx + 1, 13, C.ink);
    g.set(fx, 12, C.orange); g.set(fx - 1, 12, C.orangeSoft); g.set(fx + 1, 12, C.orangeSoft); g.set(fx, 11, C.orangeSoft);
    [[9, 0], [7, 1], [5, 0], [3, -1]].forEach(([y, o]) => g.set(fx + o, y, C.white));
  }

  /** 전방 초소: 노을, 먼 산, 목책, 망루, 소나무 */
  function outpost(g, rnd) {

    if (r >= s.tFight) return T;

    while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (realOf[mid] <= r) lo = mid; else hi = mid - 1; }

    state = null;
    s.b.fight = null;
    s.b.hidden.delete(s.opts.attacker.sq); s.b.hidden.delete(s.opts.defender.sq);
    s.b.draw();
    s.resolve(!immediate);
  }

  /** 흔들림 오프셋 (판 전체를 흔든다) */
  function shakeOffset(now) {
    const s = state;
    if (!s || s.b.reduce) return { x: 0, y: 0 };
    const k = s.shakeAmp * Math.max(0, 1 - (now - s.shakeT) / 240);
    if (k <= 0) return { x: 0, y: 0 };
    return { x: (Math.random() * 2 - 1) * k, y: (Math.random() * 2 - 1) * k };
  }

  /** 입자들을 뿌린다 (불꽃·별·먼지·연기·꽃가루), 좌표는 CSS px, 크기는 칸 기준 */
  function burst(s, x, y, kind, n) {
    const sq = s.sq;
    const pastel = ['#D96629', '#FFFFFF', '#F3B48F', '#D96629', '#0093A5', '#FFFFFF'];
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = (kind === 'smoke' ? 0.08 : kind === 'dust' ? 0.16 : kind === 'confetti' ? 0.28 : 0.5) * sq / 100 * (0.5 + Math.random());
      const p = {
        kind, x, y,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - (kind === 'confetti' ? 0.35 * sq / 100 : kind === 'dust' ? 0.08 * sq / 100 : 0),
        age: 0, life: kind === 'smoke' ? 600 : kind === 'confetti' ? 900 : kind === 'dust' ? 340 : 420,
        size: sq * (kind === 'smoke' ? 0.07 + Math.random() * 0.05 : kind === 'star' ? 0.045 + Math.random() * 0.03 : kind === 'confetti' ? 0.03 : 0.02 + Math.random() * 0.015),
        rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.02,
        color: kind === 'confetti' ? pastel[i % pastel.length] : kind === 'star' ? (i % 3 === 0 ? '#F3B48F' : '#FFFFFF') : kind === 'dust' ? '#E6E3DD' : '#FFFFFF'
      };
      if (kind === 'dust') p.vy = -Math.abs(p.vy);
      s.parts.push(p);
    }
  }

  /** 입자를 시간에 따라 움직인다 */
  function updateParticles(s, dt) {
    const g = s.sq * 0.0015 / 1000;
    for (const p of s.parts) {
      p.age += dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.kind === 'confetti' || p.kind === 'spark') p.vy += g * dt * (p.kind === 'confetti' ? 0.6 : 1.2);
      if (p.kind === 'smoke') { p.vx *= 0.98; p.vy *= 0.98; p.size *= 1.006; }
      p.rot += p.vr * dt;
    }
    s.parts = s.parts.filter(p => p.age < p.life);
  }

  /** 베기 자국을 남긴다: 'v'·'V' 세로, 'd1'·'D1' ＼, 'd2'·'D2' ／ (대문자는 결정타용 큰 자국) */
  function addMark(s, kind, x, y, now) {
    const big = kind === kind.toUpperCase();
    const ang = kind[0].toLowerCase() === 'v' ? -Math.PI / 2 : kind[1] === '1' ? Math.PI / 4 * s.dir : -Math.PI / 4 * s.dir;
    s.marks.push({ x, y, ang, len: s.sq * (big ? 1.15 : 0.8), w: s.sq * (big ? 0.11 : 0.07), t0: now, dur: big ? 420 : 260 });
  }

  /** 시각에 맞춰 효과음·입자·흔들림·자국을 터뜨린다 (장면 시간 u 기준) */
  function fireEvents(s, u, now) {
    const sq = s.sq, gy = s.gy, atk = s.atk;
    const X = (xu) => s.D.x + s.dir * xu * sq;
    const ev = (key, at, fn) => { if (u >= at && !s.fired.has(key)) { s.fired.add(key); fn(); } };
    const Hd = s.Hd, dX = s.defX !== undefined ? s.defX : X(0);
    atk.swings.forEach((sw, i) => ev('swing' + i, sw.u, () => { sw.sfx(); if (sw.stomp) { s.shakeAmp = 4; s.shakeT = now; burst(s, X(s.attX), gy, 'dust', 6); } }));
    atk.steps.forEach((st, i) => ev('step' + i, st.u, () => {
      if (st.hoof) Sfx.hoof(); else if (st.stomp) { Sfx.stomp(0.5); s.shakeAmp = 2; s.shakeT = now; } else if (st.rattle) Sfx.rattle(0.2); else Sfx.step(st.k);
      if (st.heavy) { s.shakeAmp = 2; s.shakeT = now; }
      burst(s, X(s.attX), gy, 'dust', 2);
    }));
    if (atk.slow) ev('slowmo', atk.slow[0], () => Sfx.slowmo());
    atk.hits.forEach((h, i) => ev('hit' + i, h.u, () => {
      h.sfx(); Sfx.buzz(h.kind === 'star' ? 30 : 15);
      s.shakeAmp = h.shake; s.shakeT = now;
      burst(s, dX, gy - Hd * h.y, h.kind, h.kind === 'star' ? 7 : 8);
      if (h.streak) addMark(s, h.streak, dX, gy - Hd * 0.5, now);
    }));
    ev('finish', atk.finisher.impact, () => {
      atk.finisher.sfx(); Sfx.buzz([20, 30, 40]);
      s.shakeAmp = 9; s.shakeT = now; s.flashT = now;
      burst(s, dX, gy - Hd * 0.5, 'star', 9);
      burst(s, dX, gy - Hd * 0.45, 'smoke', 7);
      burst(s, dX, gy, 'dust', 10);
      if (atk.finisher.streak) addMark(s, atk.finisher.streak, dX, gy - Hd * 0.5, now);
      s.impact = { x: dX, y: gy - Hd * 0.5, t: now };
    });
    ev('poof', atk.finisher.impact + FLY - 30, () => { Sfx.poof(); burst(s, s.flyX !== undefined ? s.flyX : dX, s.flyY !== undefined ? s.flyY : gy - Hd * 0.5, 'smoke', 8); });
  }

  /** 다가가기·공방·들어서기·승리 포즈를 시각에 맞춰 그린다 (BoardView.render가 매 프레임 부른다) */

    const s = state;
    if (!s || s.done) return;
    const dt = Math.min(50, now - s.lastT) * s.speed;

    if (el >= s.total) { s.done = true; finish(false); return; }
    updateParticles(s, dt);
    const sq = s.sq, gy = s.gy, dir = s.dir, b = s.b;
    const at = s.at, dtp = s.dt;
    const X = (xu) => s.D.x + dir * xu * sq;
    const zoomIn = 1 + 0.15 * easeInOut(prog(el, 0, 160));
    const zoomOut = 1 + 0.15 * (1 - easeInOut(prog(el, s.total - 160, s.total)));
    const zoom = Math.min(zoomIn, zoomOut);

    let dx = 0, dpose = null, dexpr = 'focus', dRot = 0, dY = 0, dAlpha = 1, dFlash = 0, dShow = true;

      dpose = P(el < 110 ? (Art.MOUNTED[dtp] ? CAV_STANCE : STANCE) : (Art.MOUNTED[dtp] ? CAV_BRACE : GUARD[kindOf(dtp)]));
      dexpr = el < 60 ? 'idle' : 'fight';

      if (apose.running > 0.4) { apose.gallop = (u / 110) % 1; apose.bob = Math.abs(Math.sin(u / 110 * Math.PI)) * 0.05; }
      const Dd = sample(s.def.track, u);
      dpose = Dd.pose; dx = Dd.x; dexpr = Dd.expr || 'focus';
      const hitFlash = s.atk.hits.find(h => u >= h.u && u < h.u + 60);
      if (hitFlash) dFlash = 0.7 * (1 - (u - hitFlash.u) / 60);

        if (tt >= 1) dShow = false;
        s.flyX = X(dx); s.flyY = gy + dY - Hd * 0.5;

    } else {
      dShow = false;
      const r2 = el - s.tA - s.tFight;
      const ex = X(s.endX !== null ? s.endX : HOME + 0.3);
      if (r2 < s.tStep) {
        const p = easeInOut(r2 / s.tStep);
        const px = ex + (s.target.x - ex) * p, py = gy + (s.target.y - gy) * p;
        awalk = { x: px, y: py, travel: p * Math.hypot(s.target.x - ex, s.target.y - gy) / sq };
        ax = (px - s.D.x) / sq * dir;
        if (!s.fired.has('stepin')) { s.fired.add('stepin'); if (at === 2) Sfx.hoof(); else if (at === 3) Sfx.stomp(0.4); else if (at === 4) Sfx.rattle(0.2); else Sfx.step(0.5); }
      } else {
        const w = r2 - s.tStep;
        awalk = null;
        ax = (s.target.x - s.D.x) / sq * dir; ay = s.target.y;
        const win = P(s.atk.win);
        apose = Art.mixPose(P(Art.MOUNTED[at] ? CAV_STANCE : STANCE), win, easeOutBack(Math.min(1, w / 160)));
        aexpr = 'win';
        if (!s.fired.has('win')) { s.fired.add('win'); Sfx.flourish(at); burst(s, s.target.x, s.target.y - Ha * 0.7, 'confetti', 14); }
      }
    }
    s.attX = ax;

    if (vig > 0 && !b.reduce) {
      ctx.save();
      const g = ctx.createRadialGradient(s.D.x, gy - sq * 0.3, sq * 0.9, s.D.x, gy - sq * 0.3, sq * 3.2);
      g.addColorStop(0, 'rgba(43,36,32,0)');
      g.addColorStop(1, 'rgba(43,36,32,' + (0.45 * vig) + ')');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, b.size, b.size);
      ctx.restore();
    }

    const ptsBack = (layer) => drawParticles(ctx, s, layer);
    ctx.save();
    ctx.fillStyle = 'rgba(43,36,32,0.18)';
    const afoot = awalk ? { x: awalk.x, y: awalk.y } : { x: X(ax), y: ay };
    const aCav = !!Art.MOUNTED[at], dCav = !!Art.MOUNTED[dtp];
    ctx.beginPath(); ctx.ellipse(afoot.x, afoot.y + 1, sq * (aCav ? 0.34 : 0.2) * (1 - Math.min(0.5, ajy * 0.5)), sq * 0.05, 0, 0, Math.PI * 2); ctx.fill();
    if (dShow && dAlpha > 0.05 && u < s.atk.finisher.impact) { ctx.beginPath(); ctx.ellipse(X(dx), gy + 1, sq * (dCav ? 0.34 : 0.2), sq * 0.05, 0, 0, Math.PI * 2); ctx.fill(); }
    ctx.restore();
    ptsBack('back');

    if (dShow && dAlpha > 0.01 && dpose) {
      ctx.save();
      const cx = X(dx), cy = gy + dY - Hd * 0.5;
      if (dRot) { ctx.translate(cx, cy); ctx.rotate(dRot); ctx.translate(-cx, -cy); }
      Art.drawFigure(ctx, X(dx), gy + dY, Hd, dtp, dColor, { view: 'side', facing: -dir, pose: dpose, expr: dexpr, alpha: dAlpha, flash: dFlash });
      ctx.restore();
    }

    if (awalk) {
      const face = Math.abs(s.target.x - afoot.x) > 1 && el >= s.tA + s.tFight ? (s.target.x > afoot.x ? 1 : -1) : dir;
      Art.drawFigure(ctx, awalk.x, awalk.y, Ha, at, aColor, { view: 'side', facing: face, pose: Art.movePose(at, awalk.travel, el), expr: 'fight' });
    } else {
      if (u >= 120 && u < 200 && at === 5) drawSpeedLines(ctx, X(ax) - dir * Ha * 0.3, gy - Ha * 0.55, dir, sq, u);
      if (apose.running > 0.4) drawSpeedLines(ctx, X(ax) - dir * Ha * 0.7, gy - Ha * 0.45, dir, sq, u);
      Art.drawFigure(ctx, X(ax), ay - ajy * sq, Ha, at, aColor, { view: 'side', facing: aface * dir, pose: apose, expr: aexpr });
    }

    drawMarks(ctx, s, now);
    if (s.impact) drawImpact(ctx, s, now);
    ptsBack('front');
    const flashAge = now - s.flashT;
    if (flashAge < 130 && !b.reduce) { ctx.save(); ctx.globalAlpha = 0.55 * (1 - flashAge / 130); ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, b.size, b.size); ctx.restore(); }
  }

  /** 베기 자국: 흰 띠에 잉크 테두리, 시간이 지나며 옅어진다 */
  function drawMarks(ctx, s, now) {
    s.marks = s.marks.filter(m => now - m.t0 < m.dur);
    for (const m of s.marks) {
      const k = (now - m.t0) / m.dur;
      const grow = Math.min(1, k * 4);
      ctx.save();
      ctx.globalAlpha = 1 - k * k;
      ctx.translate(m.x, m.y);
      ctx.rotate(m.ang);
      const L = m.len * grow, w = m.w * (1 - k * 0.5);
      ctx.beginPath();
      ctx.moveTo(-L / 2, 0); ctx.quadraticCurveTo(0, -w, L / 2, 0); ctx.quadraticCurveTo(0, w, -L / 2, 0); ctx.closePath();
      ctx.fillStyle = '#FFFFFF'; ctx.fill();
      ctx.lineWidth = Math.max(1, s.sq * 0.02); ctx.strokeStyle = '#2B2420'; ctx.lineJoin = 'round'; ctx.stroke();
      ctx.restore();
    }
  }

  /** 충격 지점의 방사선 */
  function drawImpact(ctx, s, now) {
    const age = now - s.impact.t;
    if (age > 220) { s.impact = null; return; }
    const sq = s.sq, k = age / 220;
    ctx.save();
    ctx.globalAlpha = 1 - k;
    ctx.strokeStyle = '#2B2420'; ctx.lineCap = 'round';
    const rnd = Art.seeded(5);
    for (let i = 0; i < 12; i++) {
      const a = i / 12 * Math.PI * 2 + rnd() * 0.3;
      const r0 = sq * (0.18 + 0.3 * k), r1 = sq * (0.42 + 0.6 * k + rnd() * 0.15);
      ctx.lineWidth = Math.max(1.5, sq * 0.035 * (1 - k));
      ctx.beginPath(); ctx.moveTo(s.impact.x + Math.cos(a) * r0, s.impact.y + Math.sin(a) * r0); ctx.lineTo(s.impact.x + Math.cos(a) * r1, s.impact.y + Math.sin(a) * r1); ctx.stroke();
    }
    ctx.restore();
  }

  /** 돌진할 때 뒤로 남는 속도선 */
  function drawSpeedLines(ctx, x, y, dir, sq, u) {
    ctx.save();
    ctx.strokeStyle = 'rgba(43,36,32,0.3)';
    ctx.lineCap = 'round';
    for (let i = 0; i < 4; i++) {
      const yy = y + (i - 1.5) * sq * 0.09 + Math.sin(u / 40 + i) * 1.5;
      const len = sq * (0.18 + ((i * 37 + Math.floor(u / 30)) % 4) * 0.05);
      ctx.lineWidth = Math.max(1.5, sq * 0.025);
      ctx.beginPath(); ctx.moveTo(x - dir * sq * 0.05, yy); ctx.lineTo(x - dir * (sq * 0.05 + len), yy); ctx.stroke();
    }
    ctx.restore();
  }

  /** 입자를 그린다 (연기·먼지는 뒤, 나머지는 앞) */
  function drawParticles(ctx, s, layer) {
    for (const p of s.parts) {
      const back = p.kind === 'smoke' || p.kind === 'dust';
      if ((layer === 'back') !== back) continue;
      const k = 1 - p.age / p.life;
      ctx.save();
      ctx.globalAlpha = Math.max(0, Math.min(1, k * 1.4));
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      if (back) {
        ctx.fillStyle = p.color;
        ctx.strokeStyle = 'rgba(43,36,32,0.5)'; ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.arc(0, 0, p.size, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      } else if (p.kind === 'star') {
        Art.drawStar(ctx, 0, 0, p.size, p.size * 0.45);
        ctx.fillStyle = p.color; ctx.fill();
        ctx.lineWidth = 1.2; ctx.strokeStyle = '#2B2420'; ctx.stroke();
      } else if (p.kind === 'spark') {
        ctx.fillStyle = p.color;
        ctx.strokeStyle = '#2B2420'; ctx.lineWidth = 1;
        ctx.fillRect(-p.size, -p.size / 3, p.size * 2, p.size * 0.66);
        ctx.strokeRect(-p.size, -p.size / 3, p.size * 2, p.size * 0.66);
      } else {
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.7);
      }
      ctx.restore();
    }
  }

  return { play, skip, get active() { return !!state; } };
})();

/** 0x88 칸 번호를 0~63 칸 번호로 바꾼다 */
function to64(sq88) { return (sq88 >> 4) * 8 + (sq88 & 7); }
/** 0~63 칸 번호를 0x88 칸 번호로 바꾼다 */
function to88(sq64) { return ((sq64 >> 3) << 4) | (sq64 & 7); }
/** 0~63 칸 이름 ('e4') */
function sq64Name(sq) { return 'abcdefgh'[sq & 7] + ((sq >> 3) + 1); }

/** 기물별 이동 시간(ms, 한 칸 기준)과 뛰어오르는 높이(칸 비율): 보병은 걷고, 나이트는 뛰어넘고, 전차는 땅에 붙어 구른다 */
const MOVE_SPEC = { 1: { dur: 300, hop: 0.03 }, 2: { dur: 340, hop: 0.42 }, 3: { dur: 340, hop: 0.06 }, 4: { dur: 300, hop: 0.02 }, 5: { dur: 280, hop: 0.05 }, 6: { dur: 320, hop: 0.02 } };

/** 체스판 캔버스 (풀밭 칸·하이라이트·기물·이동 애니메이션·터치) */
class BoardView {
  /** 캔버스와 옵션으로 체스판을 만든다 */
  constructor(canvas, opts) {
    opts = opts || {};
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.size = 0; this.sq = 0; this.dpr = 1;
    this.flipped = false;
    this.coords = opts.coords !== false;
    this.hints = opts.hints !== false;
    this.letters = !!opts.letters;
    this.pieces = new Int8Array(64);
    this.selected = -1;
    this.selT = 0;
    this.targets = new Map();
    this.lastMove = null;
    this.checkSq = -1; this.checkT = 0;
    this.hidden = new Set();
    this.ghosts = null;
    this.marks = new Map();
    this.anims = [];
    this.effects = [];
    this.fight = null;
    this.ceremony = null;
    this.onTap = null;
    this.field = null; this.coordLayer = null;
    this.raf = 0;
    this.reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    canvas.addEventListener('pointerdown', (e) => this.handlePointer(e));
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());
  }

  /** 화면 크기(CSS px)에 맞춰 캔버스를 다시 만든다 */
  resize(cssSize) {
    const size = Math.max(64, Math.floor(cssSize / 8) * 8);
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    if (size === this.size && dpr === this.dpr && this.field) return;
    this.size = size; this.dpr = dpr; this.sq = size / 8;
    this.canvas.width = Math.round(size * dpr);
    this.canvas.height = Math.round(size * dpr);
    this.canvas.style.width = size + 'px';
    this.canvas.style.height = size + 'px';
    this.buildLayers();
    this.draw();
  }

  /** 풀밭 배경과 좌표 레이어를 미리 그려 둔다 */
  buildLayers() {
    const px = Math.round(this.size * this.dpr);
    this.field = document.createElement('canvas');
    this.field.width = px; this.field.height = px;
    const f = this.field.getContext('2d');
    f.scale(this.dpr, this.dpr);
